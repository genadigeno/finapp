spring:
  application:
    name: finapp

  # ---------------------------------------------------------------------------
  # Database.
  #
  # NO SECRET IS COMMITTED HERE, and that is enforced rather than promised:
  # CommittedConfigurationHoldsNoSecretTest fails the build if any credential-named key in
  # any committed configuration file holds a literal other than the one marked local
  # default. It exists because the CI secret scanner does NOT catch this shape - `password:
  # hunter2` has nothing about it to detect - so "scanning green" and "no secret in the
  # repository" are different claims (ADR-0020).
  #
  # A NAME IS NOT A CONTROL. DatabaseCredentialGuard refuses to start when this default is
  # aimed at a database that is not on loopback, which closes the one documented way around
  # the whole scheme: forgetting to set the variable.
  #
  # The same environment variables are read by compose.yaml, platform/build.gradle.kts and
  # infra/postgres/initdb/00-roles.sql, so overriding one moves the container, the migration
  # tool and the application together rather than only one.
  #
  # See docs/architecture/SECRET_MANAGEMENT.md.
  #
  # LEAST PRIVILEGE: the application connects as finapp_app, never as the bootstrap
  # superuser. finapp_app holds per-table DML and nothing else, which is what makes
  # INV-HIST-03 (audit records are append-only) enforceable at all - a superuser ignores
  # every permission check.
  # ---------------------------------------------------------------------------
  datasource:
    url: ${FINAPP_DB_URL:jdbc:postgresql://127.0.0.1:5432/${FINAPP_DB_NAME:finapp}}
    username: ${FINAPP_DB_APP_USER:finapp_app}
    password: ${FINAPP_DB_APP_PASSWORD:local-development-only-not-a-secret}
    hikari:
      # A readiness check that hangs reports nothing. The orchestrator's probe times out and
      # what it concludes from that is its own business - so every wait on the readiness path
      # is explicitly bounded here rather than left to a default measured in tens of seconds.
      #
      # How long to wait for a connection FROM THE POOL. Exceeding it is the pool being
      # exhausted, which is a genuine reason to stop taking traffic.
      connection-timeout: 5000
      validation-timeout: 2000

      # POOL SIZE, and the arithmetic behind it (P1-TSK-004).
      #
      # Small on purpose. A pool is not a budget to spend: every connection is a backend
      # process on the server, and PostgreSQL throughput stops improving once the machine's
      # cores are busy - past that, extra connections queue INSIDE the database, where the
      # queueing is invisible to the application and shows up as latency on every query
      # rather than as a timeout on one.
      #
      # The fleet must also fit. 10 instances x 8 = 80, against 100 max_connections less 12
      # reserved = 88. ConnectionPoolSizingGuard refuses to start if that stops holding, and
      # the numbers below are what it reads - see finapp.database.
      #
      # minimum-idle EQUALS maximum-pool-size, so the pool is fixed-size. That is what
      # HikariCP recommends, and it is what makes the arithmetic meaningful: a pool that only
      # sometimes reaches its maximum would make the check a statement about the average, and
      # a server is exhausted by the worst case.
      maximum-pool-size: 8
      minimum-idle: 8
      data-source-properties:
        # How long to wait for the TCP connect, in seconds. The driver's default is 10, which
        # is longer than a probe interval; a blackholed database would otherwise leave
        # readiness unanswered rather than negative.
        connectTimeout: 5
        # socketTimeout is deliberately NOT set. It bounds how long a QUERY may run, and
        # choosing that number without any real queries to measure would be a guess that
        # aborts legitimate work later. It belongs with Phase 3, where the queries exist.
        ApplicationName: finapp

# ---------------------------------------------------------------------------
# The connection-limit arithmetic (P1-TSK-004, ADR-0014).
#
# Three numbers that live in three different places - the pool size is application
# configuration, the instance count is a deployment's replica count, and max_connections is a
# database setting - so nothing brings them together and nothing notices when one moves. Each
# is changed by someone with no reason to be thinking about the other two; scaling from eight
# instances to twelve is an ordinary operational act.
#
# Declared here and checked by ConnectionPoolSizingGuard at startup. The defaults below are
# PostgreSQL's own defaults and a deliberately modest fleet, which is what makes them safe as
# defaults: they describe the smallest realistic deployment rather than an aspiration. A real
# deployment states its own.
#
# THE GUARD CANNOT VERIFY server-max-connections against the live server, and does not pretend
# to - it runs before the pool is used, and one that queried the database would fail for a
# database that is merely down. It is a DECLARATION, and a wrong declaration is a wrong answer.
# ---------------------------------------------------------------------------
finapp:
  database:
    # ADR-0014: N is never 1.
    instances: ${FINAPP_DB_INSTANCES:10}
    server-max-connections: ${FINAPP_DB_SERVER_MAX_CONNECTIONS:100}
    # PostgreSQL reserves 3 for superusers, so they were never ours. The rest is operational
    # headroom: a migration runs as finapp_migrator during a deploy, and an operator diagnosing
    # an incident connects with psql. If the fleet is sized to consume every remaining
    # connection, the one thing nobody can do when the fleet is in trouble is connect to the
    # database to find out why.
    reserved-connections: ${FINAPP_DB_RESERVED_CONNECTIONS:12}

# ---------------------------------------------------------------------------
# Logging (P0-TSK-030).
#
# ECS JSON on the console, in every environment including a developer's machine. Human-readable
# locally and JSON in production is the class of difference this project rejects elsewhere for the
# same reason: a redaction defect that only manifests in the encoder a deployment uses would be
# invisible to everyone who never runs that encoder. compose.yaml pins the same images as the
# tests on exactly this argument.
#
# Correlation reaches a log line through the MDC, which the ECS format lifts into the document -
# so `correlationId`, `traceId` and `spanId` are queryable fields rather than text inside a
# message. That is what makes a log line joinable to a trace and to the durable record.
#
# To read logs by eye locally, override on the command line rather than editing this file:
#   ./gradlew :app:bootRun --args='--logging.structured.format.console='
# ---------------------------------------------------------------------------
logging:
  structured:
    format:
      console: ecs

# ---------------------------------------------------------------------------
# Tracing (P0-TSK-028).
#
# No exporter endpoint is configured here. Where traces are sent is a deployment decision, not a
# source-code one, and a committed endpoint is either wrong everywhere or a hostname nobody meant
# to publish. Spans are recorded regardless; without an exporter they are simply dropped, which is
# what a developer's machine should do.
# ---------------------------------------------------------------------------
management:
  # Spring Boot 4 gates the OpenTelemetry SDK behind this, and it is off unless asked for. With
  # only the bridge on the classpath there is no SdkTracerProvider and no real Tracer, so spans
  # are recorded into a no-op and silently dropped - a tracing setup that looks configured and
  # produces nothing. Stated explicitly rather than relied upon, for the same reason the health
  # probes are: behaviour that differs between environments is behaviour nobody can rely on.
  opentelemetry:
    enabled: true

  # Metrics (P0-TSK-029).
  #
  # No `common-tags` for instance or host. An instance identifier is exactly the unbounded tag
  # value MetricNames forbids: in a fleet that scales, every replica multiplies every series, and
  # Prometheus already attaches the target it scraped. Which instance a sample came from is the
  # scraper's question, not ours.
  prometheus:
    metrics:
      export:
        enabled: true

  tracing:
    sampling:
      # Every request, deliberately, and only for now. Phase 0 has no traffic, so sampling would
      # buy nothing and would make an already-rare failure rarer to catch. This number is a load
      # decision and belongs with Phase 15, where there is load to measure - a financial platform
      # that samples at 1% cannot explain the one payment a customer is asking about.
      probability: 1.0

# ---------------------------------------------------------------------------
# Operational endpoints (P0-TSK-027).
#
# Deliberately unversioned: they are consumed by orchestrators and scrapers whose
# configuration is deployment-scoped, not by API clients holding a contract, and moving
# them on a version bump would break a liveness probe for no benefit (ADR-0015).
# ---------------------------------------------------------------------------
  endpoints:
    web:
      exposure:
        # An ALLOW-LIST, written out even though `health` alone is the framework default.
        # The other endpoints exist as beans whether or not they are reachable - /env,
        # /configprops, /beans, /heapdump, /threaddump - and each is one property away from
        # being served. A heap dump is every secret the process has ever held; /env is the
        # configuration; /beans is a map of the application. Naming the two that are wanted
        # means a third arrives only by someone editing this line.
        # `prometheus` joins the allow-list here, and it is a deliberate widening of an
        # unauthenticated surface rather than a routine addition. A scrape publishes JVM
        # internals, HTTP route templates and pool statistics - not secrets, but a description of
        # the running system. Two things make it acceptable, and both are conditions rather than
        # opinions: the CONTENT is controlled, because MetricNames forbids any tag whose value a
        # request can influence and MetricConventionTest fails the build on one; and the exposure
        # is recorded as debt owned by P0-EPIC-10, alongside health and info.
        include: health,info,prometheus

  endpoint:
    health:
      # WHAT is wrong is not published, only THAT something is.
      #
      # A detailed health response names the JDBC URL, the driver, the validation query and
      # which dependency is down - which is reconnaissance, and there is no authentication in
      # front of it yet. The aggregate status is what an orchestrator acts on; an operator
      # gets the detail from logs and metrics, which are not anonymously readable.
      #
      # `when-authorized` becomes the right setting once P0-EPIC-10 provides an authority to
      # be authorized against. Until then this is the honest choice.
      show-details: never
      show-components: never

      probes:
        # Serves /actuator/health/liveness and /actuator/health/readiness. Enabled
        # explicitly: Spring turns these on by itself only when it detects Kubernetes, and an
        # endpoint that exists in one environment and not another is not an endpoint anyone
        # can rely on.
        enabled: true

      group:
        # LIVENESS ANSWERS ONE QUESTION: is this process broken beyond recovery, so that
        # killing it would help? Nothing external belongs here, and that is not a
        # simplification - it is the difference between a degradation and an outage. A
        # liveness probe that checked PostgreSQL would restart every instance during a
        # thirty-second database blip, all at once, and the fleet would then reconnect in a
        # herd to a database that was already struggling.
        liveness:
          include: livenessState

        # READINESS ANSWERS A DIFFERENT ONE: should this instance receive traffic? An
        # instance that cannot reach the transactional source of truth can serve nothing
        # financial, so `db` is included.
        #
        # THIS LINE IS THE TASK. Spring's default readiness group is `readinessState` alone,
        # so adding the actuator and a DataSource yields a readiness endpoint that returns UP
        # while PostgreSQL is unreachable - the opposite of what it is for, and indisting-
        # uishable from working. HealthEndpointTest fails if this is reverted.
        readiness:
          include: readinessState,db

  info:
    build:
      # Group, artifact, version and name, from META-INF/build-info.properties. No timestamp:
      # see the buildInfo block in app/build.gradle.kts.
      enabled: true
    env:
      # Would publish every `info.*` configuration property. Off by default in Spring; said
      # out loud because turning it on is a one-line mistake with a configuration leak behind
      # it.
      enabled: false
    java:
      # JVM vendor and version. Free reconnaissance for anyone matching a CVE to a target.
      enabled: false
    os:
      enabled: false
