# A .properties file, DELIBERATELY not application.yaml: a test-resources application.yaml would
# SHADOW the main one (same name, test classpath first) and every test would run against a
# configuration that is not the application's. Spring loads .properties AND .yaml together, so
# this overlays exactly the keys it names and nothing else.
#
# The outbox relay schedule is a background worker; running it under every @SpringBootTest would
# mutate outbox rows mid-assertion and turn deterministic tests into races. The kafka tier
# exercises the schedule deliberately (P2-TSK-001).
finapp.outbox.relay.enabled=false
# The inbox consumer loop, for the identical reason (P2-TSK-002): the kafka tier runs it
# deliberately, and every other @SpringBootTest must not have a background thread consuming.
finapp.inbox.consumer.enabled=false
# The provider endpoint, so the conditional kyc surface EXISTS in every app test context
# (P2-TSK-011): without it the published OpenAPI contract would silently omit the callback
# endpoint the plan's §7 table declares, and the route-scanning guards (endpoint rules, schema
# checks) would never see it. Port 9 is the discard port - the adapters instantiate and nothing
# in these contexts calls them; suites that drive providers override this with their own
# @DynamicPropertySource URL, which takes precedence over this file.
finapp.kyc.provider.url=http://127.0.0.1:9
# The payments provider endpoint, for the identical reason (P5-TSK-012): the conditional
# webhook door (and the confirm/capture command beans that share its condition) must EXIST in
# every app test context, or the published contract would silently omit the second
# machine-facing route. Same discard port; suites that drive the provider override this with
# their own @DynamicPropertySource URL. The one suite that needs the UNCONFIGURED deployment
# (PaymentSurfaceUnconfiguredDatabaseTest) opts out explicitly with the property set to
# "false" - @ConditionalOnProperty's own non-match value.
finapp.payments.provider.url=http://127.0.0.1:9
# The payment sweeper's schedule, for the relay's identical reason (P5-TSK-014): a
# background worker resolving payments under every @SpringBootTest would race assertions.
# The database suite drives sweep() directly; production defaults to enabled.
finapp.payments.sweeper.enabled=false
# The instant scheme endpoint, for the payments provider's reason (P7-TSK-009): the
# conditional confirmation-callback door must EXIST in every app test context, or the
# published contract would silently omit the THIRD machine-facing route. Same discard
# port; suites that drive the scheme override it. Setting it also instantiates the
# withdrawal and pay-in resolution sweeps, so their schedules take the payment sweeper's
# flag discipline below - the database suites drive sweep() directly.
finapp.payments.instant.url=http://127.0.0.1:9
finapp.payments.withdrawal.sweeper.enabled=false
finapp.payments.payin.sweeper.enabled=false
finapp.payments.return.sweeper.enabled=false
# The dispute-response resolution sweep (P7-TSK-014) rides the card provider's condition, so
# every app context instantiates it; its schedule takes the same flag discipline.
finapp.payments.dispute-response.sweeper.enabled=false
finapp.checkout.sweeper.enabled=false
# The payout destination effectuation (P6-TSK-011), for the same reason; the database suite
# drives sweep() directly.
finapp.merchant.payout-destination.effectuation.enabled=false
# The payout provider (P6-TSK-012), for the payments provider's reason: the command and the
# resolution sweep share its condition, and must EXIST in every app test context so the
# published contract never silently loses the payout routes' behaviour. Same discard port;
# suites that drive the provider override it with their own URL. The resolution sweep's
# schedule is off for the relay's reason; the database suite drives sweep() directly.
finapp.merchant.payout.provider.url=http://127.0.0.1:9
finapp.merchant.payout.sweeper.enabled=false
# The payout return worker (P8-TSK-019), for the identical reason: its database suites drive
# sweep() directly, never a background tick racing their assertions.
finapp.merchant.payout.return.sweeper.enabled=false
# The settlement pull (P8-TSK-021), for the identical reason: its database suites drive the
# pull and the sweep directly, never a background tick fetching beside their assertions.
finapp.settlement.pull.sweeper.enabled=false
# The reference-rate fetch (P9-TSK-005), for the identical reason: its suites drive
# ReferenceRateFetch.fetchOnce() directly, never a background tick fetching beside them.
finapp.fx.rate.sweeper.enabled=false
# The FX quote expiry sweep (P9-TSK-008), for the identical reason: its suites drive
# FxQuoteExpirySchedule.sweepOnce() directly, never a background tick expiring beside them.
finapp.fx.quote.expiry.sweeper.enabled=false
# The FX cover sweep and its post-commit nudge (P9-TSK-012), for the identical reason: the cover
# suites drive FxCoverDispatch directly, never a background send beside their assertions.
finapp.fx.cover.sweeper.enabled=false
# P9-TSK-020: the outbound credit resolution sweep - the suites drive it.
finapp.payments.outbound.sweeper.enabled=false
finapp.fx.cover.nudge.enabled=false
# The counterparty screening retry (P9-TSK-016), for the identical reason: its suites drive
# CounterpartyScreeningRetrySchedule.sweepOnce() directly, never a background retry beside them.
finapp.kyc.counterparty.sweeper.enabled=false
# The settlement intake's parse leg (P8-TSK-008), for the relay's identical reason: the
# database suites drive FileParsing.sweep() directly, in their own transactions.
finapp.settlement.intake.sweeper.enabled=false
# The matcher's run leg (P8-TSK-011), for the relay's identical reason: the database
# suites drive Matching.sweep() directly, in their own transactions.
finapp.reconciliation.matching.sweeper.enabled=false
# Time's observers (P8-TSK-013), for the relay's identical reason: the database suites
# drive ReconciliationSweep.sweep() directly, in their own transactions.
finapp.reconciliation.sweep.enabled=false
