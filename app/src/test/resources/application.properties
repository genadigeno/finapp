# A .properties file, DELIBERATELY not application.yaml: a test-resources application.yaml would
# SHADOW the main one (same name, test classpath first) and every test would run against a
# configuration that is not the application's. Spring loads .properties AND .yaml together, so
# this overlays exactly the keys it names and nothing else.
#
# The outbox relay schedule is a background worker; running it under every @SpringBootTest would
# mutate outbox rows mid-assertion and turn deterministic tests into races. The kafka tier
# exercises the schedule deliberately (P2-TSK-001).
finapp.outbox.relay.enabled=false
# The inbox consumer loop, for the identical reason (P2-TSK-002): the kafka tier runs it
# deliberately, and every other @SpringBootTest must not have a background thread consuming.
finapp.inbox.consumer.enabled=false
