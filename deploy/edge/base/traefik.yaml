# The public edge's static configuration (P15-TSK-011, ADR-0120 decision 6). traefik-operator.yaml is this file with longer read and
# write timeouts, and EdgeManifestsTest holds that as the only difference. infra/scripts/edge-check.sh runs these bytes in the pinned
# image against a stand-in backend, and the defaults stated here are stated because several of them are the unsafe ones.
global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  # The one listener a client can reach. TLS on every router, and there is no port 80: a redirect would first carry the
  # request in the clear, credentials and all.
  websecure:
    address: ":8443"
    # Every X-Forwarded-* and X-Real-Ip from the client is dropped and rewritten from the connection, because no address
    # is trusted (insecure false, no trustedIPs). A cloud load balancer in front is layer 4 and adds no header.
    forwardedHeaders:
      insecure: false
    http:
      tls: {}
      # ".." "." and "//" are resolved before a router matches. Spring's matcher and Tomcat would otherwise see a different path.
      sanitizePath: true
      # Header-name aliases of a forwarded header (X_Forwarded_For) never reach a backend. Default: keep.
      aliasHeadersStrategy: delete
      # Twice Tomcat's own 8 KiB, so the application still answers an over-long header itself.
      maxHeaderBytes: 16384
      # Every one of these defaults to ALLOWED. An encoded slash, backslash, NUL, semicolon, percent, question mark or hash in
      # a path has no legitimate use on this API, and each is how a path allow-list has been walked around.
      encodedCharacters:
        allowEncodedSlash: false
        allowEncodedBackSlash: false
        allowEncodedNullCharacter: false
        allowEncodedSemicolon: false
        allowEncodedPercent: false
        allowEncodedQuestionMark: false
        allowEncodedHash: false
    transport:
      respondingTimeouts:
        # The whole request, body included: what one source can hold a body open for. A legitimate 1 MiB body needs 50 KiB/s.
        readTimeout: 20s
        # Above the read, the replica's answer (responseHeaderTimeout, 60 s) and the time to send it. Go starts this at the request's headers.
        writeTimeout: 120s
        idleTimeout: 180s
      lifeCycle:
        # Keep accepting while the load balancer drops this pod, then drain. Below the pod's grace (45 s).
        requestAcceptGraceTimeout: 10s
        graceTimeOut: 30s
  # /ping and the scrape; never on a Service.
  management:
    address: ":8081"

ping:
  entryPoint: management

metrics:
  prometheus:
    entryPoint: management

providers:
  # The file provider and nothing else, so no controller holds a Kubernetes credential and no one can add a route except by
  # changing this repository. Watched, because a renewed certificate arrives by swapping the mounted volume.
  file:
    directory: /etc/finapp-edge/dynamic
    watch: true

# OTLP logs are still experimental in the pinned proxy: the flag is what turns on the two otlp blocks below (P16-TSK-003).
experimental:
  otlpLogs: true

# ERROR, because the kubelet's timestamped directory is read a second time under watch and every object warns once per load.
# Shipped to the collector's platform receiver (P16-TSK-003; THREAT_MODEL.md section 6 item 43 (b)), never the application's 4318.
log:
  level: ERROR
  otlp:
    serviceName: finapp-edge
    http:
      endpoint: http://finapp-collector.finapp-observability.svc.cluster.local:4319/v1/logs

# The access log, shipped the same way (P16-TSK-003). Every request header is dropped and every query string too, before anything leaves
# the proxy, its console included: a query can carry an identifier or a token, and the routes take none. dualOutput keeps the console's copy
# while the collector is away, as the kubelet keeps it; the export is asynchronous and bounded, so a collector away costs a request nothing.
# What the collector keeps of a line, and what it drops by name (the client's and the backend's addresses, the host), is
# deploy/observability/base/collector.yaml's transform/scrub-platform.
accessLog:
  format: json
  dualOutput: true
  fields:
    headers:
      defaultMode: drop
    queryParameters:
      defaultMode: drop
  otlp:
    serviceName: finapp-edge
    http:
      endpoint: http://finapp-collector.finapp-observability.svc.cluster.local:4319/v1/logs
