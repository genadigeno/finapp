# The internet's surface, everything but the routes themselves (P15-TSK-011, ADR-0120 decision 6). public-routes.yaml is generated
# beside this file and names these middlewares.
http:
  services:
    finapp-app:
      loadBalancer:
        serversTransport: no-reuse
        # The client's Host header stops here. Nothing in the application needs it.
        passHostHeader: false
        servers:
          - url: "http://finapp-app.finapp.svc.cluster.local:8080"

  serversTransports:
    # Every request is its own connection through the Service, so kube-proxy picks a ready replica per request: no affinity,
    # and no idle connection to race Tomcat's keep-alive. No retry middleware anywhere: the edge never replays a request that
    # moves money. Phase 16 measures whether the connection cost matters.
    no-reuse:
      maxIdleConnsPerHost: -1
      forwardingTimeouts:
        dialTimeout: 5s
        # A replica that accepted a request and never answers would hold it, and its spool, for ever. Above the application's own
        # 30 s drain, the longest a request is ever expected to run; EdgeManifestsTest reads that number.
        responseHeaderTimeout: 60s

  middlewares:
    # The application sets none of these; a test holds that, so nothing is set twice.
    edge-headers:
      headers:
        stsSeconds: 31536000
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        contentSecurityPolicy: "default-src 'none'; frame-ancestors 'none'"
        customRequestHeaders:
          # RFC 7239's header and a prefix a framework might honour. Neither is read today; neither reaches a replica.
          Forwarded: ""
          X-Forwarded-Prefix: ""
          # No route upgrades a connection. Should the application ever enable HTTP/2 in the clear, an h2c upgrade forwarded here would be
          # a tunnel past every rule in this file.
          Upgrade: ""
          # WHICH SURFACE THIS IS (P15-TSK-042). Set, not added: the proxy replaces every value a client sent under this name, in any
          # case, any number of times, or named in Connection, so the application reads one value and it is this edge's. Staff are
          # refused at the doors that sign in, step up, enrol, change a password or recover on this surface. The word is believed only
          # because finapp-app-ingress admits no pod but the two controllers to the application's port (a host-network process on
          # the pod's node is the policy's own exception, and could reach the operator routes directly anyway). edge-check.sh proves
          # the replacement on the pinned proxy; EdgeManifestsTest holds the name and the word to the application's.
          X-Finapp-Surface: public

    # Above the application's own limit, so the application answers its own 413 and the edge only stops the gross case. Every
    # provider's bound is inside this: a limit at the edge never cuts a signed delivery. EdgeAllowListTest reads both numbers.
    body-cap:
      buffering:
        maxRequestBodyBytes: 2097152
        memRequestBodyBytes: 65536
        # Past 64 KiB either way, a body spools to the controller's memory-backed /tmp (controllers.yaml). A response over this answers 500.
        # The application's largest public response is a dispute document, base64 and under 1 MiB.
        maxResponseBodyBytes: 8388608
        memResponseBodyBytes: 65536

    # COARSE. One bucket per source per controller replica, and per tier: the routes of a tier are one router (EdgeRoutes), because the
    # pinned proxy builds a middleware once per router that names it (measured, edge-check.sh's two-route burst). The real ceiling is the
    # number here times the controller count; P15-TSK-022's limit, arbitrated in PostgreSQL, is the one that counts. The key is the
    # connection's address, stated rather than defaulted: inFlightReq's default is the Host header, which the client chooses. An IPv6
    # client is grouped by its /64. Reference numbers, calibrated by Phase 16.
    source-door:
      rateLimit:
        average: 10
        period: 1s
        burst: 20
        sourceCriterion: {ipStrategy: {ipv6Subnet: 64}}
    source-session:
      rateLimit:
        average: 50
        period: 1s
        burst: 100
        sourceCriterion: {ipStrategy: {ipv6Subnet: 64}}
    # Merchant servers and providers each arrive from a few addresses, so they get more room than a phone behind one.
    source-machine:
      rateLimit:
        average: 200
        period: 1s
        burst: 400
        sourceCriterion: {ipStrategy: {ipv6Subnet: 64}}
    source-callback:
      rateLimit:
        average: 500
        period: 1s
        burst: 1000
        sourceCriterion: {ipStrategy: {ipv6Subnet: 64}}

    # WHAT ONE SOURCE CAN HOLD AT ONCE. Buffering runs before anything authenticates, so a body is the only thing the edge can count before
    # it has spent on one. 5 + 20 + 20 + 20 = 65 requests at the 2 MiB cap is 130 MiB per source per replica, under the 256 MiB spool
    # (controllers.yaml), and EdgeAllowListTest holds that sum against both numbers. Several sources together can still fill the spool:
    # then a body past 64 KiB answers 500 and everything smaller is served. THREAT_MODEL.md section 6 item 22.
    hold-door:
      inFlightReq:
        amount: 5
        sourceCriterion: {ipStrategy: {ipv6Subnet: 64}}
    hold-session:
      inFlightReq:
        amount: 20
        sourceCriterion: {ipStrategy: {ipv6Subnet: 64}}
    hold-machine:
      inFlightReq:
        amount: 20
        sourceCriterion: {ipStrategy: {ipv6Subnet: 64}}
    hold-callback:
      inFlightReq:
        amount: 20
        sourceCriterion: {ipStrategy: {ipv6Subnet: 64}}

tls:
  options:
    default:
      minVersion: VersionTLS12
      # A handshake naming nothing this edge holds is refused, not answered with a default certificate.
      sniStrict: true
  certificates:
    - certFile: /etc/finapp-edge/dynamic/tls.crt
      keyFile: /etc/finapp-edge/dynamic/tls.key
