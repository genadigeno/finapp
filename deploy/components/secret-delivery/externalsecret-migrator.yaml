# What finapp-migrator reads through envFrom (P15-TSK-018, ADR-0123): the URL, its own user and its own password, and
# nothing else. The application's keys never reach this Job, and the master credential never reaches a Secret at all
# (SECRET_MANAGEMENT.md section 3). The decisions on the fields are the application's ExternalSecret's, read there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finapp-migrator-secrets
  annotations:
    # Changed by a commit, and only by one: the operator reads the store when this object changes, and at no other time.
    finapp/rotation-generation: "0"
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    kind: SecretStore
    name: finapp-migrator-store
  target:
    name: finapp-migrator-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: FINAPP_DB_MIGRATOR_PASSWORD
      remoteRef:
        key: FINAPP_DB_MIGRATOR_PASSWORD
    - secretKey: FINAPP_DB_MIGRATOR_USER
      remoteRef:
        key: FINAPP_DB_MIGRATOR_USER
    - secretKey: FINAPP_DB_URL
      remoteRef:
        key: FINAPP_DB_URL
