    - secretKey: FINAPP_PAYMENTS_DISPUTE_EVIDENCE_V2_KEY
      remoteRef:
        key: FINAPP_PAYMENTS_DISPUTE_EVIDENCE_V2_KEY
    - secretKey: FINAPP_PAYMENTS_DISPUTE_EVIDENCE_V3_KEY
      remoteRef:
        key: FINAPP_PAYMENTS_DISPUTE_EVIDENCE_V3_KEY
    - secretKey: FINAPP_PAYMENTS_EVIDENCE_KEY
      remoteRef:
        key: FINAPP_PAYMENTS_EVIDENCE_KEY
    - secretKey: FINAPP_PAYMENTS_EVIDENCE_V2_KEY
      remoteRef:
        key: FINAPP_PAYMENTS_EVIDENCE_V2_KEY
    - secretKey: FINAPP_PAYMENTS_EVIDENCE_V3_KEY
      remoteRef:
        key: FINAPP_PAYMENTS_EVIDENCE_V3_KEY
    - secretKey: FINAPP_PAYMENTS_INSTANT_KEY
      remoteRef:
        key: FINAPP_PAYMENTS_INSTANT_KEY
    - secretKey: FINAPP_PAYMENTS_INSTANT_WEBHOOK_KEY
      remoteRef:
        key: FINAPP_PAYMENTS_INSTANT_WEBHOOK_KEY
    - secretKey: FINAPP_PAYMENTS_INSTANT_WEBHOOK_PREVIOUS_KEY
      remoteRef:
