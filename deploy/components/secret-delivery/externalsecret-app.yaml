# What finapp-app reads through envFrom (P15-TSK-018, ADR-0123). One ExternalSecret per workload with one entry per secret:
# the operator writes the Secret in one operation, so no pod can read part of a generation. Every entry is a row of
# docs/architecture/SECRET_MANAGEMENT.md section 3, and SecretInventoryIsCompleteTest holds the two equal both ways.
#
# refreshPolicy: OnChange and refreshInterval: 0s are a decision, not a default: a value that changed on the operator's
# clock would reach a pod that crashed and restarted before the fleet had been rolled onto it. The store is read when
# this object changes. Owner: deleting this object deletes its Secret, so no credential stays in etcd with nothing owning
# it. Retain: a store that stops answering, or an entry removed, never strips a Secret from running workloads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finapp-app-secrets
  annotations:
    # Changed by a commit, and only by one: the operator reads the store when this object changes, and at no other time.
    finapp/rotation-generation: "0"
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    kind: SecretStore
    name: finapp-app-store
  target:
    name: finapp-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: FINAPP_CORRIDOR_PROVIDER_B_KEY
      remoteRef:
        key: FINAPP_CORRIDOR_PROVIDER_B_KEY
    - secretKey: FINAPP_CORRIDOR_PROVIDER_KEY
      remoteRef:
        key: FINAPP_CORRIDOR_PROVIDER_KEY
    - secretKey: FINAPP_CORRIDOR_REPORT_KEY
      remoteRef:
        key: FINAPP_CORRIDOR_REPORT_KEY
    - secretKey: FINAPP_CORRIDOR_WEBHOOK_KEY
      remoteRef:
        key: FINAPP_CORRIDOR_WEBHOOK_KEY
    - secretKey: FINAPP_CREDIT_EVIDENCE_KEY
      remoteRef:
        key: FINAPP_CREDIT_EVIDENCE_KEY
    - secretKey: FINAPP_DB_APP_PASSWORD
      remoteRef:
        key: FINAPP_DB_APP_PASSWORD
    - secretKey: FINAPP_DB_APP_USER
      remoteRef:
        key: FINAPP_DB_APP_USER
    - secretKey: FINAPP_DB_REPORTING_PASSWORD
      remoteRef:
        key: FINAPP_DB_REPORTING_PASSWORD
    - secretKey: FINAPP_DB_REPORTING_USER
      remoteRef:
        key: FINAPP_DB_REPORTING_USER
    - secretKey: FINAPP_DB_URL
      remoteRef:
        key: FINAPP_DB_URL
    - secretKey: FINAPP_DOC_KEY
      remoteRef:
        key: FINAPP_DOC_KEY
    - secretKey: FINAPP_FX_EVIDENCE_KEY
      remoteRef:
        key: FINAPP_FX_EVIDENCE_KEY
    - secretKey: FINAPP_FX_PROVIDER_B_KEY
      remoteRef:
        key: FINAPP_FX_PROVIDER_B_KEY
    - secretKey: FINAPP_FX_PROVIDER_KEY
      remoteRef:
        key: FINAPP_FX_PROVIDER_KEY
    - secretKey: FINAPP_FX_REFERENCE_KEY
      remoteRef:
        key: FINAPP_FX_REFERENCE_KEY
    - secretKey: FINAPP_FX_REPORT_KEY
      remoteRef:
        key: FINAPP_FX_REPORT_KEY
    - secretKey: FINAPP_FX_WEBHOOK_KEY
      remoteRef:
        key: FINAPP_FX_WEBHOOK_KEY
    - secretKey: FINAPP_KAFKA_BOOTSTRAPSERVERS
      remoteRef:
        key: FINAPP_KAFKA_BOOTSTRAPSERVERS
    - secretKey: FINAPP_KAFKA_SASL_PASSWORD
      remoteRef:
        key: FINAPP_KAFKA_SASL_PASSWORD
    - secretKey: FINAPP_KAFKA_SASL_USERNAME
      remoteRef:
