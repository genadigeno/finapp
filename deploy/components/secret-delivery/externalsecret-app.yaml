# What finapp-app reads through envFrom (P15-TSK-018, ADR-0123). One ExternalSecret per workload with one entry per secret:
# the operator writes the Secret in one operation, so no pod can read part of a generation. Every entry is a row of
# docs/architecture/SECRET_MANAGEMENT.md section 3, and SecretInventoryIsCompleteTest holds the two equal both ways.
#
# refreshPolicy: OnChange and refreshInterval: 0s are a decision, not a default: a value that changed on the operator's
# clock would reach a pod that crashed and restarted before the fleet had been rolled onto it. So the operator does not poll; the
# triggers it still has are named on the annotation below. Owner: deleting this object deletes its Secret, so no credential stays in etcd with nothing owning
# it. Retain: a store that stops answering, or an entry removed, never strips a Secret from running workloads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finapp-app-secrets
  annotations:
    # Moved by a commit in an overlay. The operator does not poll. It reads the store when this object's spec, labels or
    # annotations change, and when its Secret is missing or has been altered.
    finapp/rotation-generation: "0"
spec:
  refreshPolicy: OnChange
  refreshInterval: 0s
  secretStoreRef:
    kind: SecretStore
    name: finapp-app-store
  target:
    name: finapp-app-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: FINAPP_CORRIDOR_PROVIDER_B_KEY
      remoteRef:
        key: FINAPP_CORRIDOR_PROVIDER_B_KEY
    - secretKey: FINAPP_CORRIDOR_PROVIDER_KEY
      remoteRef:
        key: FINAPP_CORRIDOR_PROVIDER_KEY
    - secretKey: FINAPP_CORRIDOR_REPORT_KEY
      remoteRef:
        key: FINAPP_CORRIDOR_REPORT_KEY
    - secretKey: FINAPP_CORRIDOR_WEBHOOK_KEY
      remoteRef:
        key: FINAPP_CORRIDOR_WEBHOOK_KEY
    - secretKey: FINAPP_CORRIDOR_WEBHOOK_PREVIOUS_KEY
      remoteRef:
        key: FINAPP_CORRIDOR_WEBHOOK_PREVIOUS_KEY
    - secretKey: FINAPP_CREDIT_EVIDENCE_KEY
      remoteRef:
        key: FINAPP_CREDIT_EVIDENCE_KEY
    - secretKey: FINAPP_CREDIT_EVIDENCE_V2_KEY
      remoteRef:
        key: FINAPP_CREDIT_EVIDENCE_V2_KEY
    - secretKey: FINAPP_CREDIT_EVIDENCE_V3_KEY
      remoteRef:
        key: FINAPP_CREDIT_EVIDENCE_V3_KEY
    - secretKey: FINAPP_DB_APP_PASSWORD
      remoteRef:
        key: FINAPP_DB_APP_PASSWORD
    - secretKey: FINAPP_DB_APP_USER
      remoteRef:
        key: FINAPP_DB_APP_USER
    - secretKey: FINAPP_DB_REPORTING_PASSWORD
      remoteRef:
        key: FINAPP_DB_REPORTING_PASSWORD
    - secretKey: FINAPP_DB_REPORTING_USER
      remoteRef:
        key: FINAPP_DB_REPORTING_USER
    - secretKey: FINAPP_DB_URL
      remoteRef:
        key: FINAPP_DB_URL
    - secretKey: FINAPP_DOC_KEY
      remoteRef:
        key: FINAPP_DOC_KEY
    - secretKey: FINAPP_DOC_V2_KEY
      remoteRef:
        key: FINAPP_DOC_V2_KEY
    - secretKey: FINAPP_DOC_V3_KEY
      remoteRef:
        key: FINAPP_DOC_V3_KEY
    - secretKey: FINAPP_FX_EVIDENCE_KEY
      remoteRef:
        key: FINAPP_FX_EVIDENCE_KEY
    - secretKey: FINAPP_FX_EVIDENCE_V2_KEY
      remoteRef:
        key: FINAPP_FX_EVIDENCE_V2_KEY
    - secretKey: FINAPP_FX_EVIDENCE_V3_KEY
      remoteRef:
        key: FINAPP_FX_EVIDENCE_V3_KEY
    - secretKey: FINAPP_FX_PROVIDER_B_KEY
      remoteRef:
        key: FINAPP_FX_PROVIDER_B_KEY
    - secretKey: FINAPP_FX_PROVIDER_KEY
      remoteRef:
        key: FINAPP_FX_PROVIDER_KEY
    - secretKey: FINAPP_FX_REFERENCE_KEY
      remoteRef:
        key: FINAPP_FX_REFERENCE_KEY
    - secretKey: FINAPP_FX_REPORT_KEY
      remoteRef:
        key: FINAPP_FX_REPORT_KEY
    - secretKey: FINAPP_FX_WEBHOOK_KEY
      remoteRef:
        key: FINAPP_FX_WEBHOOK_KEY
    - secretKey: FINAPP_FX_WEBHOOK_PREVIOUS_KEY
      remoteRef:
        key: FINAPP_FX_WEBHOOK_PREVIOUS_KEY
    - secretKey: FINAPP_KAFKA_BOOTSTRAPSERVERS
      remoteRef:
        key: FINAPP_KAFKA_BOOTSTRAPSERVERS
    # The one entry not under this workload's path. The managed brokers read their SCRAM users from an entry whose name they
    # dictate, JSON with username and password, so the application reads that one and there is no second copy to keep equal.
    - secretKey: FINAPP_KAFKA_SASL_PASSWORD
      sourceRef:
        storeRef:
          kind: SecretStore
          name: finapp-app-kafka-store
      remoteRef:
        key: application
        property: password
    - secretKey: FINAPP_KAFKA_SASL_USERNAME
      sourceRef:
        storeRef:
          kind: SecretStore
          name: finapp-app-kafka-store
      remoteRef:
        key: application
        property: username
    - secretKey: FINAPP_KYC_CALLBACK_KEY
      remoteRef:
        key: FINAPP_KYC_CALLBACK_KEY
    - secretKey: FINAPP_KYC_CALLBACK_PREVIOUS_KEY
      remoteRef:
        key: FINAPP_KYC_CALLBACK_PREVIOUS_KEY
    - secretKey: FINAPP_MERCHANT_PAYOUT_EVIDENCE_KEY
      remoteRef:
        key: FINAPP_MERCHANT_PAYOUT_EVIDENCE_KEY
