# The telemetry pipeline, a release of its own (P15-TSK-023, ADR-0124 decision 1): the collector every replica exports to, and the namespace's
# default-deny written with its workloads (THREAT_MODEL.md section 6 item 21, decided 2026-11-09). Render an overlay, never this directory:
# each overlay names the backends the collector exports to (FINAPP_ENVIRONMENT, TEMPO_ENDPOINT, LOKI_ENDPOINT, TAIL_DECISION_WAIT) and the
# flows to them. kind's overlay brings Tempo, Loki, Prometheus and Alertmanager as reference backends; a real environment's backends are not chosen yet.
# infra/scripts/telemetry-check.sh renders the overlay beside the application's and runs both through the policies.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finapp-observability

resources:
  - collector-workload.yaml
  # The cluster watcher (P16-TSK-003): the migrator Job's state and records, read from the API server.
  - cluster-watch-workload.yaml
  - networkpolicy.yaml
  # What a person may do here (P15-TSK-032; THREAT_MODEL.md section 6 item 42 (k)): read, and under break-glass evict.
  - rbac-humans.yaml
  # The namespace's quota at its worst moment (THREAT_MODEL.md section 6 item 43 (c)); an overlay with backends raises it.
  - resourcequota.yaml

# Named with a content hash, so a changed allow-list rolls the collectors and a revert is a manifest digest.
configMapGenerator:
  - name: finapp-collector-config
    files:
      - config.yaml=collector.yaml
  - name: finapp-cluster-watch-config
    files:
      - config.yaml=cluster-watch.yaml
