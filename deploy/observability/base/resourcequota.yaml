# The telemetry pipeline's namespace quota (THREAT_MODEL.md section 6 item 43 (c), decided 2026-11-12): the base's numbers are the
# collector's, the cluster watcher's and the console probe's alone, and an overlay that adds its backends adds them here (kind's does). A pod
# stating no requests or no limits meets this quota's "must specify", since it states every key unscoped; nothing else in
# finapp-observability refuses one.
#
# THE ARITHMETIC, held equal by manifest-policy/observability.rego against the rendered stream (finapp.rego's worst_moment). finapp's
# formula, maxReplicas + 2 x maxSurge + 1, rests on minReadySeconds holding back terminating pods; no workload here states one, so a
# rollout may have every old pod still inside its grace beside the new ones, and a pod inside its grace is still charged:
#   the collector    a rollout: old and new together, 2 x 2 replicas                              4
#                    one more evicted outside it, its PodDisruptionBudget's maxUnavailable           1
#   the watcher      a rollout: old and new together, 2 x 1 replica (P16-TSK-003)                  2
#                    its one pod evicted outside it, no PodDisruptionBudget                          1
#   the probe        a rollout: old and new together, 2 x 1 replica (P17-TSK-044)                  2
#                    its one pod evicted outside it, no PodDisruptionBudget                          1
#   pods                                                                                         11
#   requests.cpu       5 x 100m + 3 x 100m + 3 x 100m                                         1100m
#   limits.cpu         5 x 1 + 3 x 1 + 3 x 1                                                     11
#   memory, both       5 x 512Mi + 3 x 256Mi + 3 x 256Mi                                     4096Mi
# (Read 8 pods, 800m, 8 and 3328Mi until P17-TSK-044 added the console probe, 2026-11-19.)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: finapp-observability
spec:
  hard:
    pods: "11"
    requests.cpu: 1100m
    requests.memory: 4096Mi
    limits.cpu: "11"
    limits.memory: 4096Mi
