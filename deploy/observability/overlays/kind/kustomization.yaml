# The telemetry pipeline on kind, test-only (P15-TSK-023): the base's collector and default-deny, Tempo, Loki and Prometheus as the reference
# backends, and the flows to them. No credential and no endpoint outside the cluster: every address below is a Service of this namespace.
#
# AND THE ALERTS (P15-TSK-032): Prometheus here loads every committed rule file and sends what fires to an Alertmanager running the committed
# routing (deploy/observability/alertmanager), so a rehearsal reads an alert and its receiver on a real Prometheus, not only promtool's cases.
# The rule files are in rules/, a byte-for-byte copy of infra/prometheus/rules: kustomize reads no file outside this directory, and the kind
# rehearsal renders deploy/ alone. AlertCatalogueTest holds the copy equal to the source, file for file, and the two rules ConfigMaps' lists
# below to the directory, each file in exactly one: a rule changed in infra/prometheus/rules is copied here in the same change, and a new rule
# file is listed in one of them.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finapp-observability

resources:
  - ../../base
  - ../../alertmanager
  - backends.yaml
  - networkpolicy-backends.yaml

configMapGenerator:
  - name: finapp-collector-backends
    literals:
      - FINAPP_ENVIRONMENT=kind
      - TEMPO_ENDPOINT=finapp-tempo.finapp-observability.svc.cluster.local:4317
      - LOKI_ENDPOINT=http://finapp-loki.finapp-observability.svc.cluster.local:3100/otlp
      # Long enough for a request's last span to arrive, short enough for the rehearsal to read the trace within a minute.
      - TAIL_DECISION_WAIT=10s
  - name: finapp-tempo-config
    files:
      - tempo.yaml
  - name: finapp-loki-config
    files:
      - loki.yaml
  # A FIXED NAME, deliberately: a rehearsal changes the scrape's labels (the lending, BNPL and risk switches) by editing this ConfigMap and
  # POSTing /-/reload, which keeps the TSDB and every alert's for. A hashed name would roll the pod instead and lose both.
  - name: finapp-prometheus-config
    files:
      - prometheus.yml
    options:
      disableNameSuffixHash: true
  # Every rule file, mounted at /etc/prometheus-rules, in TWO ConfigMaps (2026-11-13): one held them all until it came within 216 bytes of the
  # 32 KiB margin AlertCatalogueTest keeps under kubectl's 256 KiB annotation cap for a client-side apply. Here the platform's own and the
  # cross-cutting files (the objectives, their recording rules, the flows and the correctness signals); the domains' in the next. backends.yaml
  # projects both into the one directory, so Prometheus's rule path and rules/ are unchanged. AlertCatalogueTest holds each file in exactly one
  # and each ConfigMap under the margin on its own. Hashed, both: a changed rule rolls the scraper.
  - name: finapp-prometheus-rules
    files:
      - rules/correctness.yml
      - rules/flows.yml
      - rules/platform.yml
      - rules/slo-recording.yml
      - rules/slo.yml
      - rules/telemetry.yml
  # The domains' rule files: the ledger's, each product's, risk's and settlement's.
  - name: finapp-prometheus-rules-domain
    files:
      - rules/accounting.yml
      - rules/bnpl.yml
      - rules/credit.yml
      - rules/fx.yml
      - rules/lending.yml
      - rules/risk.yml
      - rules/settlement-reconciliation.yml

patches:
  # The quota follows the backends (deploy/observability/base/resourcequota.yaml shows the collector's and the cluster watcher's sum). Each of
  # Tempo, Loki, Prometheus and Alertmanager is one replica, Recreate, with no PodDisruptionBudget: at worst its pod and one replacing it after
  # an eviction, 2 pods each. 8 + 4 x 2 = 16 pods; cpu 800m + 2 x (100m + 100m + 100m + 50m) requested and 8 + 2 x (1 + 1 + 1 + 0.5) limited;
  # memory 3328Mi + 2 x (384Mi + 384Mi + 512Mi + 128Mi), requests equal to limits.
  - target:
      kind: ResourceQuota
      name: finapp-observability
    patch: |-
      - op: replace
        path: /spec/hard/pods
        value: "16"
      - op: replace
        path: /spec/hard/requests.cpu
        value: 1500m
      - op: replace
        path: /spec/hard/requests.memory
        value: 6144Mi
      - op: replace
        path: /spec/hard/limits.cpu
        value: "15"
      - op: replace
        path: /spec/hard/limits.memory
        value: 6144Mi
