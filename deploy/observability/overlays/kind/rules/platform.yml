# Platform alerts (P15-TSK-024; PHASE_15_PLAN.md section 11; ADR-0124 decision 7): an instance that is down or cannot be scraped,
# a fleet gone from the scrape, and an instance whose gauge refresher has stopped answering or fallen behind. Each alert's procedure is OPERATIONS_RUNBOOK.md section 11.8.
#
# Unit-tested by promtool: infra/prometheus/tests/platform.test.yml, `promtool test rules`, from prom/prometheus v3.14.0 (the
# version compose pins), run by its digest; the test file sits outside rules/, which compose loads by glob. `promtool` in CI,
# routing is infra/alertmanager/alertmanager.yml (P15-TSK-025), to a placeholder receiver until an on-call tool exists.
#
# Conventions:
# - `up` is Prometheus's own series, one per scraped target: 1 when the last scrape completed, 0 when it failed or timed
#   out. Every finapp gauge now reads off the scrape thread (P15-TSK-024), so a slow or absent database no longer costs a
#   scrape: `up` 0 means the instance is down, unreachable, or unable to answer at all, never a gauge waiting on the pool.
# - Per instance, never aggregated: one instance down is an incident on that instance, and max() or sum() over the fleet
#   would hide it behind its healthy neighbours.
# - A target that leaves the service discovery leaves no `up` series at all, so `up == 0` cannot see a fleet that is
#   gone; absent() is the other half, as the domain files' *Absent rules are for their series.
# - The job is `finapp` (infra/prometheus/prometheus.yml); a deployment's scrape configuration keeps that job name.
# - finapp_gauges_refreshed is the gauge refresher's canary: a constant 1 read through the same path as every finapp gauge,
#   so it is NaN before its first read and whenever that instance's refresher has left its ask unanswered past
#   finapp.gauges.stale-after (2 minutes); every finapp gauge of the instance is stale with it then. x != bool x is 1
#   exactly for NaN and 0 for a number, so summed over a subquery it counts the stale evaluations.

groups:
  - name: platform
    labels:
      owner: platform
    rules:
      - alert: InstanceDown
        # Aggregation: per instance - one instance down is an incident on that instance, and max() or sum() would hide it
        # Two minutes of failed scrapes on one target: a crashed or stopped JVM, a pod that cannot be reached, a scrape that
        # cannot answer. A page: whatever that instance was running - requests, schedules, consumers - another must be
        # taking, and if every instance is down nothing is.
        expr: up{job="finapp"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "A finapp instance cannot be scraped: {{ $labels.instance }}"
          description: "Its last scrapes failed for 2 minutes. See OPERATIONS_RUNBOOK.md section 11.8."
      - alert: FinappTargetsAbsent
        # Aggregation: none - absent() asks whether any target exists at all
        # No finapp target is scraped at all: the fleet is gone from the service discovery (scaled to zero, every pod
        # deleted), or the scrape configuration lost the job. Every rule on a finapp series is then green for the wrong reason.
        expr: absent(up{job="finapp"})
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No finapp instance is being scraped"
          description: "No target of the finapp job exists for 5 minutes, so every finapp alert is blind. See OPERATIONS_RUNBOOK.md section 11.8."
      - alert: GaugesStale
        # Aggregation: per instance - each instance's refresher is its own
        # The instance answers its scrapes, but its canary was stale at more than 6 of the last 30 minutes' 120 evaluations
        # (over 90 s): a read holding the one thread (a socket the network black-holed - only a restart frees it), or a thread
        # behind its asks, its reads slow or each waiting out the pool on a database in trouble. Counted, never held: a
        # thread behind but not stuck answers each ask about one pass (C) after it, so the canary - and every gauge of the
        # instance whose read succeeds - is NaN for about C - 120 s of every C and a number between. A rule waiting for NaN
        # to hold 5m fires only once C passes seven minutes, and a threshold rule's for restarts at every NaN; a count sees
        # the stuck thread (every evaluation) and one behind by a step past the bound (a NaN each pass). Six spare a start
        # whose first reads take a minute and one short burst. A ticket: an instance still serves, a fleet-wide max() still
        # reads the instances whose thread answers, and a gauge whose read fails outright is NaN at every scrape, which its
        # domain unreadable rule holds.
        expr: sum_over_time((finapp_gauges_refreshed != bool finapp_gauges_refreshed)[30m:15s]) > 6
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "The gauges of {{ $labels.instance }} are stale"
          description: "Its gauge refresher left asks unanswered past their bound for over 90 s of the last 30 minutes, so its finapp gauges have been going NaN. See OPERATIONS_RUNBOOK.md section 11.8."

  # The rest of the platform rules (P15-TSK-025; PHASE_15_PLAN.md section 11): the outbox, the inbox, HTTP errors, the pool, the clock
  # and certificates. A second group so the first stays what PlatformAlertRulesTest holds it to.
  - name: platform-saturation
    labels:
      owner: platform
    rules:
      - alert: OutboxPublicationStalled
        # Aggregation: max() - every instance reads the same outbox; a NaN instance is ignored
        # The relay is not draining: the oldest publishable row is over five minutes old. A lone dead letter does not read as this; it pages on its own.
        expr: max(finapp_outbox_oldest_publishable_seconds) > 300
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The outbox is not draining"
          description: "The oldest publishable event is over 5 minutes old. Nothing financial is lost: it waits in the database. See OPERATIONS_RUNBOOK.md section 11.21."
      - alert: InboxLagHigh
        # Aggregation: sum by (module) - a group's lag is the sum of its members', and a NaN member is filtered first because sum() is poisoned by it
        expr: sum by (module) (finapp_inbox_lag == finapp_inbox_lag) > 1000
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "The consumer group of {{ $labels.module }} is behind"
          description: "More than 1000 records are awaiting the group finapp.{{ $labels.module }}. See OPERATIONS_RUNBOOK.md section 11.6."
      - alert: InboxPollFailing
        # Aggregation: sum() - counters are per instance, and a broker-side fault meets every replica at once
        # A failed TLS handshake (an expired or rotated broker certificate) deliberately fails no readiness, and a thrown poll updates no lag, so nothing else can see this.
        expr: sum(increase(finapp_inbox_poll_failures_total{outcome="failed"}[15m])) > 0
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Consumer polls keep failing"
          description: "Inbox polls have thrown for 15 minutes on end. See OPERATIONS_RUNBOOK.md section 11.6."
      - alert: InboxPollRefused
        # Aggregation: sum() - counters are per instance
        # The broker refused a credential or a permission. Readiness fails beside it (the kafkaConsumers contributor), but nothing pages on readiness.
        expr: sum(increase(finapp_inbox_poll_failures_total{outcome="refused"}[15m])) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The broker is refusing the consumers"
          description: "The broker refused a consumer poll for 5 minutes: a credential or a permission. See OPERATIONS_RUNBOOK.md section 11.6."
      - alert: InboxConsumerEvicted
        # Aggregation: sum() - counters are per instance
        # A member evicted past its poll budget: the batch redelivers into the dedupe, so nothing is wrong, but throughput collapses while it repeats.
        expr: sum(increase(finapp_inbox_consumer_evictions_total[30m])) > 0
        for: 0s
        labels:
          severity: ticket
        annotations:
          summary: "A consumer was evicted from its group"
          description: "A consumer overran its poll budget and was evicted in the last 30 minutes. See OPERATIONS_RUNBOOK.md section 11.6."
      - alert: HttpServerErrorsHigh
        # Aggregation: sum() - counters are per instance, and the ratio is the fleet's
        # Every route, including the ones no objective names. The objectives burn per flow; this is the floor under them.
        expr: sum(rate(http_server_requests_seconds_count{uri!~"/actuator/.*",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{uri!~"/actuator/.*"}[5m])) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "More than 5% of requests are failing"
          description: "Over 5% of all requests answered 5xx for 5 minutes. See OPERATIONS_RUNBOOK.md section 11.21."
      - alert: ConnectionPoolSaturated
        # Aggregation: per instance - a pool is that instance's, and max() over the fleet would hide one behind its neighbours
        # Excluding report generation's one-connection pool, which is full whenever a report runs.
        expr: hikaricp_connections_active{pool!="finapp-reporting"} / hikaricp_connections_max{pool!="finapp-reporting"} > 0.9
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "The connection pool of {{ $labels.instance }} is nearly full"
          description: "Over 90% of the pool on {{ $labels.instance }} has been in use for 5 minutes. See OPERATIONS_RUNBOOK.md section 11.21."
      - alert: ConnectionPoolStarved
        # Aggregation: per instance - a pool is that instance's, and max() over the fleet would hide one behind its neighbours
        expr: hikaricp_connections_pending{pool!="finapp-reporting"} > 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Threads are waiting on the connection pool of {{ $labels.instance }}"
          description: "Requests on {{ $labels.instance }} have been waiting for a connection for 2 minutes. See OPERATIONS_RUNBOOK.md section 11.21."
      - alert: InstanceClockOffset
        # Aggregation: per instance - a clock is that instance's own, and aggregating would hide the one that stepped
        # ADR-0063: the clamp hides skew from the writes, so this shows it. Coordination reads only the database's clock (ADR-0014), so a ticket.
        expr: abs(finapp_platform_clock_offset_seconds) > 1
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "The clock of {{ $labels.instance }} is off"
          description: "The clock of {{ $labels.instance }} differs from the database by over a second. See OPERATIONS_RUNBOOK.md section 11.21."
      - alert: ConfigFingerprintDisagrees
        # Aggregation: count - how many different financial configurations the fleet runs, per environment: a count of hashes and never of instances, so a replaced pod is no new disagreement
        # A label is read here and a value never is, so a replica whose refresher is stale (the value NaN) keeps its place in the count.
        # present_over_time keeps a series five minutes past its last sample: one missed scrape of the odd replica out would otherwise end the disagreement for one evaluation, and a for this long would restart at every flicker and never fire.
        # The for outlasts any rollout an overlay allows: maxReplicas steps of at most progressDeadlineSeconds each, the last pod's grace, and this window. ConfigFingerprintAlertTest reads those numbers from the manifests. A rollout's expected disagreement never pages, and one that has outlived a rollout does. 110m since kind admits ten replicas (ADR-0134; 80m for seven).
        expr: count(count by (env, fingerprint) (present_over_time(finapp_config_fingerprint[5m]))) by (env) > 1
        for: 110m
        labels:
          severity: page
        annotations:
          summary: "The fleet in {{ $labels.env }} is running {{ $value }} different financial configurations"
          description: "Replicas have disagreed on the effective FINANCIAL configuration for longer than any rollout takes. Each such value is safe mixed only for the length of a rollout. See OPERATIONS_RUNBOOK.md section 11.31."
      - alert: ConfigFingerprintAbsent
        # Aggregation: none - absent() asks whether any instance publishes the fingerprint at all, because ConfigFingerprintDisagrees cannot see a fleet that has stopped publishing it
        expr: absent(finapp_config_fingerprint)
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "No instance publishes the configuration fingerprint"
          description: "No replica has published finapp.config.fingerprint for 15 minutes, so ConfigFingerprintDisagrees is blind. See OPERATIONS_RUNBOOK.md section 11.31."
      - alert: PlatformGaugesUnreadable
        # Aggregation: per instance by (job, instance) - x != x holds for NaN alone, and one instance unable to read is that instance's fault
        expr: label_replace(max by (job, instance) (finapp_outbox_pending != finapp_outbox_pending), "gauge", "finapp_outbox_pending", "", "") or label_replace(max by (job, instance) (finapp_outbox_oldest_seconds != finapp_outbox_oldest_seconds), "gauge", "finapp_outbox_oldest_seconds", "", "") or label_replace(max by (job, instance) (finapp_outbox_oldest_publishable_seconds != finapp_outbox_oldest_publishable_seconds), "gauge", "finapp_outbox_oldest_publishable_seconds", "", "") or label_replace(max by (job, instance) (finapp_inbox_lag != finapp_inbox_lag), "gauge", "finapp_inbox_lag", "", "") or label_replace(max by (job, instance) (finapp_platform_clock_offset_seconds != finapp_platform_clock_offset_seconds), "gauge", "finapp_platform_clock_offset_seconds", "", "")
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "A platform gauge cannot be read on {{ $labels.instance }}"
          description: "{{ $labels.gauge }} is NaN on {{ $labels.instance }} for 15 minutes. See OPERATIONS_RUNBOOK.md section 11.21."
      - alert: PlatformSeriesAbsent
        # Aggregation: none - absent() asks whether any instance publishes the series at all
        # A rule that cannot evaluate fires this: the SLO and platform rules are silent if these series are gone. A deployment always runs its consumers, so a lag series gone means they are gone.
        expr: absent(finapp_outbox_oldest_publishable_seconds) or absent(http_server_requests_seconds_count) or absent(hikaricp_connections_active) or absent(finapp_inbox_lag)
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "A series the platform alerts read is gone"
          description: "A series the SLO or platform rules read has not been published for 5 minutes, so those rules are blind. See OPERATIONS_RUNBOOK.md section 11.21."
      - alert: CertificateExpiringSoon
        # Aggregation: min by (namespace, name) - every cert-manager replica publishes the same certificate, and the earliest is the deadline
        # cert-manager renews at two-thirds of a lifetime, so 21 days left means a 90-day certificate's renewal has been failing for over a week.
        expr: min by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds) - time() < 21 * 86400
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "The certificate {{ $labels.name }} is not renewing"
          description: "The certificate {{ $labels.namespace }}/{{ $labels.name }} expires within 21 days. See OPERATIONS_RUNBOOK.md section 11.8."
      - alert: CertificateExpiring
        # Aggregation: min by (namespace, name) - every cert-manager replica publishes the same certificate, and the earliest is the deadline
        expr: min by (namespace, name) (certmanager_certificate_expiration_timestamp_seconds) - time() < 7 * 86400
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "The certificate {{ $labels.name }} expires within a week"
          description: "The certificate {{ $labels.namespace }}/{{ $labels.name }} expires within 7 days. See OPERATIONS_RUNBOOK.md section 11.8."
      - alert: CertificateExpirySeriesAbsent
        # Aggregation: none - absent() asks whether cert-manager publishes the series at all, gated to a deployed environment
        # Compose runs no cert-manager, so only where a finapp target is not labelled env="local".
        expr: absent(certmanager_certificate_expiration_timestamp_seconds) and on() (count(up{job="finapp", env!="local"}) > 0)
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "No certificate expiry series is published"
          description: "cert-manager publishes no expiry series here, so an expiring certificate cannot be seen. See OPERATIONS_RUNBOOK.md section 11.8."

  # The platform's own components (P16-TSK-003; THREAT_MODEL.md section 6 item 43 (b), decided 2026-11-12): the migrator Job, the cluster
  # watcher that reads it, and the edge. A third group, so the first stays what PlatformAlertRulesTest holds it to; PlatformComponentAlertRulesTest
  # holds every for below to the numbers it is derived from, read from the manifests, and every series and label to what the pinned images
  # publish (infra/prometheus/platform-components-series.txt). Promtool: infra/prometheus/tests/platform-components.test.yml.
  #
  # THE JOB'S STATE IS THE API SERVER'S, read by the cluster watcher (deploy/observability/base/cluster-watch.yaml, job finapp-cluster-watch):
  # k8s_job_*_pods per Job, labelled by k8s_namespace_name, k8s_job_name and k8s_job_uid. A Job is read by its NAME, never its uid: one release's
  # Job replaces the last under the same name (the delivery's BeforeHookCreation, or the rehearsal's apply), and the exporter keeps a deleted
  # Job's series for its metric_expiration, so a max by name lets the successor's own state win. N watchers publish the same series under N
  # instances; max() is one verdict.
  - name: platform-components
    labels:
      owner: platform
    rules:
      - alert: MigratorJobFailed
        # Aggregation: max by (k8s_namespace_name, k8s_job_name) - every watcher publishes the same Job, and a replaced Job's predecessor is read beside it until its series expire
        # A migrator pod failed and nothing is trying: a migration or a validation failed (exit 10) or the configuration, identity or credential
        # was refused (exit 12) - the Job's podFailurePolicy fails it at once - or three transient failures used its backoffLimit, or its
        # deadline killed a pod that hung. The release waits; money moves on the old one. Between two tries of a transient failure the Job has a
        # failed pod and none active for its backoff (10 s, then 20 s): the for outlasts that, the watcher's collection and the scrape.
        expr: >-
          max by (k8s_namespace_name, k8s_job_name) (k8s_job_failed_pods{k8s_job_name="finapp-migrator"}) > 0
          unless on(k8s_namespace_name, k8s_job_name)
          (max by (k8s_namespace_name, k8s_job_name) (k8s_job_active_pods{k8s_job_name="finapp-migrator"}) > 0
          or max by (k8s_namespace_name, k8s_job_name) (k8s_job_successful_pods{k8s_job_name="finapp-migrator"}) > 0)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "The migrator Job in {{ $labels.k8s_namespace_name }} has failed"
          description: "A migrator pod failed and no other is running or has succeeded, so the release is held. See OPERATIONS_RUNBOOK.md section 11.41."
      - alert: MigratorJobOverdue
        # Aggregation: max by (k8s_namespace_name, k8s_job_name) - every watcher publishes the same Job, and a replaced Job's predecessor is read beside it until its series expire
        # The migrator Job has not succeeded for longer than its own deadline allows: a Job whose pod was never created (a quota, an admission
        # refusal, an image that cannot be pulled) fails by its deadline with no failed pod, which MigratorJobFailed cannot see (measured on
        # kind); a pod that hangs is killed at the deadline. The for is the Job's activeDeadlineSeconds, the watcher's collection, the scrape
        # and the evaluation, with a minute to spare: a Job inside its deadline never fires.
        expr: >-
          max by (k8s_namespace_name, k8s_job_name) (k8s_job_successful_pods{k8s_job_name="finapp-migrator"})
          < max by (k8s_namespace_name, k8s_job_name) (k8s_job_desired_successful_pods{k8s_job_name="finapp-migrator"})
        for: 17m
        labels:
          severity: page
        annotations:
          summary: "The migrator Job in {{ $labels.k8s_namespace_name }} has not succeeded within its deadline"
          description: "The migrator Job has not succeeded for longer than its deadline, so the release is held. See OPERATIONS_RUNBOOK.md section 11.41."
      - alert: ClusterWatchBlind
        # Aggregation: none - absent() asks whether the watcher publishes the application's Deployment at all, gated to a deployed fleet
        # The Job rules read the cluster watcher, and a watcher down, unscraped or refused by the API server publishes nothing, so they are silent
        # for the wrong reason. Every deployment runs finapp-app, so a watcher that sees finapp publishes its Deployment. Compose runs no watcher,
        # so only where a finapp target is not labelled env="local". A ticket: nothing is failing that the platform knows of.
        expr: absent(k8s_deployment_desired{k8s_namespace_name="finapp", k8s_deployment_name="finapp-app"}) and on() (count(up{job="finapp", env!="local"}) > 0)
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "The cluster watcher publishes nothing about finapp"
          description: "No series of the finapp-app Deployment has been published for 15 minutes, so MigratorJobFailed and MigratorJobOverdue are blind. See OPERATIONS_RUNBOOK.md section 11.41."
      - alert: EdgeErrorRatioHigh
        # Aggregation: sum by (edge) - counters are per controller, and an edge's ratio sums its controllers' before dividing
        # The edge answering 5xx: the application's own (HttpServerErrorsHigh reads those from the replicas) and the edge's - 502, 503, 504, a
        # replica that cannot be reached or does not answer in time - which no replica counts. The SLO document's fast pair, both windows over
        # 14.4 times the strictest budget the edge carries (0.001: transfers, payments, merchant, authentication), on the TLS listener alone; a
        # reference value Phase 16's load model recalibrates. A code's series is born at its first request, so a burst's first scrape is not
        # counted; a ratio held for minutes is. No traffic is no ratio, and no alert.
        expr: >-
          (sum by (edge) (rate(traefik_entrypoint_requests_total{job="finapp-edge", entrypoint="websecure", code=~"5.."}[5m]))
          / sum by (edge) (rate(traefik_entrypoint_requests_total{job="finapp-edge", entrypoint="websecure"}[5m]))) > (14.4 * 0.001)
          and (sum by (edge) (rate(traefik_entrypoint_requests_total{job="finapp-edge", entrypoint="websecure", code=~"5.."}[1h]))
          / sum by (edge) (rate(traefik_entrypoint_requests_total{job="finapp-edge", entrypoint="websecure"}[1h]))) > (14.4 * 0.001)
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "The {{ $labels.edge }} edge is answering errors"
          description: "Over 1.44% of the {{ $labels.edge }} edge's requests answered 5xx over both the last hour and the last five minutes. See OPERATIONS_RUNBOOK.md section 11.42."
      - alert: EdgeUnscraped
        # Aggregation: sum by (edge) - an edge is down when none of its controllers answers, and one of two is the other's to serve
        # An edge none of whose controllers answers its scrape, or with no controller to scrape at all: the edge is down or cannot be seen, and
        # either way EdgeErrorRatioHigh counts no request there - a client refused at the load balancer is no 5xx. Gated, as the absent half
        # is, to a deployed fleet: compose runs no edge.
        expr: >-
          sum by (edge) (up{job="finapp-edge"}) == 0
          or ((absent(up{job="finapp-edge", edge="public"}) or absent(up{job="finapp-edge", edge="operator"}))
          and on() (count(up{job="finapp", env!="local"}) > 0))
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "No controller of the {{ $labels.edge }} edge can be scraped"
          description: "No controller of the {{ $labels.edge }} edge has answered its scrape for 5 minutes, so it may be down and its errors cannot be counted. See OPERATIONS_RUNBOOK.md section 11.42."
