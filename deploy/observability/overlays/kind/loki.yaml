# Loki on kind, test-only (P15-TSK-023): the reference log backend of the rehearsal, one process, its chunks on the pod's own disk. It takes
# OTLP natively, so the collector's records arrive with their resource attributes; the ECS line is the record's body.
# Retention is the log class's: thirty-one days, enforced by the compactor (OPERATIONS_RUNBOOK.md section 11.34).
auth_enabled: false
server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  retention_period: 744h
  allow_structured_metadata: true
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
analytics:
  reporting_enabled: false
