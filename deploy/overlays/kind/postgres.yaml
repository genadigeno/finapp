# Test-only, single-node, gone with its cluster: the kind rehearsal's PostgreSQL. C3: state lives outside the cluster in
# every real environment, and the manifest policy refuses a StatefulSet in any other overlay.
#
# The data directory is on a volume claim that kind's own provisioner (local-path, the cluster's default StorageClass) backs, not an
# emptyDir (P16-TSK-005): a roll replaces the pod, and an emptyDir goes with the pod it belongs to, so the rehearsal's version change
# would start an empty server. The claim outlives the pod and is deleted with the namespace or the cluster.
#
# The restricted pod profile holds here too: this image was run with a read-only root, as 999:999, with every
# capability dropped, and reached ready. Mounted at /var/lib/postgresql rather than /var/lib/postgresql/data, as
# compose.yaml explains for PostgreSQL 18.
#
# TLS: the server's certificate and key come from the rehearsal's local CA, in the Secret finapp-kind-postgres-tls, generated per
# run and never committed (infra/scripts/kind-rehearsal.sh), so the application and the migrator run at sslmode=verify-full against
# a real handshake. Over the network only hostssl is admitted: a client that did not bring up TLS is refused, so "the fleet is on
# TLS" is a fact the server enforces, not a setting. The socket inside the pod stays open to the bootstrap image and the census.
#
# The role initialisation is the bootstrap Job's (DATA_MIGRATIONS.md section 2.2) and the generated password is finapp-kind-postgres.
apiVersion: v1
kind: ConfigMap
metadata:
  name: finapp-kind-postgres-hba
  labels:
    finapp/test-only: "true"
data:
  pg_hba.conf: |
    local all all trust
    hostssl all all all scram-sha-256
---
apiVersion: v1
kind: Service
metadata:
  name: finapp-postgres
  labels:
    finapp/test-only: "true"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: finapp-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finapp-test-only
  labels:
    finapp/test-only: "true"
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: finapp-postgres
  labels:
    finapp/test-only: "true"
spec:
  serviceName: finapp-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finapp-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finapp-postgres
        finapp/test-only: "true"
    spec:
      serviceAccountName: finapp-test-only
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # compose.yaml's version, by digest.
          image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
          args:
            # The overlay's FINAPP_DB_SERVER_MAX_CONNECTIONS, for ten replicas (owner decision C3: the test-only server is the larger
            # one, P16-TSK-009). A rehearsal run at fewer replicas sets its own copy to the formula at its count.
            - -c
            - max_connections=116
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/finapp-postgres-tls/tls.crt
            - -c
            - ssl_key_file=/etc/finapp-postgres-tls/tls.key
            - -c
            - hba_file=/etc/finapp-postgres-hba/pg_hba.conf
            # The load harness's statement statistics (P16-TSK-006, PHASE_16_PLAN.md section 5.2): loaded here, and the extension
            # created by the load scope in the server's maintenance database alone, so the finapp database gains no object. A
            # test-only server's setting: a managed database's statistics are its own (Performance Insights in the reference cloud).
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - track_io_timing=on
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: finapp
            - name: POSTGRES_USER
              value: finapp
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finapp-kind-postgres
                  key: password
          # 1 GiB since P16-TSK-006: at 512 MiB the demonstration load drove a backend into the container's memory limit 4.5 minutes in,
          # the kernel killed it and the server reinitialised (OPERATIONS_RUNBOOK.md section 11.43's record). A test-only stand-in's size; a
          # managed database is sized on its own.
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "finapp", "-d", "finapp"]
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "finapp", "-d", "finapp"]
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "finapp", "-d", "finapp"]
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /etc/finapp-postgres-tls
              readOnly: true
            - name: hba
              mountPath: /etc/finapp-postgres-hba
              readOnly: true
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        # 0440 and group 999 through fsGroup: PostgreSQL accepts a key the group can read only when root owns it, which a
        # projected Secret file is.
        - name: tls
          secret:
            secretName: finapp-kind-postgres-tls
            defaultMode: 288
        - name: hba
          configMap:
            name: finapp-kind-postgres-hba
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
