# Test-only, single-node, ephemeral: the kind rehearsal's PostgreSQL. C3: state lives outside the cluster in
# every real environment, and the manifest policy refuses a StatefulSet in any other overlay.
#
# The restricted pod profile holds here too: this image was run with a read-only root, as 999:999, with every
# capability dropped, and reached ready. Mounted at /var/lib/postgresql rather than /var/lib/postgresql/data, as
# compose.yaml explains for PostgreSQL 18.
#
# TLS from the local CA, the migrator's roles and the generated password are the rehearsal's to supply: the
# Secret below is generated per run and never committed.
apiVersion: v1
kind: Service
metadata:
  name: finapp-postgres
  labels:
    finapp/test-only: "true"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: finapp-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finapp-test-only
  labels:
    finapp/test-only: "true"
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: finapp-postgres
  labels:
    finapp/test-only: "true"
spec:
  serviceName: finapp-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finapp-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finapp-postgres
        finapp/test-only: "true"
    spec:
      serviceAccountName: finapp-test-only
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # compose.yaml's version, by digest.
          image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
          args:
            - -c
            - max_connections=60
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: finapp
            - name: POSTGRES_USER
              value: finapp
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finapp-kind-postgres
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "finapp", "-d", "finapp"]
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "finapp", "-d", "finapp"]
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "finapp", "-d", "finapp"]
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
