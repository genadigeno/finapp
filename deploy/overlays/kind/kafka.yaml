# Test-only, single-node, ephemeral: the kind rehearsal's broker, in KRaft mode. Refused in any other overlay.
#
# The restricted pod profile holds here too: the image's start script writes its configuration under
# /opt/kafka/config and /mnt/shared/config, so each is an emptyDir, and with those this image was run read-only, as
# 1000:1000, with every capability dropped, until it served. PLAINTEXT here, on the cluster's own network: the
# SASL_SSL listener, the SCRAM users and the keystore are the rehearsal's, generated per run and never committed.
apiVersion: v1
kind: Service
metadata:
  name: finapp-kafka
  labels:
    finapp/test-only: "true"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: finapp-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: finapp-kafka
  labels:
    finapp/test-only: "true"
spec:
  serviceName: finapp-kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finapp-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finapp-kafka
        finapp/test-only: "true"
    spec:
      serviceAccountName: finapp-test-only
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          # compose.yaml's version, by digest.
          image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
          ports:
            - name: kafka
              containerPort: 9092
          env:
            # kafka-server-start's default heap is 1 GiB, the whole of this container's limit.
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx512m
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENERS
              value: INTERNAL://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: INTERNAL://finapp-kafka:9092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: INTERNAL
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: CLUSTER_ID
              value: 4L6g3nShT-eMCtK--X86sw
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
            periodSeconds: 5
            timeoutSeconds: 20
            failureThreshold: 36
          livenessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: config
              mountPath: /opt/kafka/config
            - name: shared-config
              mountPath: /mnt/shared/config
            - name: logs
              mountPath: /opt/kafka/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: config
          emptyDir: {}
        - name: shared-config
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
