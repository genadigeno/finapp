# Test-only, single-node, gone with its cluster: the kind rehearsal's broker, in KRaft mode. Refused in any other overlay.
#
# Its log directory (the topics, the consumer groups' offsets, and in KRaft the metadata: ACLs and SCRAM credentials) is on a volume claim
# that kind's own provisioner backs, not an emptyDir (P16-TSK-005), so a roll that replaces the pod keeps it: `format --ignore-formatted`
# below leaves a formatted directory alone. Deleted with the namespace or the cluster.
#
# SASL_SSL on 9092, as every deployed client needs: SCRAM-SHA-512 and a certificate from the rehearsal's local CA. The application
# connects as itself, with the catalogued ACLs and nothing more, because KafkaTransportGuard refuses PLAINTEXT off loopback.
#
# TWO LOOPBACK-ONLY LISTENERS, the rest of the wiring. CONTROLLER on 9093 is KRaft's own. LOCAL on 9094 is the broker's own traffic
# and the admin tools the rehearsal runs through `kubectl exec` (topics, ACLs): its principal, ANONYMOUS, is the only super user,
# and it never leaves the pod, so no NetworkPolicy names it and no client can present it.
#
# Everything generated is the rehearsal's, never committed: the broker's keystore (finapp-kind-kafka-tls), its properties from
# infra/kafka/broker.properties with replication overridden to one node (finapp-kind-kafka-config), and the SCRAM passwords in
# finapp-kind-kafka-scram. The kafka-storage step that takes those passwords formats the directory at the first start of this pod and
# leaves it alone at every later one, a roll's included: the credential is in the metadata from then on.
#
# The restricted pod profile holds here too: the image was run with a read-only root, as 1000:1000, with every capability dropped,
# until it served. The image's own start script writes its configuration under /opt/kafka/config and /mnt/shared/config and is not used.
apiVersion: v1
kind: ConfigMap
metadata:
  name: finapp-kind-kafka-start
  labels:
    finapp/test-only: "true"
data:
  start.sh: |
    #!/bin/sh
    set -eu
    cp /etc/finapp-kind-kafka-config/server.properties /tmp/server.properties
    /opt/kafka/bin/kafka-storage.sh format --ignore-formatted --cluster-id 4L6g3nShT-eMCtK--X86sw \
        --config /tmp/server.properties \
        --add-scram "SCRAM-SHA-512=[name=$KAFKA_APP_USER,password=$KAFKA_APP_PASSWORD]"
    unset KAFKA_APP_PASSWORD
    exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
---
apiVersion: v1
kind: Service
metadata:
  name: finapp-kafka
  labels:
    finapp/test-only: "true"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: finapp-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: finapp-kafka
  labels:
    finapp/test-only: "true"
spec:
  serviceName: finapp-kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finapp-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finapp-kafka
        finapp/test-only: "true"
    spec:
      serviceAccountName: finapp-test-only
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kafka
          # compose.yaml's version, by digest.
          image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
          command:
            - /bin/sh
            - /etc/finapp-kind-kafka-start/start.sh
          ports:
            - name: kafka
              containerPort: 9092
          env:
            # kafka-server-start's default heap is 1 GiB, the whole of this container's limit.
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx512m
            - name: KAFKA_APP_USER
              valueFrom:
                secretKeyRef:
                  name: finapp-kind-kafka-scram
                  key: FINAPP_KAFKA_SASL_USERNAME
            - name: KAFKA_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finapp-kind-kafka-scram
                  key: FINAPP_KAFKA_SASL_PASSWORD
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # On the loopback listener, because the service one needs a SCRAM login and its own trust store. It can answer only
          # once the broker has metadata, which is when the rehearsal may create the topics.
          startupProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9094"]
            periodSeconds: 5
            timeoutSeconds: 20
            failureThreshold: 36
          livenessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: logs
              mountPath: /opt/kafka/logs
            - name: tmp
              mountPath: /tmp
            - name: start
              mountPath: /etc/finapp-kind-kafka-start
              readOnly: true
            - name: config
              mountPath: /etc/finapp-kind-kafka-config
              readOnly: true
            - name: tls
              mountPath: /etc/finapp-kind-kafka-tls
              readOnly: true
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: start
          configMap:
            name: finapp-kind-kafka-start
        - name: config
          configMap:
            name: finapp-kind-kafka-config
        - name: tls
          secret:
            secretName: finapp-kind-kafka-tls
            defaultMode: 288
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
