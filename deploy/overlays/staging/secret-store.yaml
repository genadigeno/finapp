# How staging reaches its secret store (P15-TSK-018, ADR-0123): production's shape, with its own path. The placeholders are
# the convention the production overlay's file explains: no real account, region or endpoint is committed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finapp-app-secret-reader
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/placeholder-finapp-app-secret-reader
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finapp-migrator-secret-reader
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/placeholder-finapp-migrator-secret-reader
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: finapp-app-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: placeholder-region-0
      prefix: finapp/staging/app/
      auth:
        jwt:
          serviceAccountRef:
            name: finapp-app-secret-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: finapp-migrator-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: placeholder-region-0
      prefix: finapp/staging/migrator/
      auth:
        jwt:
          serviceAccountRef:
            name: finapp-migrator-secret-reader
