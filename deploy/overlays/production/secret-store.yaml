# How production reaches its secret store (P15-TSK-018, ADR-0123). A store per workload, each read through its own
# ServiceAccount, so that the identity behind one cannot read the other's entries.
#
# NO REAL ACCOUNT, REGION OR ENDPOINT IS COMMITTED, by the same convention as the image digests: account 000000000000 and
# the region placeholder-region-0, which no cloud serves, so an unpromoted overlay reaches nothing. The manifest policy
# refuses any other account number in an ARN, in any field of anything rendered. The real ones belong to the environment (the security modules
# build the roles these names stand for; SECRET_MANAGEMENT.md section 3.5).
#
# These two ServiceAccounts run no pod. The operator exchanges a token for each to read the store, so the workloads
# themselves, which run as finapp-app and finapp-migrator, are never given a cloud identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finapp-app-secret-reader
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/placeholder-finapp-app-secret-reader
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finapp-migrator-secret-reader
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/placeholder-finapp-migrator-secret-reader
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: finapp-app-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: placeholder-region-0
      prefix: finapp/production/app/
      auth:
        jwt:
          serviceAccountRef:
            name: finapp-app-secret-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: finapp-migrator-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: placeholder-region-0
      prefix: finapp/production/migrator/
      auth:
        jwt:
          serviceAccountRef:
            name: finapp-migrator-secret-reader
---
# The application's SCRAM entry, under the name the managed brokers dictate. Reached through the application's own reader.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: finapp-app-kafka-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: placeholder-region-0
      prefix: AmazonMSK_finapp-production-
      auth:
        jwt:
          serviceAccountRef:
            name: finapp-app-secret-reader
