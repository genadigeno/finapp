# Production's five releases, in the order a cluster takes them (P15-TSK-017, ADR-0122 decision 4, C8; OPERATIONS_RUNBOOK.md sections
# 11.32 and 11.36; the fifth since P17-TSK-105). Synced by production's root Application (deploy/delivery/roots/production.yaml), whose
# sync waves order these:
#
#   0  finapp-admission    deploy/admission: the image policies, before any namespace they watch holds a pod
#   1  finapp-namespaces   deploy/namespaces: the platform's namespaces, the console's among them, with their Pod Security and admission
#                          labels. Never Argo CD's CreateNamespace, which would create finapp with neither (DeliveryManifestsTest refuses it)
#   2  finapp              deploy/overlays/production: the application's release, itself ordered by deploy/components/delivery-order
#   3  finapp-edge         deploy/edge/overlays/production: traffic is admitted once the release it routes to is healthy
#   4  finapp-console      deploy/console/overlays/production: the Operator Console's static server (X-TSK-020), last (P17-TSK-105)
#
# THE CONSOLE COMES LAST, so nothing of the platform waits on it. Its image is finapp-admin-panel's build, released on its own: a console
# that never turns healthy (its digest the placeholder, its image unsigned and refused by admission) holds no wave of the release's or
# the edge's, which are created and syncing by then, and the operator edge answers /console with 502 meanwhile. It does hold the root's
# own sync at its wave until it is healthy, so a change to deploy/delivery itself waits for it (section 11.36). Its namespace,
# finapp-console, is wave 1's, with its labels, and never Argo CD's.
#
# A wave waits for the one before only because the controller's configuration judges an Application healthy when it is synced and
# healthy (deploy/delivery/controller/argocd-cm.yaml): Argo CD removed that judgement from its defaults in 1.8. These waves order the
# root's own sync, when the Applications are created or the root changes; once each exists, a change merged to two of them at once
# reaches both in no defined order. So a change touches one Application's paths, and two are two changes, merged in wave order
# (OPERATIONS_RUNBOOK.md section 11.36).
#
# The admission policies and the namespaces belong to project finapp-cluster, the release, the edge and the console to project finapp,
# so neither group can create what the other owns. All of deploy/delivery/ is admin-equivalent on the cluster (project.yaml says why).
#
# HOW A CHANGE REACHES PRODUCTION. A merge to master that a second person approved (.github/CODEOWNERS on every path below); the
# controller pulls it. The console's digest is its own promotion (infra/scripts/promote.sh console), of a digest staging was given first,
# and a change of its own. No CI credential reaches this cluster: CI holds a read-only token and no environment (THREAT_MODEL.md T30).
# Self-heal puts back what a person changed by hand; prune removes what the repository no longer names, after everything else
# (PruneLast), except the namespaces, which are never pruned: one removed from the repository must not take its contents with it.
# No retry, stated as `retry.limit: 0`: a failed migration is fixed forward, never run again by the controller. Stated, because
# leaving it out is not none: Argo CD 3.6.1 retried an automated sync that stated no retry five times (seen on kind, P15-TSK-032,
# 2026-11-12), and a retry is the whole sync again, its hook with it. Argo CD does not re-attempt a commit whose sync failed. A rollback is a revert pull request through infra/scripts/promote.sh, never Argo CD's own rollback, which
# would leave the repository saying one thing and the cluster another.
#
# No finalizer: deleting an Application leaves what it applied running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finapp-admission
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: finapp-cluster
  source:
    repoURL: https://github.com/genadigeno/finapp.git
    targetRevision: master
    path: deploy/admission
  destination:
    server: https://kubernetes.default.svc
    namespace: finapp
  syncPolicy:
    retry:
      limit: 0
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finapp-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: finapp-cluster
  source:
    repoURL: https://github.com/genadigeno/finapp.git
    targetRevision: master
    path: deploy/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: finapp
  syncPolicy:
    retry:
      limit: 0
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - FailOnSharedResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finapp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: finapp
  source:
    repoURL: https://github.com/genadigeno/finapp.git
    targetRevision: master
    path: deploy/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: finapp
  syncPolicy:
    retry:
      limit: 0
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finapp-edge
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: finapp
  source:
    repoURL: https://github.com/genadigeno/finapp.git
    targetRevision: master
    path: deploy/edge/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: finapp-edge
  syncPolicy:
    retry:
      limit: 0
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
---
# The Operator Console (P17-TSK-105): its own namespace, the root's last wave, the same policy as the release's and the edge's - prune,
# self-heal, no retry stated, no finalizer. Its digest is written by infra/scripts/promote.sh console with the record beside it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finapp-console
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: finapp
  source:
    repoURL: https://github.com/genadigeno/finapp.git
    targetRevision: master
    path: deploy/console/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: finapp-console
  syncPolicy:
    retry:
      limit: 0
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
