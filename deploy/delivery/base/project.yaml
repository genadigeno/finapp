# The Argo CD project of the platform's release and edge Applications (P15-TSK-017, ADR-0122 decision 4, C8; OPERATIONS_RUNBOOK.md
# section 11.36). One per cluster: staging and production are separate accounts and clusters, so each controller holds its own copy,
# synced by that environment's root Application from deploy/delivery/<environment>.
#
# WHAT IT BOUNDS: one repository, the platform's three namespaces (the release's, the edge's and, since P17-TSK-105, the Operator
# Console's), nothing outside a namespace, and inside one only the kinds the release, the edge and the console render
# (DeliveryManifestsTest holds the list to them). A Secret is not among them: a committed one is refused by the manifest policy, and
# here too, so a credential can only come from the store. The admission policies and the namespaces are another project's
# (project-cluster.yaml), so none of the three can create a ClusterImagePolicy or a Namespace.
#
# THE CONSOLE IN THIS PROJECT, not one of its own (P17-TSK-105), as the edge is: a namespaced release from this repository whose kinds are
# a subset of the release's, so a project of its own would bound nothing this one does not, beyond the destination. Its overlay names its
# namespace once (deploy/console/base's `namespace: finapp-console`), and FailOnSharedResource refuses an object another Application owns.
#
# WHAT DOES NOT BOUND IT. This file is synced by the root, whose project writes AppProjects and Applications in argocd, and Argo CD's
# own documentation says what that is: a project with access to Argo CD's namespace, and the ability to create Applications in any
# project, are admin-level. So a merged change under deploy/delivery/ can widen this project, add another, or put an Application in
# `default`: everything under deploy/delivery/ is admin-equivalent on the cluster, and the control on it is the code owner's review
# (.github/CODEOWNERS) and the root's rendered set (DeliveryManifestsTest), not this file.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: finapp
  namespace: argocd
  annotations:
    # Before the Applications that name it. In the same wave the root created an Application a second before its project, the
    # Application's first sync failed for want of the project, and with no retry it stayed failed (seen on kind, P15-TSK-032).
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: The platform's release, edge and console, synced from this repository alone
  sourceRepos:
    - https://github.com/genadigeno/finapp.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: finapp
    - server: https://kubernetes.default.svc
      namespace: finapp-edge
    - server: https://kubernetes.default.svc
      namespace: finapp-console
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: "", kind: ServiceAccount}
    - {group: "", kind: ConfigMap}
    - {group: "", kind: Service}
    - {group: "", kind: ResourceQuota}
    - {group: "", kind: LimitRange}
    - {group: apps, kind: Deployment}
    - {group: batch, kind: Job}
    - {group: autoscaling, kind: HorizontalPodAutoscaler}
    - {group: policy, kind: PodDisruptionBudget}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: external-secrets.io, kind: SecretStore}
  orphanedResources:
    warn: true
