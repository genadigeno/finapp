# Argo CD's `default` project, restricted to nothing (P15-TSK-032; OPERATIONS_RUNBOOK.md section 11.36). Not synced by any Application:
# the pipeline role applies it with the controller, in the stream infra/scripts/controller-check.sh renders and holds to
# infra/scripts/manifest-policy/controllers.rego (rule controller-default-project), and the kind rehearsal's delivery scope installs that
# same stream and sees an Application placed here refused.
#
# WHY. As Argo CD installs it, `default` accepts any repository, any destination and any kind, and every Application names a project. So an
# Application written in `argocd` by anyone who can write one there, or by a merged change under deploy/delivery/ that names no project of
# this repository's, would reach the whole cluster. Restricted, it reaches nothing: no source repository, no source namespace, no
# destination, every namespaced kind refused, and no cluster-scoped kind (an empty whitelist allows none). The shape is the one Argo CD's
# own documentation gives for disabling the default project (read 2026-11-12). It cannot be deleted, only restricted.
#
# THE ORDER OF THE INSTALL. Argo CD creates `default`, open, whenever it starts and finds none. Applied in one stream with the install, this
# object is refused (its kind is not yet known while the definitions are being created) and the controller then creates the open one: seen
# on kind, 2026-11-12. So the pipeline role applies the definitions, waits for them, applies this, and only then the rest of the install.
# Every field that could reach anything is stated, empty, so that applying this over an open default (server-side, taking the fields)
# closes each of them rather than leaving a field another writer set.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  description: Restricted to nothing - every Application of this platform names one of its own projects
  sourceRepos: []
  sourceNamespaces: []
  destinations: []
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - group: "*"
      kind: "*"
