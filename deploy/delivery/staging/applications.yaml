# Staging's four releases, in the order a cluster takes them (P15-TSK-017, ADR-0122 decision 4, C8; OPERATIONS_RUNBOOK.md sections
# 11.32 and 11.36). Synced by staging's root Application (deploy/delivery/roots/staging.yaml), whose sync waves order these:
#
#   0  finapp-admission    deploy/admission: the image policies, before any namespace they watch holds a pod
#   1  finapp-namespaces   deploy/namespaces: the three namespaces with their Pod Security and admission labels. Never Argo CD's
#                          CreateNamespace, which would create finapp with neither (DeliveryManifestsTest refuses it)
#   2  finapp              deploy/overlays/staging: the application's release, itself ordered by deploy/components/delivery-order
#   3  finapp-edge         deploy/edge/overlays/staging: traffic is admitted once the release it routes to is healthy
#
# A wave waits for the one before only because the controller's configuration judges an Application healthy when it is synced and
# healthy (deploy/delivery/controller/argocd-cm.yaml): Argo CD removed that judgement from its defaults in 1.8. These waves order the
# root's own sync, when the Applications are created or the root changes; once each exists, a change merged to two of them at once
# reaches both in no defined order. So a change touches one Application's paths, and two are two changes, merged in wave order
# (OPERATIONS_RUNBOOK.md section 11.36).
#
# The admission policies and the namespaces belong to project finapp-cluster, the release and the edge to project finapp, so neither
# of these two can create what the other two own. All of deploy/delivery/ is admin-equivalent on the cluster (project.yaml says why).
#
# HOW A CHANGE REACHES STAGING. A merge to master; the controller pulls it. A staging promotion is reviewed like every change under
# deploy/, by a code owner (.github/CODEOWNERS owns all of it), and its smoke record is what a production promotion of the same pair
# must name, merged before that promotion. No CI credential reaches this cluster: CI holds a
# read-only token and no environment (THREAT_MODEL.md T30).
# Self-heal puts back what a person changed by hand; prune removes what the repository no longer names, after everything else
# (PruneLast), except the namespaces, which are never pruned: one removed from the repository must not take its contents with it.
# No retry, stated as `retry.limit: 0`: a failed migration is fixed forward, never run again by the controller. Stated, because
# leaving it out is not none: Argo CD 3.6.1 retried an automated sync that stated no retry five times (seen on kind, P15-TSK-032,
# 2026-11-12), and a retry is the whole sync again, its hook with it. Argo CD does not re-attempt a commit whose sync failed. A rollback is a revert pull request through infra/scripts/promote.sh, never Argo CD's own rollback, which
# would leave the repository saying one thing and the cluster another.
#
# No finalizer: deleting an Application leaves what it applied running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finapp-admission
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: finapp-cluster
  source:
    repoURL: https://github.com/genadigeno/finapp.git
    targetRevision: master
    path: deploy/admission
  destination:
    server: https://kubernetes.default.svc
    namespace: finapp
  syncPolicy:
    retry:
      limit: 0
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finapp-namespaces
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: finapp-cluster
  source:
    repoURL: https://github.com/genadigeno/finapp.git
    targetRevision: master
    path: deploy/namespaces
  destination:
    server: https://kubernetes.default.svc
    namespace: finapp
  syncPolicy:
    retry:
      limit: 0
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - FailOnSharedResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finapp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: finapp
  source:
    repoURL: https://github.com/genadigeno/finapp.git
    targetRevision: master
    path: deploy/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: finapp
  syncPolicy:
    retry:
      limit: 0
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finapp-edge
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: finapp
  source:
    repoURL: https://github.com/genadigeno/finapp.git
    targetRevision: master
    path: deploy/edge/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: finapp-edge
  syncPolicy:
    retry:
      limit: 0
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - FailOnSharedResource=true
