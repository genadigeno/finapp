# Neither workload calls the Kubernetes API, so neither holds a token. Stated here and again on each
# pod: a pod's own field wins over its ServiceAccount's, so both are refused if they say otherwise.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finapp-app
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finapp-migrator
automountServiceAccountToken: false
