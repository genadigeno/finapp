# The Operator Console's static server (X-TSK-020; finapp-admin-panel P17-TSK-004, finapp-admin-panel ADR-C130 decision 2 and ADR-C131 decision 4), a release
# of its own in a namespace of its own: content-hashed assets served by a non-root nginx, no secret, no credential, no data. Reached from
# the operator edge's controllers alone, which route GET /console and /console/** to it under the console's own headers (operator-edge.yaml's
# console-headers; operator-routes.yaml's operator-console, generated by EdgeAllowListTest). Never on the public edge.
#
# Render an overlay, never this directory: only an overlay names the image's digest. infra/scripts/edge-check.sh renders each overlay
# beside the application's and the edge's and runs all three through the policies (manifest-policy/edge.rego's [edge-console-*]).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finapp-console

resources:
  - console.yaml
  - networkpolicy.yaml
  # The namespace's quota at its worst moment, counted as finapp-edge's is (manifest-policy/edge.rego's [edge-quota-*]).
  - resourcequota.yaml
  # The cluster watcher's read of this namespace (P17-TSK-044): list and watch on its receiver's kinds, so the console's readiness is alerted.
  - rbac-cluster-watch.yaml
