# The Gradle distribution is pinned by version AND verified by SHA-256.
#
# distributionSha256Sum is a supply-chain control: the wrapper refuses to run if
# the downloaded distribution does not hash to this value, so a compromised
# mirror, a MITM proxy, or a corrupted transfer fails the build loudly instead
# of silently executing untrusted code.
#
# Both checksums below were taken from Gradle's own service and cross-checked:
#   distribution : https://services.gradle.org/distributions/gradle-9.7.1-bin.zip.sha256
#   wrapper jar  : https://services.gradle.org/distributions/gradle-9.7.1-wrapper.jar.sha256
# gradle/wrapper/gradle-wrapper.jar hashes to
#   7a9ce74cff467ca1bf60a4fcd9f05185acceda4d0f382434d393e17864262c5d
#
# To upgrade Gradle: run
#   ./gradlew wrapper --gradle-version <v> --gradle-distribution-sha256-sum <sha>
# taking <sha> from services.gradle.org — never from a mirror or a search result.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
