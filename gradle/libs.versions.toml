# Gradle version catalog — the single source of truth for dependency versions.
#
# Rule: no version literal appears in any build script. If a build file contains
# a version string, it belongs here instead. This exists so that a dependency
# upgrade is one reviewable line in one file, not a search across modules — and
# so that "which version of X are we on?" has exactly one answer.
#
# Scope note (P0-TSK-001): this catalog is deliberately minimal. Entries are
# added by the task that first needs them, not speculatively:
#   Flyway        -> P0-TSK-005      ArchUnit      -> P0-TSK-007
#   Testcontainers-> P0-TSK-035      WireMock      -> P0-TSK-037
#   OpenTelemetry -> P0-TSK-028

[versions]
# The Java toolchain version. This is the most fundamental version pin in the build, so it
# belongs here with every other version rather than being repeated in build scripts. It is
# read by the convention plugin, by build-logic's own Kotlin compilation, and injected into
# tests so BuildToolchainTest asserts against one source rather than a second copy of "21".
javaToolchain = "21"

# Spring Boot 4.1.1 is the current GA line. Chosen over the 3.5.x line because
# this platform spans 17 phases: starting on a superseded major guarantees a
# framework migration during Phases 3-5, which are the financially critical
# ones. See docs/project/CURRENT_STATE.md change log.
springBoot = "4.1.1"

# Test libraries are declared explicitly, not inherited from the Spring Boot BOM.
#
# `sharedkernel` must have no Spring Framework dependency (P0-TSK-002 acceptance
# criterion, MODULE_ARCHITECTURE.md). Taking its test libraries from the Spring
# BOM would make that independence a matter of interpretation — a BOM
# contributes constraints rather than artefacts — and would leave the BOM sitting
# there as an invitation to add a Spring artefact later. Explicit is unambiguous.
#
# These versions are deliberately set to exactly what Spring Boot 4.1.1 manages,
# so every module runs one JUnit and one AssertJ. ON EVERY SPRING BOOT UPGRADE,
# re-check these against the new BOM:
#   curl .../spring-boot-dependencies-<version>.pom | grep -E "junit-jupiter.version|assertj.version"
# ArchUnit is not managed by the Spring Boot BOM, so its version is pinned here like any
# other. It enforces the module boundaries in MODULE_ARCHITECTURE.md that Gradle cannot
# express: cross-module internals, cross-module entity references, framework leakage.
archunit = "1.5.0"

# ASM, TEST SCOPE ONLY (P0-TSK-041).
#
# ArchUnit models field and method ACCESSES, not bytecode instructions, so it can see a
# `synchronized` METHOD (an access flag) and is blind to a `synchronized` BLOCK (a MONITORENTER
# instruction) - verified by probe: the block method reports no modifiers at all. The acceptance
# criterion requires failing on a planted block, so the check needs instruction-level access.
#
# Declared explicitly rather than taken from ArchUnit's shaded copy or from ByteBuddy's transitive
# one: a shaded package is an internal detail that moves on upgrade, and a transitive dependency
# can vanish when the library that brought it changes.
asm = "9.7.1"

# springdoc generates the OpenAPI document from the running application (P0-TSK-026).
# 3.1.0 is the Spring Boot 4 / Spring Framework 7 line; the 2.8.x line targets Boot 3.
#
# TEST SCOPE ONLY, deliberately. springdoc reads the request mappings and never changes
# them, so a document generated with it on the test classpath describes the same
# application that ships. Keeping it out of the runtime means the contract is a reviewed
# build artefact rather than an unauthenticated /v3/api-docs endpoint that changes with
# every deployment - and it is one fewer library in the shipped dependency set.
# BouncyCastle, RUNTIME (P1-TSK-007).
#
# spring-security-crypto's Argon2PasswordEncoder delegates to BouncyCastle's Argon2BytesGenerator
# and declares the dependency as optional, so it has to be named here or credential derivation
# fails at run time with NoClassDefFoundError rather than at build time.
#
# Pinned here and not taken from the Spring Boot BOM because the BOM does not manage it - checked,
# rather than assumed: spring-boot-dependencies 4.1.1 has a spring-security.version property and no
# bouncycastle one. This is one of the few versions the BOM does not decide for us, so it needs the
# same review on upgrade that any other catalog entry gets.
#
# bcprov-jdk18on is the JDK 1.8+ artefact line; 1.85.2 is the current release, confirmed against
# Maven Central's own <release> marker rather than a search result (the P0-TSK-037 lesson, where
# <latest> and <release> both pointed at a beta).
bouncycastle = "1.85.2"

springdoc = "3.1.0"

# Tomcat, pinned ABOVE what the Spring Boot BOM manages.
#
# Spring Boot 4.1.1 brings tomcat-embed-core 11.0.24, which carries three CRITICAL advisories -
# CVE-2026-65182 (security-constraint bypass), CVE-2026-65905 (DIGEST authenticator replay) and
# CVE-2026-68525 (FORM authentication bypass). All three are fixed in 11.0.25, and 4.1.1 is the
# latest stable 4.1.x: there is no patch release to move to, and 4.2.0-M1 is a milestone.
#
# So the version is overridden here and applied as a dependency CONSTRAINT in app/build.gradle.kts.
# A constraint rather than `force`: it participates in conflict resolution, so when a future Spring
# Boot manages 11.0.26 the newer version still wins and this entry does not hold the platform back.
#
# This is a deliberate deviation from the BOM and it is the only one. Revisit it when Spring Boot
# manages 11.0.25 or later, at which point the constraint becomes redundant - harmless, but one
# fewer thing to explain.
#
# The three embed artefacts are constrained together. Only -core is affected, but they are released
# as one and share internals; a build running 11.0.25 core against 11.0.24 el is a configuration
# nobody tested.
tomcat = "11.0.25"

junitJupiter = "6.0.3"
assertj = "3.27.7"

# Lombok, COMPILE TIME ONLY - the project-standard boilerplate reducer (.claude/rules/java-lombok.md).
#
# Applied by the convention plugin to every Java module as compileOnly + annotationProcessor (and
# the test and test-fixture equivalents), so it is never on a runtime classpath, in a jar or in
# the SBOM: what ships is the bytecode Lombok wrote, not Lombok.
#
# Pinned here like JUnit and AssertJ rather than taken from the Spring Boot BOM, for the same
# reason: `sharedkernel` applies no Spring BOM, and one version must serve every module. Set to
# exactly what Spring Boot 4.1.1 manages (lombok.version = 1.18.46) - checked in the BOM, not
# assumed. ON EVERY SPRING BOOT UPGRADE, re-check it alongside junit-jupiter and assertj.
lombok = "1.18.46"

# WireMock, TEST SCOPE ONLY (P0-TSK-037). The provider failure-simulation harness ADR-0008
# names, so that "every adapter is contract-tested against simulated failure" is a thing an
# adapter author reaches for rather than rebuilds.
#
# 3.13.2 is the current STABLE line. Maven Central's <latest> and <release> markers both point
# at 4.0.0-beta.38 - a pre-release - so "the newest version" and "the newest version you should
# use" are different answers here, and a tool that reads the marker gets the wrong one.
# Dependabot skips pre-releases unless the project is already on one, which this is not.
#
# The STANDALONE artefact, deliberately. WireMock embeds Jetty, and Spring Boot picks its
# servlet container by what is on the classpath - so an unshaded WireMock would put a second
# container in front of every @SpringBootTest in `app`. The standalone jar relocates Jetty and
# Jackson 2 out of the way, which keeps a test harness from changing what the tests under it
# run on. Measured, not assumed: see the P0-TSK-037 notes in CURRENT_STATE.md.
wiremock = "3.13.2"

# Flyway and the JDBC driver are pinned to exactly what Spring Boot 4.1.1 manages, for the
# same reason as JUnit and AssertJ: one version across the build. Flyway in particular must
# not differ between the tool that applies migrations and any runtime that validates them —
# the schema history table is a shared format.
flyway = "12.4.0"
postgresqlDriver = "42.7.13"

# CycloneDX produces the SBOM that CI's dependency scan consumes. Gradle has no native
# machine-readable dependency export, and a vulnerability scanner cannot scan a build
# script — so the SBOM is the minimal enabler for the "dependency scan" that P0-TSK-004
# requires, not an extra. It is also the artefact P0-TSK-039 (dependency verification and
# locking) will build on, and the thing that answers "what is actually in this build?"
cyclonedx = "3.4.1"

# Infrastructure image versions — the single source of truth, shared by compose.yaml and
# (from P0-TSK-035) Testcontainers. Local infrastructure and test infrastructure must be the
# same version: a difference between them is a defect the test suite cannot see, and
# collation, broker semantics and eviction behaviour all vary across versions.
#
# `verifyInfrastructureVersions` fails the build if compose.yaml and this list disagree in
# EITHER direction — a drifted version, or an image in compose.yaml that is pinned nowhere.
postgresImage = "18.6"
kafkaImage = "4.3.1"
redisImage = "8.10.1"

# Observability infrastructure (P0-TSK-029). Pinned on the same terms as the three above and
# checked by `verifyInfrastructureVersions`: a dashboard that renders against one Grafana
# version and not another is exactly the difference the drift check exists to prevent.
prometheusImage = "v3.14.0"
grafanaImage = "12.4.10"

[libraries]
# --- BOM -------------------------------------------------------------------
# Consumed via platform(). This propagates managed versions to every dependency
# below, which is why those declarations carry no version of their own.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

# --- Application (versions supplied by the BOM) -----------------------------
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# The HTTP surface, added by P0-TSK-024 - the first task with anything outward-facing.
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
# Tomcat, constrained above the BOM to clear three CRITICAL advisories — see the version note.
tomcat-embed-core = { module = "org.apache.tomcat.embed:tomcat-embed-core", version.ref = "tomcat" }
tomcat-embed-el = { module = "org.apache.tomcat.embed:tomcat-embed-el", version.ref = "tomcat" }
tomcat-embed-websocket = { module = "org.apache.tomcat.embed:tomcat-embed-websocket", version.ref = "tomcat" }
# Jakarta Bean Validation, added by P0-TSK-025: rejection at the boundary, declared on the
# request type rather than written by hand in every handler.
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
# Health, readiness and build info (P0-TSK-027). The endpoints an orchestrator asks, which is
# why they are production dependencies rather than test ones like springdoc: nothing else can
# answer "should this instance receive traffic?"
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
# Plain JDBC and a connection pool - deliberately NOT spring-boot-starter-data-jpa.
#
# Readiness has to be checked through the pool the application itself uses; a health check that
# opens its own connection reports healthy while the pool is exhausted, which is exactly when
# traffic must be diverted. That needs a DataSource, and a DataSource is all it needs.
#
# Choosing an ORM is unresolved question 12 and belongs to Phase 3: Hibernate's dirty checking
# emits UPDATEs, and INV-LED-03/INV-HIST-01 say posted financial records are never updated. This
# entry must not become the accidental answer to that question.
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }

# --- Logging facade (version supplied by the BOM) ----------------------------
# The facade only. platform binds nothing: choosing an implementation is the
# application's job, and a library that picks one imposes it on every consumer.
slf4j-api = { module = "org.slf4j:slf4j-api" }

# --- Tracing (P0-TSK-028) ------------------------------------------------------
# Split the same way as logging, and for the same reason. `platform` takes the FACADE only -
# micrometer-tracing is to tracing what slf4j is to logging - so a library module never
# imposes an implementation on its consumers. `app`, the composition root, binds the
# implementation: the OpenTelemetry bridge, which is what SYSTEM_ARCHITECTURE.md's
# observability stack names.
#
# Versions come from the Spring Boot BOM (micrometer-tracing 1.7.1, OpenTelemetry 1.62.0), so
# the tracing graph stays internally consistent with everything else Boot manages.
micrometer-tracing = { module = "io.micrometer:micrometer-tracing" }
# Spring Boot 4 split the actuator into modules, so the Micrometer bridge alone auto-configures
# nothing: with only the bridge on the classpath there is no Tracer bean and no
# SdkTracerProvider, and every span is silently dropped. This is the module that wires them.
spring-boot-micrometer-tracing-opentelemetry = { module = "org.springframework.boot:spring-boot-micrometer-tracing-opentelemetry" }
# BOTH are needed, and the failure when one is missing is silent. The Boot module supplies the
# auto-configuration; that auto-configuration is @ConditionalOnClass on the bridge, so without
# the bridge it backs off entirely, leaving a NOOP Tracer, no SdkTracerProvider, and spans that
# are recorded into nothing. Nothing fails - there are simply no traces.
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }

# --- Metrics (P0-TSK-029) ------------------------------------------------------
# The Prometheus registry. Version from the Spring Boot BOM, like everything else, so the
# metrics graph stays consistent with the tracing one - both are Micrometer.
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
# The in-memory span exporter. Test scope: it is how a test asserts what was actually recorded,
# rather than asserting that a tracing call was made - the same argument as logback's list
# appender in the correlation tests.
opentelemetry-sdk-testing = { module = "io.opentelemetry:opentelemetry-sdk-testing" }
# Logback's list appender is how a test asserts what was actually logged, rather
# than asserting that a logging call was made. Test scope only.
logback-classic = { module = "ch.qos.logback:logback-classic" }

# --- Compile-time code generation -------------------------------------------------
# Lombok: compileOnly + annotationProcessor only, wired once by finapp.java-conventions. Never
# declare it as implementation or runtimeOnly - see the version note.
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# --- Test libraries, for modules that must not see Spring ---------------------
junit-bom = { module = "org.junit:junit-bom", version.ref = "junitJupiter" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
asm = { module = "org.ow2.asm:asm", version.ref = "asm" }
# Standalone (shaded) rather than the plain artefact - see the version note above.
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }
# The -api starter, not -ui: a Swagger UI is an extra surface nobody here needs.
# Argon2id (P1-TSK-007, ADR-0032).
#
# ADR-0032 forbids a custom primitive, a hand-rolled comparison and a bespoke salting scheme, which
# is precisely the set of things Argon2PasswordEncoder provides. It brings no filter chain and
# enables no web security: nothing here is Spring Security the framework.
#
# WHAT IT ACTUALLY NEEDS AT RUN TIME IS NOT WHAT ITS POM SAYS, and that was established by running
# it rather than by reading. The POM's only declared dependency is an OPTIONAL assertj. In fact the
# encoder needs BouncyCastle to derive and spring-core to verify, and each gap surfaced as a
# separate NoClassDefFoundError from a test using the real encoder - one at construction, one at
# `matches`. A fake would have found neither, and the application would have failed on its first
# real login.
#
# VERSION-MANAGED BY THE SPRING BOOT BOM (spring-security.version = 7.1.1), so no version.ref. That
# is deliberate: this and any later Spring Security artefact must move together.
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto" }

# Required at run time by spring-security-crypto, despite its POM (P1-TSK-007).
#
# `AbstractValidatingPasswordEncoder.matches` calls org.springframework.util.StringUtils, and the
# encoder's constructor calls commons-logging - which spring-core depends on directly, Spring
# Framework 7 having dropped the repackaged spring-jcl bridge (last released 6.2.19).
#
# So `identity` does take a Spring Framework runtime dependency, which is worth stating plainly
# rather than describing the jar as standalone. It is permitted: MODULE_ARCHITECTURE.md section 6
# keeps Spring out of `sharedkernel`, and `platform` already carries slf4j and micrometer. The
# alternative was BouncyCastle's Argon2BytesGenerator directly, which would mean writing the salt
# generation, the PHC encoding and the constant-time comparison by hand - the three things ADR-0032
# names as the risk.
#
# Version-managed by the Spring Boot BOM.
spring-core = { module = "org.springframework:spring-core" }

# The Argon2 implementation the encoder delegates to. Runtime-only: no code compiles against it.
bouncycastle-provider = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

springdoc-openapi-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }

# --- Database migration -------------------------------------------------------
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
# Version from the Spring Boot BOM's Testcontainers management, like its postgresql sibling.
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
# Version from the Spring Boot BOM (kafka.version), which manages the client the broker in
# compose.yaml is compatible with. P2-TSK-001; the broker image stays pinned separately above.
kafka-clients = { module = "org.apache.kafka:kafka-clients" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
postgresql-driver = { module = "org.postgresql:postgresql", version.ref = "postgresqlDriver" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
