# Secrets in source, written for this repository and vendored here so nothing is fetched at run time (ADR-0122
# decision 2). A net beside gitleaks (history) and CommittedConfigurationHoldsNoSecretTest (configuration), which are
# the controls for those places; this one reads the source tree as it stands.
#
# No fixture commits a real-shaped key: the two shaped rules are proven by infra/scripts/sast.sh, which writes its plant
# at run time from pieces, so gitleaks never meets one in this repository's history (P0-TSK-031's rule).
rules:
  - id: finapp-secret-private-key-block
    languages: [generic]
    severity: ERROR
    message: A private key in the source tree. Keys come from the secret store (ADR-0020); rotate this one.
    pattern-regex: '-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----'

  - id: finapp-secret-issued-token
    languages: [generic]
    severity: ERROR
    message: A token in a shape only an issuer gives (AWS, GitHub, Slack, a live payment key). Rotate it; secrets come from the secret store (ADR-0020).
    pattern-regex: \b(?:AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|xox[baprs]-[A-Za-z0-9-]{10,}|sk_live_[A-Za-z0-9]{16,})\b

  - id: finapp-secret-credential-literal
    languages: [java]
    severity: ERROR
    message: A credential written as a literal. Secrets are externalised (ADR-0020) and held in Sensitive; the one marked local default is ConfinedCredential's.
    patterns:
      - pattern-either:
          - pattern: $TYPE $NAME = "...";
          - pattern: $O.$NAME = "...";
          - pattern: $NAME = "...";
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^(?!.*(?:_|^)(?:HEADER|PARAM|PARAMETER|PROPERTY|VARIABLE|ENV|NAME|PREFIX|SUFFIX|ATTRIBUTE|COLUMN|PATH|SQL|MASK|FIELD|KEY_ID|LABEL|ALGORITHM|TYPE|URL|MESSAGE|REASON|ERROR)$).*(?:password|passwd|pwd|secret|credential|api_?key|private_?key|access_?key)
      - pattern-not: $TYPE $NAME = "";
      - pattern-not: $O.$NAME = "";
      - pattern-not: $NAME = "";
