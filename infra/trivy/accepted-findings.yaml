# The findings the image scan carries instead of failing on (P15-TSK-006; PHASE_GATES.md section 5 Phase 15 criterion 2).
#
# This is the one place a HIGH or CRITICAL finding stops failing the build, so it is short, reviewed and expiring:
#
#   - THE THREAT MODEL ACCEPTS, THIS FILE ONLY APPLIES. Each id below is listed with its date in
#     docs/architecture/THREAT_MODEL.md section 6 item 12, and SecurityScansAreWiredTest fails the build if the two
#     disagree. Only the owner accepts a risk (the register's section 1.4). The owner accepted these on 2026-11-09, and
#     the job is green only because of them; the owner withdrawing one removes it here.
#   - EVERY ENTRY HAS A REASON AND AN EXPIRY. Trivy honours expired_at itself: past that date the entry stops applying and
#     the finding fails the job again, so nothing is carried forever by being forgotten.
#   - A FINDING IS REMOVED HERE WHEN ITS FIX ARRIVES. Keep this file to what is actually carried: a fixed finding's
#     row stays harmlessly silent, so check it at each base-image or dependency bump.
#
# As read on 2026-11-09 by Trivy 0.76.2 on both images, freshly built: 10 HIGH, 0 CRITICAL, no secret, no misconfiguration, the same
# ten rows on each. Eight more, on the application's own libraries, were carried here until those libraries were moved to
# their fixed releases, the same day: section 6 item 12 of the threat register keeps that record.
