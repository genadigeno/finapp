# Local development scrape configuration.
#
# Scrapes the application running on the HOST, not in this compose project: the application is
# started from Gradle or an IDE during development, and a Prometheus that could only see a
# containerised build would be monitoring something nobody runs.
#
# SECURITY: this whole stack is local-development-only, bound to loopback. Nothing here
# establishes a pattern for production - where the scrape endpoint sits behind network policy
# and P0-EPIC-10's authentication, which is recorded as debt.

global:
  # Short, deliberately. A developer changing something wants to see it within a few seconds;
  # this interval is not a proposal for production, where it is a cost-and-resolution trade.
  scrape_interval: 5s
  evaluation_interval: 5s

# Alert rules (P8-TSK-024: the settlement and reconciliation alerts). Resolved relative to THIS
# file, so compose mounts infra/prometheus/rules beside it at /etc/prometheus/rules. Evaluated and
# shown at /alerts; no Alertmanager is wired - routing and paging are Phase 15's, and the
# `severity` label only says which kind each alert will be.
rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: finapp
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          # A LABEL, not a metric tag. Which target a sample came from is the scraper's question,
          # which is exactly why MetricNames forbids the application from tagging it itself.
          env: local
          # Whether this environment OFFERS lending (P11-TSK-030): the LendingTermsNoneActive alert reads it, so a
          # product without ACTIVE terms alerts only where it is meant to be offered. Production's expected state is
          # "false" until OPERATIONS_RUNBOOK.md section 7.4's activation gate opens; local development offers nothing
          # unless a developer activates terms, and then sets this to "true".
          lending_offered: "false"
          # Whether this environment OFFERS BNPL (P12-TSK-026): the BnplTermsNoneActive alert reads it, the same way.
          # Production's expected state is "false" until OPERATIONS_RUNBOOK.md section 8.1's activation gate opens.
          bnpl_offered: "false"
          # Whether this environment's risk policies are meant to JUDGE (P13-TSK-024): the RiskPolicyNoneActive alert
          # reads it, so an operation without an ACTIVE policy version alerts only where judging is expected.
          # Production's expected state is "false" until OPERATIONS_RUNBOOK.md section 9.1's activation gate opens -
          # every seam answering ALLOW with NO_POLICY_ACTIVE recorded; its last step sets this to "true".
          risk_judging: "false"
