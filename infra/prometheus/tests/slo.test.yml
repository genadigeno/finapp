# promtool unit tests for infra/prometheus/rules/slo-recording.yml and slo.yml (P15-TSK-025): each objective fires its fast and its slow pair, a healthy series fires neither, one instance burning alone does not page the fleet, and a burn that stopped stops paging.
# Generated once and reviewed as written; CI runs every file here through promtool (infra/scripts/alert-rules-check.sh, P15-TSK-025).
# Two instances wherever instances can differ: the multi-instance case is the rule's aggregation.

rule_files:
  - ../rules/slo-recording.yml
  - ../rules/slo.yml

evaluation_interval: 1m

tests:
  # authentication_availability: fleet ratio 0.0216 (instance a 0, b 0.0432): above the fast and slow thresholds, so both pairs fire.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="finapp", instance="a:8081", method="POST", status="201", uri="/v1/authentications"}'
        values: '0+6000x80'
      - series: 'http_server_requests_seconds_count{job="finapp", instance="b:8081", method="POST", status="201", uri="/v1/authentications"}'
        values: '0+5741x80'
      - series: 'http_server_requests_seconds_count{job="finapp", instance="b:8081", method="POST", status="500", uri="/v1/authentications"}'
        values: '0+259x80'
    alert_rule_test:
      - eval_time: 30m
        alertname: AuthenticationAvailabilityBurnFast
        exp_alerts:
          - exp_labels:
              owner: identity
              severity: page
              slo: authentication_availability
            exp_annotations:
              summary: "The error budget of the authentication and session routes is burning fast"
              description: "the authentication and session routes: errors over 1h and 5m exceed 14.4 times the budget of 99.9% non-5xx. See OPERATIONS_RUNBOOK.md section 11.8."
      - eval_time: 30m
        alertname: AuthenticationAvailabilityBurnSlow
        exp_alerts:
          - exp_labels:
              owner: identity
              severity: ticket
              slo: authentication_availability
            exp_annotations:
              summary: "The error budget of the authentication and session routes is burning steadily"
              description: "the authentication and session routes: errors over 6h and 30m exceed 6 times the budget of 99.9% non-5xx. See OPERATIONS_RUNBOOK.md section 11.8."

  # authentication_availability: fleet ratio 0.0102: above the slow threshold only.
  - interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="finapp", instance="a:8081", method="POST", status="201", uri="/v1/authentications"}'
        values: '0+6000x80'
      - series: 'http_server_requests_seconds_count{job="finapp", instance="b:8081", method="POST", status="201", uri="/v1/authentications"}'
        values: '0+5878x80'
      - series: 'http_server_requests_seconds_count{job="finapp", instance="b:8081", method="POST", status="500", uri="/v1/authentications"}'
        values: '0+122x80'
    alert_rule_test:
      - eval_time: 30m
        alertname: AuthenticationAvailabilityBurnFast
        exp_alerts: []
      - eval_time: 30m
        alertname: AuthenticationAvailabilityBurnSlow
        exp_alerts:
          - exp_labels:
              owner: identity
              severity: ticket
              slo: authentication_availability
            exp_annotations:
              summary: "The error budget of the authentication and session routes is burning steadily"
              description: "the authentication and session routes: errors over 6h and 30m exceed 6 times the budget of 99.9% non-5xx. See OPERATIONS_RUNBOOK.md section 11.8."

