        exp_alerts: []
      - eval_time: 2h
        alertname: ReconciliationRuleSetMissing
        exp_alerts: []
      - eval_time: 2h
        alertname: CrossBorderCancellationSpike
        exp_alerts: []
      - eval_time: 2h
        alertname: ReferenceRateNeverFetched
        exp_alerts: []
      - eval_time: 2h
        alertname: FxGaugesUnreadable
        exp_alerts: []

  # Each reading broken on b alone (the plan verdict on both, since max() reads it): every threshold rule fires.
  - interval: 1m
    input_series:
      - series: 'finapp_fx_rate_age{job="finapp", instance="a:8081", pair="EUR-USD"}'
        values: '30x180'
      - series: 'finapp_fx_rate_age{job="finapp", instance="b:8081", pair="EUR-USD"}'
        values: '600x180'
      - series: 'finapp_fx_quote_total{job="finapp", instance="a:8081", outcome="refused_implausible", pair="EUR-USD"}'
        values: '4x180'
      - series: 'finapp_fx_quote_total{job="finapp", instance="b:8081", outcome="refused_implausible", pair="EUR-USD"}'
        values: '0+1x180'
      - series: 'finapp_fx_cover_unknown_age_seconds{job="finapp", instance="a:8081", provider="fx-sim-a"}'
        values: '0x180'
      - series: 'finapp_fx_cover_unknown_age_seconds{job="finapp", instance="b:8081", provider="fx-sim-a"}'
        values: '600x180'
      - series: 'finapp_fx_cover_open_age_seconds{job="finapp", instance="a:8081", provider="fx-sim-a"}'
        values: '0x180'
      - series: 'finapp_fx_cover_open_age_seconds{job="finapp", instance="b:8081", provider="fx-sim-a"}'
        values: '600x180'
      - series: 'finapp_fx_proof{job="finapp", instance="a:8081", purpose="FX_POSITION"}'
        values: '0x180'
      - series: 'finapp_fx_proof{job="finapp", instance="b:8081", purpose="FX_POSITION"}'
        values: '2x180'
      - series: 'finapp_fx_plan_verdict{job="finapp", instance="a:8081"}'
        values: '0x180'
      - series: 'finapp_fx_plan_verdict{job="finapp", instance="b:8081"}'
        values: '0x180'
      - series: 'finapp_payments_outbound_unknown_age{job="finapp", instance="a:8081"}'
        values: '0x180'
      - series: 'finapp_payments_outbound_unknown_age{job="finapp", instance="b:8081"}'
        values: '1000x180'
      - series: 'finapp_payments_outbound_received_age{job="finapp", instance="a:8081"}'
        values: '0x180'
      - series: 'finapp_payments_outbound_received_age{job="finapp", instance="b:8081"}'
        values: '15000x180'
      - series: 'finapp_crossborder_payment_in_transit_age{job="finapp", instance="a:8081", corridor="EUR-GBP"}'
        values: '0x180'
      - series: 'finapp_crossborder_payment_in_transit_age{job="finapp", instance="b:8081", corridor="EUR-GBP"}'
        values: '90000x180'
      - series: 'finapp_kyc_counterparty_review_age_seconds{job="finapp", instance="a:8081"}'
        values: '0x180'
      - series: 'finapp_kyc_counterparty_review_age_seconds{job="finapp", instance="b:8081"}'
        values: '90000x180'
      - series: 'finapp_reconciliation_rule_set_missing{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '0x180'
      - series: 'finapp_reconciliation_rule_set_missing{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: '1x180'
