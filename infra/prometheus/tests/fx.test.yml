      - series: 'finapp_crossborder_payment_total{job="finapp", instance="a:8081", outcome="submitted"}'
        values: '0+1x180'
      - series: 'finapp_crossborder_payment_total{job="finapp", instance="b:8081", outcome="submitted"}'
        values: '0+1x180'
    alert_rule_test:
      - eval_time: 1h50m
        alertname: ReferenceRateStale
        exp_alerts:
          - exp_labels:
              owner: "fx"
              pair: "EUR-USD"
              severity: "page"
            exp_annotations:
              description: "The latest EUR-USD reference snapshot was received 10m 0s ago on the database clock. Quotes in this pair fail closed. Check the simulated-reference source and finapp_fx_rate_fetch_total by outcome. See OPERATIONS_RUNBOOK.md section 11.24."
              summary: "The reference rate for EUR-USD is stale"
      - eval_time: 1h50m
        alertname: FxQuoteImplausibleRefusals
        exp_alerts:
          - exp_labels:
              owner: "fx"
              pair: "EUR-USD"
              severity: "ticket"
            exp_annotations:
              description: "At least one EUR-USD firm quote fell outside the reference band in five minutes. Check the provider's rates against the reference source. See OPERATIONS_RUNBOOK.md section 11.24."
              summary: "Implausible provider quotes refused for EUR-USD"
      - eval_time: 1h50m
        alertname: FxCoverUnknownAged
        exp_alerts:
          - exp_labels:
              owner: "fx"
              provider: "fx-sim-a"
              severity: "page"
            exp_annotations:
              description: "The oldest UNKNOWN cover on fx-sim-a has waited 10m 0s. The cover sweep inquires by our reference; check the provider's availability. See OPERATIONS_RUNBOOK.md section 11.24."
              summary: "An FX cover on fx-sim-a has had no answer for over five minutes"
      - eval_time: 1h50m
        alertname: FxCoverOpenAged
        exp_alerts:
          - exp_labels:
              owner: "fx"
              provider: "fx-sim-a"
              severity: "page"
            exp_annotations:
              description: "The oldest open cover on fx-sim-a is 10m 0s old. The platform carries that position until it executes. See OPERATIONS_RUNBOOK.md section 11.24."
              summary: "An FX position leg on fx-sim-a has been uncovered for over five minutes"
      - eval_time: 1h50m
        alertname: FxBooksUnexplained
        exp_alerts:
          - exp_labels:
              owner: "fx"
              purpose: "FX_POSITION"
              severity: "page"
            exp_annotations:
              description: "2 currencies of FX_POSITION do not equal what fx's rows say they must. Read the FX position report and the books proof's lines. See OPERATIONS_RUNBOOK.md section 11.24."
              summary: "The FX books proof fails for FX_POSITION"
      - eval_time: 1h50m
        alertname: FxPlanDiverged
        exp_alerts:
          - exp_labels:
              owner: "fx"
              severity: "page"
            exp_annotations:
              description: "The plan verdict reads diverged: a trade's posted entry differs from its recomputed plan. Read the trade's provenance. See OPERATIONS_RUNBOOK.md section 11.24."
              summary: "A booked FX plan no longer replays"
      - eval_time: 1h50m
        alertname: OutboundCreditUnknownAged
        exp_alerts:
          - exp_labels:
              owner: "fx"
              severity: "page"
            exp_annotations:
              description: "The oldest unanswered outbound credit has waited 16m 40s. The resolution sweep inquires by our reference; check the corridor provider. See OPERATIONS_RUNBOOK.md section 11.24."
              summary: "A cross-border outbound credit has had no answer for over fifteen minutes"
      - eval_time: 1h50m
        alertname: OutboundCreditUndecided
        exp_alerts:
          - exp_labels:
              owner: "fx"
              severity: "ticket"
            exp_annotations:
              description: "The oldest RECEIVED outbound credit has waited 4h 10m 0s for the provider's decision. Raise it with the provider. See OPERATIONS_RUNBOOK.md section 11.24."
              summary: "A corridor provider has held a credit undecided past its decision deadline"
      - eval_time: 1h50m
        alertname: CrossBorderPaymentUndelivered
        exp_alerts:
          - exp_labels:
              corridor: "EUR-GBP"
              owner: "fx"
              severity: "ticket"
            exp_annotations:
              description: "The oldest in-transit payment on EUR-GBP has waited 1d 1h 0m 0s since the provider accepted it. Read its trace. See OPERATIONS_RUNBOOK.md section 11.24."
              summary: "A payment on EUR-GBP is undelivered past its delivery estimate"
      - eval_time: 1h50m
        alertname: CounterpartyReviewAged
        exp_alerts:
          - exp_labels:
              owner: "fx"
              severity: "ticket"
            exp_annotations:
              description: "The oldest open counterparty review has waited 1d 1h 0m 0s. A beneficiary stays unpayable until a reviewer decides. See OPERATIONS_RUNBOOK.md section 11.24."
              summary: "A counterparty screening review has waited over a day"
      - eval_time: 1h50m
        alertname: ReconciliationRuleSetMissing
        exp_alerts:
          - exp_labels:
              owner: "fx"
              severity: "ticket"
              source: "PSP_SIM"
            exp_annotations:
              description: "Reports from PSP_SIM cannot be matched until two controllers activate its rule set v1, and they wait PARSED, so an accounting month cannot have its run: RECONCILIATION_DISCLOSURE stands MONTH_NOT_RUN (P14-TSK-012, OPERATIONS_RUNBOOK.md section 10.3)."
              summary: "The settlement source PSP_SIM has no active rule set"
      - eval_time: 1h50m
        alertname: CrossBorderCancellationSpike
        exp_alerts:
          - exp_labels:
              owner: "fx"
              severity: "ticket"
            exp_annotations:
              description: "The cancellation rate over the last hour is 50% - customers may be using recalls as a free option against the rate. See OPERATIONS_RUNBOOK.md section 11.24."
              summary: "Cross-border cancellations exceed a fifth of submitted payments"

  # A pair's reference rate never fetched: its age NaN on both instances, so the threshold cannot compare it.
