          - exp_labels:
              severity: ticket
              owner: fx
              job: finapp
              instance: b:8081
              gauge: finapp_reconciliation_rule_set_missing
            exp_annotations:
              summary: "An FX or cross-border gauge has no value: finapp_reconciliation_rule_set_missing"
              description: "finapp_reconciliation_rule_set_missing on b:8081 reads NaN - its read is failing there, or that instance's gauge refresher is behind - so its threshold alert cannot fire there. See OPERATIONS_RUNBOOK.md section 11.8."

  # Every gauge a number on both instances: nothing.
