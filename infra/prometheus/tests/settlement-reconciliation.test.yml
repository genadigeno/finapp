# promtool unit tests for every alert in infra/prometheus/rules/settlement-reconciliation.yml: ReconciliationGaugesUnreadable's
# (P15-TSK-024's fix round, 2026-11-08), and since 2026-11-12 a firing case and a silent one on its own series for each of
# the others. Run from the repository root, as platform.test.yml says:
#   ... --entrypoint promtool prom/prometheus@sha256:<the v3.14.0 digest> test rules settlement-reconciliation.test.yml
# Two instances: a reading breaks on b while a stays healthy, so each rule's aggregation across the fleet is what fires.
# ReconciliationGaugesUnreadable's first two groups: every gauge the rule names NaN on b (its read failing, or its
# refresher behind), numbers on a. One alert per gauge, on b alone, its series named in `gauge` - each leg present, every
# label of a series folded into it.
# Every firing case written since 2026-11-12 had its expectation generated by the pinned promtool from the rule, and was
# reviewed as written.

rule_files:
  - ../rules/settlement-reconciliation.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'finapp_reconciliation_run_age_seconds{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '0x16'
      - series: 'finapp_reconciliation_run_age_seconds{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_settlement_file_age{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '0x16'
      - series: 'finapp_settlement_file_age{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_reconciliation_expectation_overdue{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '0x16'
      - series: 'finapp_reconciliation_expectation_overdue{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_reconciliation_suspense_age_seconds{job="finapp", instance="a:8081"}'
        values: '0x16'
      - series: 'finapp_reconciliation_suspense_age_seconds{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="critical"}'
        values: '0x16'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="critical"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="high"}'
        values: '0x16'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="high"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="medium"}'
        values: '0x16'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="medium"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="low"}'
        values: '0x16'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="low"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 9m
        alertname: ReconciliationGaugesUnreadable
        exp_alerts: []
      - eval_time: 11m
        alertname: ReconciliationGaugesUnreadable
        exp_alerts:
          - exp_labels:
              severity: ticket
              owner: reconciliation
              job: finapp
              instance: b:8081
              gauge: finapp_reconciliation_run_age_seconds
            exp_annotations:
              summary: "A settlement or reconciliation gauge has no value: finapp_reconciliation_run_age_seconds"
              description: "finapp_reconciliation_run_age_seconds on b:8081 reads NaN - its read is failing there, or that instance's gauge refresher is behind - so its threshold alert cannot fire there. See OPERATIONS_RUNBOOK.md section 11.8."
          - exp_labels:
              severity: ticket
              owner: reconciliation
              job: finapp
              instance: b:8081
              gauge: finapp_settlement_file_age
            exp_annotations:
              summary: "A settlement or reconciliation gauge has no value: finapp_settlement_file_age"
              description: "finapp_settlement_file_age on b:8081 reads NaN - its read is failing there, or that instance's gauge refresher is behind - so its threshold alert cannot fire there. See OPERATIONS_RUNBOOK.md section 11.8."
          - exp_labels:
              severity: ticket
              owner: reconciliation
              job: finapp
              instance: b:8081
              gauge: finapp_reconciliation_expectation_overdue
            exp_annotations:
              summary: "A settlement or reconciliation gauge has no value: finapp_reconciliation_expectation_overdue"
              description: "finapp_reconciliation_expectation_overdue on b:8081 reads NaN - its read is failing there, or that instance's gauge refresher is behind - so its threshold alert cannot fire there. See OPERATIONS_RUNBOOK.md section 11.8."
          - exp_labels:
              severity: ticket
              owner: reconciliation
              job: finapp
              instance: b:8081
              gauge: finapp_reconciliation_suspense_age_seconds
            exp_annotations:
              summary: "A settlement or reconciliation gauge has no value: finapp_reconciliation_suspense_age_seconds"
              description: "finapp_reconciliation_suspense_age_seconds on b:8081 reads NaN - its read is failing there, or that instance's gauge refresher is behind - so its threshold alert cannot fire there. See OPERATIONS_RUNBOOK.md section 11.8."
          - exp_labels:
              severity: ticket
              owner: reconciliation
              job: finapp
              instance: b:8081
              gauge: finapp_reconciliation_break_age
            exp_annotations:
              summary: "A settlement or reconciliation gauge has no value: finapp_reconciliation_break_age"
              description: "finapp_reconciliation_break_age on b:8081 reads NaN - its read is failing there, or that instance's gauge refresher is behind - so its threshold alert cannot fire there. See OPERATIONS_RUNBOOK.md section 11.8."

  # Every gauge a number on both instances: nothing.
  - interval: 1m
    input_series:
      - series: 'finapp_reconciliation_run_age_seconds{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '0x16'
      - series: 'finapp_reconciliation_run_age_seconds{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: '0x16'
      - series: 'finapp_settlement_file_age{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '0x16'
      - series: 'finapp_settlement_file_age{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: '0x16'
      - series: 'finapp_reconciliation_expectation_overdue{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '0x16'
      - series: 'finapp_reconciliation_expectation_overdue{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: '0x16'
      - series: 'finapp_reconciliation_suspense_age_seconds{job="finapp", instance="a:8081"}'
        values: '0x16'
      - series: 'finapp_reconciliation_suspense_age_seconds{job="finapp", instance="b:8081"}'
        values: '0x16'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="critical"}'
        values: '0x16'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="critical"}'
        values: '0x16'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="high"}'
        values: '0x16'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="high"}'
        values: '0x16'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="medium"}'
        values: '0x16'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="medium"}'
        values: '0x16'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="low"}'
        values: '0x16'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="low"}'
        values: '0x16'
    alert_rule_test:
      - eval_time: 11m
        alertname: ReconciliationGaugesUnreadable
        exp_alerts: []

  # Every reading healthy on both instances for three hours - every proof at zero, runs young and unblocked, sources heard
  # within the day, files and suspense young, breaks inside their bands: nothing fires, each rule past its own wait.
  - interval: 1m
    input_series:
      - series: 'finapp_reconciliation_position_proof{job="finapp", instance="a:8081", purpose="CUSTOMER_FUNDS"}'
        values: '0x180'
      - series: 'finapp_reconciliation_position_proof{job="finapp", instance="b:8081", purpose="CUSTOMER_FUNDS"}'
        values: '0x180'
      - series: 'finapp_reconciliation_line_unattributed{job="finapp", instance="a:8081", purpose="CUSTOMER_FUNDS"}'
        values: '0x180'
      - series: 'finapp_reconciliation_line_unattributed{job="finapp", instance="b:8081", purpose="CUSTOMER_FUNDS"}'
        values: '0x180'
      - series: 'finapp_reconciliation_cash_proof{job="finapp", instance="a:8081", currency="EUR"}'
        values: '0x180'
      - series: 'finapp_reconciliation_cash_proof{job="finapp", instance="b:8081", currency="EUR"}'
        values: '0x180'
      - series: 'finapp_reconciliation_suspense_unowned{job="finapp", instance="a:8081"}'
        values: '0x180'
      - series: 'finapp_reconciliation_suspense_unowned{job="finapp", instance="b:8081"}'
        values: '0x180'
      - series: 'finapp_reconciliation_run_blocked{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '0x180'
      - series: 'finapp_reconciliation_run_blocked{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: '0x180'
      - series: 'finapp_reconciliation_run_age_seconds{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '600x180'
      - series: 'finapp_reconciliation_run_age_seconds{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: '600x180'
      - series: 'finapp_settlement_source_silence{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '3600x180'
      - series: 'finapp_settlement_source_silence{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: '3600x180'
      - series: 'finapp_settlement_file_age{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '300x180'
      - series: 'finapp_settlement_file_age{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: '300x180'
      - series: 'finapp_settlement_delivery_refused_total{job="finapp", instance="a:8081", source="PSP_SIM", outcome="malformed"}'
        values: '3x180'
      - series: 'finapp_settlement_delivery_refused_total{job="finapp", instance="b:8081", source="PSP_SIM", outcome="malformed"}'
        values: '3x180'
      - series: 'finapp_reconciliation_expectation_overdue{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '0x180'
      - series: 'finapp_reconciliation_expectation_overdue{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: '0x180'
      - series: 'finapp_reconciliation_suspense_age_seconds{job="finapp", instance="a:8081"}'
        values: '86400x180'
      - series: 'finapp_reconciliation_suspense_age_seconds{job="finapp", instance="b:8081"}'
        values: '86400x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="critical"}'
        values: '0x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="critical"}'
        values: '0x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="high"}'
        values: '3600x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="high"}'
        values: '3600x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="medium"}'
        values: '86400x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="medium"}'
        values: '86400x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="low"}'
        values: '86400x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="low"}'
        values: '86400x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: PositionProofFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: UnattributedLinesOnReconciledPosition
        exp_alerts: []
      - eval_time: 2h
        alertname: CashProofFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: SuspenseItemUnowned
        exp_alerts: []
      - eval_time: 2h
        alertname: ReconciliationRunBlocked
        exp_alerts: []
      - eval_time: 2h
        alertname: ReconciliationRunStalled
        exp_alerts: []
      - eval_time: 2h
        alertname: SettlementSourceSilent
        exp_alerts: []
      - eval_time: 2h
        alertname: SettlementFileStuck
        exp_alerts: []
      - eval_time: 2h
        alertname: SettlementDeliveryRefused
        exp_alerts: []
      - eval_time: 2h
        alertname: SettlementExpectationOverdue
        exp_alerts: []
      - eval_time: 2h
        alertname: SuspenseItemAged
        exp_alerts: []
      - eval_time: 2h
        alertname: BreakAgeCritical
        exp_alerts: []
      - eval_time: 2h
        alertname: BreakAgeHigh
        exp_alerts: []
      - eval_time: 2h
        alertname: BreakAgeMedium
        exp_alerts: []
      - eval_time: 2h
        alertname: BreakAgeLow
        exp_alerts: []
      - eval_time: 2h
        alertname: MustBeZeroGaugeUnreadable
        exp_alerts: []
      - eval_time: 2h
        alertname: ReconciliationGaugesUnreadable
        exp_alerts: []

  # Each reading broken on b alone: every threshold rule fires, the low band's an hour after its break.
  - interval: 1m
    input_series:
      - series: 'finapp_reconciliation_position_proof{job="finapp", instance="a:8081", purpose="CUSTOMER_FUNDS"}'
        values: '0x180'
      - series: 'finapp_reconciliation_position_proof{job="finapp", instance="b:8081", purpose="CUSTOMER_FUNDS"}'
        values: '1x180'
      - series: 'finapp_reconciliation_line_unattributed{job="finapp", instance="a:8081", purpose="CUSTOMER_FUNDS"}'
        values: '0x180'
      - series: 'finapp_reconciliation_line_unattributed{job="finapp", instance="b:8081", purpose="CUSTOMER_FUNDS"}'
        values: '2x180'
      - series: 'finapp_reconciliation_cash_proof{job="finapp", instance="a:8081", currency="EUR"}'
        values: '0x180'
      - series: 'finapp_reconciliation_cash_proof{job="finapp", instance="b:8081", currency="EUR"}'
        values: '1x180'
      - series: 'finapp_reconciliation_suspense_unowned{job="finapp", instance="a:8081"}'
        values: '0x180'
      - series: 'finapp_reconciliation_suspense_unowned{job="finapp", instance="b:8081"}'
        values: '1x180'
      - series: 'finapp_reconciliation_run_blocked{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '0x180'
      - series: 'finapp_reconciliation_run_blocked{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: '1x180'
      - series: 'finapp_reconciliation_run_age_seconds{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '600x180'
      - series: 'finapp_reconciliation_run_age_seconds{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: '7200x180'
      - series: 'finapp_settlement_source_silence{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '3600x180'
      - series: 'finapp_settlement_source_silence{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: '90000x180'
      - series: 'finapp_settlement_file_age{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '300x180'
      - series: 'finapp_settlement_file_age{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: '7200x180'
      - series: 'finapp_settlement_delivery_refused_total{job="finapp", instance="a:8081", source="PSP_SIM", outcome="malformed"}'
        values: '3x180'
      - series: 'finapp_settlement_delivery_refused_total{job="finapp", instance="b:8081", source="PSP_SIM", outcome="malformed"}'
        values: '0+1x180'
      - series: 'finapp_reconciliation_expectation_overdue{job="finapp", instance="a:8081", source="PSP_SIM"}'
        values: '0x180'
      - series: 'finapp_reconciliation_expectation_overdue{job="finapp", instance="b:8081", source="PSP_SIM"}'
        values: '3x180'
      - series: 'finapp_reconciliation_suspense_age_seconds{job="finapp", instance="a:8081"}'
        values: '86400x180'
      - series: 'finapp_reconciliation_suspense_age_seconds{job="finapp", instance="b:8081"}'
        values: '2600000x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="critical"}'
        values: '0x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="critical"}'
        values: '60x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="high"}'
        values: '3600x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="high"}'
        values: '90000x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="medium"}'
        values: '86400x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="medium"}'
        values: '440000x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="a:8081", severity="low"}'
        values: '86400x180'
      - series: 'finapp_reconciliation_break_age{job="finapp", instance="b:8081", severity="low"}'
        values: '1300000x180'
    alert_rule_test:
      - eval_time: 1h50m
        alertname: PositionProofFailing
        exp_alerts:
          - exp_labels:
              owner: "reconciliation"
              purpose: "CUSTOMER_FUNDS"
              severity: "page"
            exp_annotations:
              description: "1 currencies of CUSTOMER_FUNDS fail the position proof. Follow up with GET /v1/operator/reports/reconciliation/positions. See OPERATIONS_RUNBOOK.md section 11.23."
              summary: "Position proof failing for CUSTOMER_FUNDS (INV-REC-06)"
      - eval_time: 1h50m
        alertname: UnattributedLinesOnReconciledPosition
        exp_alerts:
          - exp_labels:
              owner: "reconciliation"
              purpose: "CUSTOMER_FUNDS"
              severity: "page"
            exp_annotations:
              description: "2 lines on CUSTOMER_FUNDS answer to no expectation. Follow up with GET /v1/operator/reports/reconciliation/positions. See OPERATIONS_RUNBOOK.md section 11.23."
              summary: "Unattributed lines on the reconciled position CUSTOMER_FUNDS"
      - eval_time: 1h50m
        alertname: CashProofFailing
        exp_alerts:
          - exp_labels:
              currency: "EUR"
              owner: "reconciliation"
              severity: "page"
            exp_annotations:
              description: "Cash at bank in EUR is not the head closing of an unbroken statement chain. Follow up with GET /v1/operator/reports/reconciliation/positions and the bank statements at GET /v1/operator/settlement/files. See OPERATIONS_RUNBOOK.md section 11.23."
              summary: "Cash proof failing in EUR (INV-SET-06)"
      - eval_time: 1h50m
        alertname: SuspenseItemUnowned
        exp_alerts:
          - exp_labels:
              owner: "reconciliation"
              severity: "page"
            exp_annotations:
              description: "1 suspense items hold a remainder no open break owns. Follow up with GET /v1/operator/reports/reconciliation/suspense. See OPERATIONS_RUNBOOK.md section 11.23."
              summary: "Suspense items with no open break answering for them (INV-REC-09)"
      - eval_time: 1h50m
        alertname: ReconciliationRunBlocked
        exp_alerts:
          - exp_labels:
              owner: "reconciliation"
              severity: "page"
              source: "PSP_SIM"
            exp_annotations:
              description: "1 runs of PSP_SIM are blocked - an accepted batch nobody is matching. Follow up with GET /v1/operator/reconciliation/runs, then POST /v1/operator/reconciliation/runs/{id}/requeue. See OPERATIONS_RUNBOOK.md section 11.23."
              summary: "Blocked reconciliation run for PSP_SIM"
      - eval_time: 1h50m
        alertname: ReconciliationRunStalled
        exp_alerts:
          - exp_labels:
              owner: "reconciliation"
              severity: "ticket"
              source: "PSP_SIM"
            exp_annotations:
              description: "The oldest incomplete run of PSP_SIM is 2h 0m 0s old. Follow up with GET /v1/operator/reconciliation/runs. See OPERATIONS_RUNBOOK.md section 11.23."
              summary: "A reconciliation run of PSP_SIM is over an hour old"
      - eval_time: 1h50m
        alertname: SettlementSourceSilent
        exp_alerts:
          - exp_labels:
              owner: "reconciliation"
              severity: "ticket"
              source: "PSP_SIM"
            exp_annotations:
              description: "PSP_SIM has been silent for 1d 1h 0m 0s. Follow up with GET /v1/operator/settlement/sources and GET /v1/operator/settlement/files; a pullable source can be fetched with POST /v1/operator/settlement/sources/{code}/fetch. See OPERATIONS_RUNBOOK.md section 11.23."
              summary: "No accepted settlement batch from PSP_SIM for over a day"
      - eval_time: 1h50m
        alertname: SettlementFileStuck
        exp_alerts:
          - exp_labels:
              owner: "reconciliation"
              severity: "ticket"
              source: "PSP_SIM"
            exp_annotations:
              description: "The oldest non-terminal file of PSP_SIM has waited 2h 0m 0s. Follow up with GET /v1/operator/settlement/files. See OPERATIONS_RUNBOOK.md section 11.23."
              summary: "A settlement file of PSP_SIM has waited over an hour"
      - eval_time: 1h50m
        alertname: SettlementDeliveryRefused
        exp_alerts:
          - exp_labels:
              outcome: "malformed"
              owner: "reconciliation"
              severity: "ticket"
              source: "PSP_SIM"
            exp_annotations:
              description: "Deliveries from PSP_SIM were refused in the last 15 minutes, reason malformed. Follow up with GET /v1/operator/settlement/refused-deliveries. See OPERATIONS_RUNBOOK.md section 11.23."
              summary: "Settlement deliveries refused for PSP_SIM (malformed)"
      - eval_time: 1h50m
        alertname: SettlementExpectationOverdue
        exp_alerts:
          - exp_labels:
              owner: "reconciliation"
              severity: "ticket"
              source: "PSP_SIM"
            exp_annotations:
              description: "3 expectations of PSP_SIM are past their window with no settling evidence. Follow up with GET /v1/operator/reconciliation/expectations and GET /v1/operator/reconciliation/breaks. See OPERATIONS_RUNBOOK.md section 11.23."
              summary: "Overdue settlement expectations for PSP_SIM (INV-SET-02)"
      - eval_time: 1h50m
        alertname: SuspenseItemAged
        exp_alerts:
          - exp_labels:
              owner: "reconciliation"
              severity: "ticket"
            exp_annotations:
              description: "The oldest suspense item has been open 30d 2h 13m 20s. Follow up with GET /v1/operator/reports/reconciliation/suspense. See OPERATIONS_RUNBOOK.md section 11.23."
              summary: "A suspense item has been open for over 30 days (INV-REC-05)"
      - eval_time: 1h50m
        alertname: BreakAgeCritical
        exp_alerts:
          - exp_labels:
              break_severity: "critical"
              owner: "reconciliation"
