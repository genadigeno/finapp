# promtool unit tests for every alert in infra/prometheus/rules/credit.yml: CreditScorecardMissing's and CreditPolicyMissing's
# (P15-TSK-025; the debt row "No alert names a missing ACTIVE scorecard"), and since 2026-11-12 a firing case and a silent
# one on its own series for each of the others.
# CI runs every file here through promtool (infra/scripts/alert-rules-check.sh, P15-TSK-025).
# Two instances wherever instances can differ: the multi-instance case is the rule's aggregation.
# The cases written before 2026-11-12 were generated once and reviewed as written (P15-TSK-025); every firing case written since had
# its expectation generated by the pinned promtool from the rule, and was reviewed as written.

rule_files:
  - ../rules/credit.yml

evaluation_interval: 1m

tests:
  # Requests wait with no scorecard: instance b NaN, a reading three: fires at 15 minutes, long before the seven-day validity.
  - interval: 1m
    input_series:
      - series: 'finapp_credit_scorecard_awaited{job="finapp", instance="a:8081"}'
        values: '3x20'
      - series: 'finapp_credit_scorecard_awaited{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 14m
        alertname: CreditScorecardMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: CreditScorecardMissing
        exp_alerts:
          - exp_labels:
              owner: credit
              severity: ticket
            exp_annotations:
              summary: "Credit requests are waiting for a scorecard"
              description: "3 credit requests wait at SUBMITTED because no RETAIL_SCORECARD is ACTIVE, and nothing can decide them until one is. See OPERATIONS_RUNBOOK.md section 6.1."

  # No request waits: silent.
  - interval: 1m
    input_series:
      - series: 'finapp_credit_scorecard_awaited{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_credit_scorecard_awaited{job="finapp", instance="b:8081"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: CreditScorecardMissing
        exp_alerts: []


  # CreditPolicyMissing (P15-TSK-032): the meter's own labels, the enum's names. A lending product at 0 fires after 15 minutes; the BNPL
  # products at 0, BNPL's expected state, never do. Written after the kind rehearsal saw them fire under a lower-case exclusion.
  - interval: 1m
    input_series:
      - series: 'finapp_credit_policy_active{job="finapp", instance="a:8081", product="PERSONAL_LOAN"}'
        values: '0x20'
      - series: 'finapp_credit_policy_active{job="finapp", instance="a:8081", product="CREDIT_LINE"}'
        values: '1x20'
      - series: 'finapp_credit_policy_active{job="finapp", instance="a:8081", product="BNPL_PAY_IN_4"}'
        values: '0x20'
      - series: 'finapp_credit_policy_active{job="finapp", instance="a:8081", product="BNPL_PAY_IN_N"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: CreditPolicyMissing
        exp_alerts: []
      - eval_time: 16m
        alertname: CreditPolicyMissing
        exp_alerts:
          - exp_labels:
              owner: credit
              severity: ticket
              product: PERSONAL_LOAN
            exp_annotations:
              summary: "The credit product PERSONAL_LOAN has no active policy"
              description: "No PERSONAL_LOAN request is accepted or decided until a policy version is activated by a person other than its proposer - the seeded v1 by one officer (ADR-0086; OPERATIONS_RUNBOOK.md section 6)."

  # Every reading healthy on both instances for three hours - every decision inside the objective, a tenth of the bureau's
  # answers unavailable, requests and reviews young (a case in review is never counted against the validity), no replay
  # diverged, both sweeps on: nothing fires, each rule past its own wait.
  - interval: 1m
    input_series:
      - series: 'finapp_credit_decision_latency_seconds_count{job="finapp", instance="a:8081", decision_maker="system", product="RETAIL_LOAN"}'
        values: '0+10x180'
      - series: 'finapp_credit_decision_latency_seconds_count{job="finapp", instance="b:8081", decision_maker="system", product="RETAIL_LOAN"}'
        values: '0+10x180'
      - series: 'finapp_credit_decision_latency_seconds_bucket{job="finapp", instance="a:8081", decision_maker="system", product="RETAIL_LOAN", le="2700.0"}'
        values: '0+10x180'
      - series: 'finapp_credit_decision_latency_seconds_bucket{job="finapp", instance="b:8081", decision_maker="system", product="RETAIL_LOAN", le="2700.0"}'
        values: '0+10x180'
      - series: 'finapp_credit_data_request_total{job="finapp", instance="a:8081", outcome="received", source_kind="BUREAU", provider="bureau-sim-a"}'
        values: '0+10x180'
      - series: 'finapp_credit_data_request_total{job="finapp", instance="b:8081", outcome="received", source_kind="BUREAU", provider="bureau-sim-a"}'
        values: '0+10x180'
      - series: 'finapp_credit_data_request_total{job="finapp", instance="a:8081", outcome="unavailable", source_kind="BUREAU", provider="bureau-sim-a"}'
        values: '0+1x180'
      - series: 'finapp_credit_data_request_total{job="finapp", instance="b:8081", outcome="unavailable", source_kind="BUREAU", provider="bureau-sim-a"}'
        values: '0+1x180'
      - series: 'finapp_credit_request_open_age_seconds{job="finapp", instance="a:8081", status="submitted"}'
        values: '3600x180'
      - series: 'finapp_credit_request_open_age_seconds{job="finapp", instance="b:8081", status="submitted"}'
        values: '3600x180'
      - series: 'finapp_credit_request_open_age_seconds{job="finapp", instance="a:8081", status="in_review"}'
        values: '700000x180'
      - series: 'finapp_credit_request_open_age_seconds{job="finapp", instance="b:8081", status="in_review"}'
        values: '700000x180'
      - series: 'finapp_credit_review_age_seconds{job="finapp", instance="a:8081"}'
        values: '3600x180'
      - series: 'finapp_credit_review_age_seconds{job="finapp", instance="b:8081"}'
        values: '3600x180'
      - series: 'finapp_credit_replay{job="finapp", instance="a:8081", verdict="DIVERGED"}'
        values: '0x180'
      - series: 'finapp_credit_replay{job="finapp", instance="b:8081", verdict="DIVERGED"}'
        values: '0x180'
      - series: 'finapp_credit_replay{job="finapp", instance="a:8081", verdict="REPLAYS"}'
        values: '40x180'
      - series: 'finapp_credit_replay{job="finapp", instance="b:8081", verdict="REPLAYS"}'
        values: '40x180'
      - series: 'finapp_credit_policy_active{job="finapp", instance="a:8081", product="RETAIL_LOAN"}'
        values: '1x180'
      - series: 'finapp_credit_policy_active{job="finapp", instance="b:8081", product="RETAIL_LOAN"}'
        values: '1x180'
      - series: 'finapp_credit_progress_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_credit_progress_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '1x180'
      - series: 'finapp_credit_data_retry_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_credit_data_retry_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '1x180'
      - series: 'finapp_credit_scorecard_awaited{job="finapp", instance="a:8081"}'
        values: '0x180'
      - series: 'finapp_credit_scorecard_awaited{job="finapp", instance="b:8081"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: CreditDecisionLatencyAboveObjective
        exp_alerts: []
      - eval_time: 2h
        alertname: CreditDataUnavailable
        exp_alerts: []
      - eval_time: 2h
        alertname: CreditRequestOpenPastValidity
        exp_alerts: []
      - eval_time: 2h
        alertname: CreditReviewAged
        exp_alerts: []
      - eval_time: 2h
        alertname: CreditDecisionDiverged
        exp_alerts: []
      - eval_time: 2h
        alertname: CreditProgressSweeperOff
        exp_alerts: []
      - eval_time: 2h
        alertname: CreditDataRetrySweeperOff
        exp_alerts: []
      - eval_time: 2h
        alertname: CreditPolicyMissing
        exp_alerts: []
      - eval_time: 2h
        alertname: CreditScorecardMissing
        exp_alerts: []
      - eval_time: 2h
        alertname: CreditGaugesUnreadable
        exp_alerts: []

  # Each reading broken on b alone: half of b's decisions slower than the objective, most of b's answers unavailable, an old
  # request and an old review case, two decisions diverged, both sweeps off on b. Every threshold rule fires.
  - interval: 1m
    input_series:
      - series: 'finapp_credit_decision_latency_seconds_count{job="finapp", instance="a:8081", decision_maker="system", product="RETAIL_LOAN"}'
        values: '0+10x180'
      - series: 'finapp_credit_decision_latency_seconds_count{job="finapp", instance="b:8081", decision_maker="system", product="RETAIL_LOAN"}'
        values: '0+10x180'
      - series: 'finapp_credit_decision_latency_seconds_bucket{job="finapp", instance="a:8081", decision_maker="system", product="RETAIL_LOAN", le="2700.0"}'
        values: '0+10x180'
      - series: 'finapp_credit_decision_latency_seconds_bucket{job="finapp", instance="b:8081", decision_maker="system", product="RETAIL_LOAN", le="2700.0"}'
        values: '0+5x180'
      - series: 'finapp_credit_data_request_total{job="finapp", instance="a:8081", outcome="received", source_kind="BUREAU", provider="bureau-sim-a"}'
        values: '0+10x180'
      - series: 'finapp_credit_data_request_total{job="finapp", instance="b:8081", outcome="received", source_kind="BUREAU", provider="bureau-sim-a"}'
        values: '0+1x180'
      - series: 'finapp_credit_data_request_total{job="finapp", instance="a:8081", outcome="unavailable", source_kind="BUREAU", provider="bureau-sim-a"}'
        values: '0+1x180'
      - series: 'finapp_credit_data_request_total{job="finapp", instance="b:8081", outcome="unavailable", source_kind="BUREAU", provider="bureau-sim-a"}'
        values: '0+10x180'
      - series: 'finapp_credit_request_open_age_seconds{job="finapp", instance="a:8081", status="submitted"}'
        values: '3600x180'
      - series: 'finapp_credit_request_open_age_seconds{job="finapp", instance="b:8081", status="submitted"}'
        values: '700000x180'
      - series: 'finapp_credit_request_open_age_seconds{job="finapp", instance="a:8081", status="in_review"}'
        values: '700000x180'
      - series: 'finapp_credit_request_open_age_seconds{job="finapp", instance="b:8081", status="in_review"}'
        values: '700000x180'
      - series: 'finapp_credit_review_age_seconds{job="finapp", instance="a:8081"}'
        values: '3600x180'
      - series: 'finapp_credit_review_age_seconds{job="finapp", instance="b:8081"}'
        values: '90000x180'
      - series: 'finapp_credit_replay{job="finapp", instance="a:8081", verdict="DIVERGED"}'
        values: '0x180'
      - series: 'finapp_credit_replay{job="finapp", instance="b:8081", verdict="DIVERGED"}'
        values: '2x180'
      - series: 'finapp_credit_replay{job="finapp", instance="a:8081", verdict="REPLAYS"}'
        values: '40x180'
      - series: 'finapp_credit_replay{job="finapp", instance="b:8081", verdict="REPLAYS"}'
        values: '40x180'
      - series: 'finapp_credit_policy_active{job="finapp", instance="a:8081", product="RETAIL_LOAN"}'
        values: '1x180'
      - series: 'finapp_credit_policy_active{job="finapp", instance="b:8081", product="RETAIL_LOAN"}'
        values: '1x180'
      - series: 'finapp_credit_progress_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_credit_progress_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '0x180'
      - series: 'finapp_credit_data_retry_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_credit_data_retry_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '0x180'
      - series: 'finapp_credit_scorecard_awaited{job="finapp", instance="a:8081"}'
        values: '0x180'
      - series: 'finapp_credit_scorecard_awaited{job="finapp", instance="b:8081"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 1h50m
        alertname: CreditDecisionLatencyAboveObjective
        exp_alerts:
          - exp_labels:
              owner: "credit"
              product: "RETAIL_LOAN"
              severity: "page"
            exp_annotations:
              description: "25% of the platform's RETAIL_LOAN decisions in the last 30 minutes took longer than 45 minutes from submission - the collection window plus the platform's own steps. Check the progress sweep (finapp_credit_progress_sweeper_enabled) and finapp_credit_request_open_age_seconds by status. See OPERATIONS_RUNBOOK.md section 6.3."
              summary: "Credit decisions for RETAIL_LOAN are slower than the objective"
      - eval_time: 1h50m
        alertname: CreditDataUnavailable
        exp_alerts:
          - exp_labels:
              owner: "credit"
              severity: "ticket"
              source_kind: "BUREAU"
            exp_annotations:
              description: "50% of BUREAU answers in the last 15 minutes were unavailable. Decisions fall back to each policy's unavailable rule. Read the sources report (/v1/operator/reports/credit/sources) for the provider. See OPERATIONS_RUNBOOK.md section 6.3."
              summary: "More than a fifth of BUREAU credit data answers are unavailable"
      - eval_time: 1h50m
        alertname: CreditRequestOpenPastValidity
        exp_alerts:
          - exp_labels:
              owner: "credit"
              severity: "page"
              status: "submitted"
            exp_annotations:
              description: "The oldest submitted request was submitted 8d 2h 26m 40s ago, past every product's request validity. The progress sweep expires open requests on the database clock; check it is running. See OPERATIONS_RUNBOOK.md section 6.3."
              summary: "A credit decision request in submitted is open past its validity"
      - eval_time: 1h50m
        alertname: CreditReviewAged
        exp_alerts:
          - exp_labels:
              owner: "credit"
              severity: "ticket"
            exp_annotations:
              description: "The oldest open review case has waited 1d 1h 0m 0s. A referral nobody works expires at the request's validity - a silent decline. See OPERATIONS_RUNBOOK.md section 6.2."
              summary: "A credit review case has waited more than a day for an underwriter"
      - eval_time: 1h50m
        alertname: CreditDecisionDiverged
        exp_alerts:
          - exp_labels:
              owner: "credit"
              severity: "page"
            exp_annotations:
              description: "2 decisions replay DIVERGED. Replay each through POST /v1/operator/credit/decisions/{id}/replay to see what differs, by kind. See OPERATIONS_RUNBOOK.md section 6.3."
              summary: "Credit decisions do not replay from their sealed inputs"
      - eval_time: 1h50m
        alertname: CreditProgressSweeperOff
        exp_alerts:
          - exp_labels:
              instance: "b:8081"
              job: "finapp"
              owner: "credit"
              severity: "ticket"
            exp_annotations:
              description: "finapp.credit.progress.sweeper.enabled is false on a scraped instance. Requests still progress on the others; set it back to true. See OPERATIONS_RUNBOOK.md section 6.3."
              summary: "An instance is not running the credit decision progress sweep"
      - eval_time: 1h50m
        alertname: CreditDataRetrySweeperOff
        exp_alerts:
          - exp_labels:
              instance: "b:8081"
              job: "finapp"
              owner: "credit"
              severity: "ticket"
            exp_annotations:
              description: "finapp.credit.data.retry.sweeper.enabled is false on a scraped instance. Unanswered data requests are re-asked by the others; set it back to true. See OPERATIONS_RUNBOOK.md section 6.3."
              summary: "An instance is not running the credit data retry sweep"

  # Every credit gauge NaN on b, numbers on a: the unreadable rule fires once its quarter hour has passed.
  - interval: 1m
    input_series:
      - series: 'finapp_credit_request_open_age_seconds{job="finapp", instance="a:8081", status="submitted"}'
        values: '0x30'
      - series: 'finapp_credit_request_open_age_seconds{job="finapp", instance="b:8081", status="submitted"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_credit_request_open_age_seconds{job="finapp", instance="a:8081", status="in_review"}'
        values: '0x30'
      - series: 'finapp_credit_request_open_age_seconds{job="finapp", instance="b:8081", status="in_review"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_credit_review_age_seconds{job="finapp", instance="a:8081"}'
        values: '0x30'
      - series: 'finapp_credit_review_age_seconds{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_credit_replay{job="finapp", instance="a:8081", verdict="DIVERGED"}'
        values: '0x30'
      - series: 'finapp_credit_replay{job="finapp", instance="b:8081", verdict="DIVERGED"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_credit_replay{job="finapp", instance="a:8081", verdict="REPLAYS"}'
        values: '0x30'
      - series: 'finapp_credit_replay{job="finapp", instance="b:8081", verdict="REPLAYS"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_credit_policy_active{job="finapp", instance="a:8081", product="RETAIL_LOAN"}'
        values: '0x30'
      - series: 'finapp_credit_policy_active{job="finapp", instance="b:8081", product="RETAIL_LOAN"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_credit_scorecard_awaited{job="finapp", instance="a:8081"}'
        values: '0x30'
      - series: 'finapp_credit_scorecard_awaited{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 14m
        alertname: CreditGaugesUnreadable
        exp_alerts: []
      - eval_time: 20m
        alertname: CreditGaugesUnreadable
        exp_alerts:
          - exp_labels:
              owner: "credit"
              severity: "ticket"
            exp_annotations:
              description: "A credit gauge reads NaN - its database read failed. The replay proof, the open requests, the review queue or the active policies are not being watched until it reads again. See OPERATIONS_RUNBOOK.md section 6.3."
              summary: "A credit gauge cannot be read"
