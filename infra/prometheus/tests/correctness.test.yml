# promtool unit tests for infra/prometheus/rules/correctness.yml (P15-TSK-025): each correctness signal pages on its first breaching sample, never budgeted.
# Generated once and reviewed as written; CI runs every file here through promtool (infra/scripts/alert-rules-check.sh, P15-TSK-025).
# Two instances wherever instances can differ: the multi-instance case is the rule's aggregation.

rule_files:
  - ../rules/correctness.yml

evaluation_interval: 15s

tests:
  # LedgerTrialBalanceNonZero: instance b NaN, instance a breaching from its 4th sample: it fires at that first sample, and the NaN neither hides nor delays it.
  - interval: 15s
    input_series:
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="a:8081", currency="USD"}'
        values: '0 0 0 1 1 1 1 1 1'
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="b:8081", currency="USD"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 30s
        alertname: LedgerTrialBalanceNonZero
        exp_alerts: []
      - eval_time: 45s
        alertname: LedgerTrialBalanceNonZero
        exp_alerts:
          - exp_labels:
              currency: USD
              owner: ledger
              severity: page
            exp_annotations:
              summary: "The trial balance for USD is not zero"
              description: "Total debits differ from total credits in USD (INV-ACC-01). Never correct it from here. See OPERATIONS_RUNBOOK.md section 11.20."

  # LedgerTrialBalanceNonZero: instance a healthy, instance b breaching: max() still fires.
  - interval: 15s
    input_series:
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="a:8081", currency="USD"}'
        values: '0x8'
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="b:8081", currency="USD"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 15s
        alertname: LedgerTrialBalanceNonZero
        exp_alerts:
          - exp_labels:
              currency: USD
              owner: ledger
              severity: page
            exp_annotations:
              summary: "The trial balance for USD is not zero"
              description: "Total debits differ from total credits in USD (INV-ACC-01). Never correct it from here. See OPERATIONS_RUNBOOK.md section 11.20."

  # LedgerTrialBalanceNonZero: one instance NaN, the other healthy: a NaN is no breach.
  - interval: 15s
    input_series:
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="a:8081", currency="USD"}'
        values: '0x8'
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="b:8081", currency="USD"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 1m
        alertname: LedgerTrialBalanceNonZero
        exp_alerts: []

  # LedgerTrialBalanceNonZero: every instance NaN: no breach claimed.
  - interval: 15s
    input_series:
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="a:8081", currency="USD"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="b:8081", currency="USD"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 1m
        alertname: LedgerTrialBalanceNonZero
        exp_alerts: []

  # LedgerProjectionDrift: instance b NaN, instance a breaching from its 4th sample: it fires at that first sample, and the NaN neither hides nor delays it.
  - interval: 15s
    input_series:
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="a:8081"}'
        values: '0 0 0 2 2 2 2 2 2'
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 30s
        alertname: LedgerProjectionDrift
        exp_alerts: []
      - eval_time: 45s
        alertname: LedgerProjectionDrift
        exp_alerts:
          - exp_labels:
              owner: ledger
              severity: page
            exp_annotations:
              summary: "A balance projection disagrees with the journal"
              description: "2 accounts have a projection that differs from the journal (INV-BAL-02). The journal is the truth. See OPERATIONS_RUNBOOK.md section 11.20."

  # LedgerProjectionDrift: instance a healthy, instance b breaching: max() still fires.
  - interval: 15s
    input_series:
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="a:8081"}'
        values: '0x8'
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="b:8081"}'
        values: '2x8'
    alert_rule_test:
      - eval_time: 15s
        alertname: LedgerProjectionDrift
        exp_alerts:
          - exp_labels:
              owner: ledger
              severity: page
            exp_annotations:
              summary: "A balance projection disagrees with the journal"
              description: "2 accounts have a projection that differs from the journal (INV-BAL-02). The journal is the truth. See OPERATIONS_RUNBOOK.md section 11.20."

  # LedgerProjectionDrift: one instance NaN, the other healthy: a NaN is no breach.
  - interval: 15s
    input_series:
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="a:8081"}'
        values: '0x8'
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 1m
        alertname: LedgerProjectionDrift
        exp_alerts: []

  # LedgerProjectionDrift: every instance NaN: no breach claimed.
  - interval: 15s
    input_series:
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="a:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 1m
        alertname: LedgerProjectionDrift
        exp_alerts: []

  # OutboxDeadLetter: instance b NaN, instance a breaching from its 4th sample: it fires at that first sample, and the NaN neither hides nor delays it.
  - interval: 15s
    input_series:
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="a:8081"}'
        values: '0 0 0 1 1 1 1 1 1'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 30s
        alertname: OutboxDeadLetter
        exp_alerts: []
      - eval_time: 45s
        alertname: OutboxDeadLetter
        exp_alerts:
          - exp_labels:
              owner: platform
              severity: page
            exp_annotations:
              summary: "An outbox event is dead-lettered"
              description: "1 outbox events were abandoned and still block their aggregates. See OPERATIONS_RUNBOOK.md section 11.20."

  # OutboxDeadLetter: instance a healthy, instance b breaching: max() still fires.
  - interval: 15s
    input_series:
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="a:8081"}'
        values: '0x8'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="b:8081"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 15s
        alertname: OutboxDeadLetter
        exp_alerts:
          - exp_labels:
              owner: platform
              severity: page
            exp_annotations:
              summary: "An outbox event is dead-lettered"
              description: "1 outbox events were abandoned and still block their aggregates. See OPERATIONS_RUNBOOK.md section 11.20."

  # OutboxDeadLetter: one instance NaN, the other healthy: a NaN is no breach.
  - interval: 15s
    input_series:
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="a:8081"}'
        values: '0x8'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 1m
        alertname: OutboxDeadLetter
        exp_alerts: []

  # OutboxDeadLetter: every instance NaN: no breach claimed.
  - interval: 15s
    input_series:
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="a:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 1m
        alertname: OutboxDeadLetter
        exp_alerts: []

  # InboxDeadLetterParked: instance b NaN, instance a breaching from its 4th sample: it fires at that first sample, and the NaN neither hides nor delays it.
  - interval: 15s
    input_series:
      - series: 'finapp_deadletter_parked{job="finapp", instance="a:8081"}'
        values: '0 0 0 3 3 3 3 3 3'
      - series: 'finapp_deadletter_parked{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 30s
        alertname: InboxDeadLetterParked
        exp_alerts: []
      - eval_time: 45s
        alertname: InboxDeadLetterParked
        exp_alerts:
          - exp_labels:
              owner: platform
              severity: page
            exp_annotations:
              summary: "An inbox record is parked"
              description: "3 inbox records are parked and were never applied. See OPERATIONS_RUNBOOK.md section 11.20."

  # InboxDeadLetterParked: instance a healthy, instance b breaching: max() still fires.
  - interval: 15s
    input_series:
      - series: 'finapp_deadletter_parked{job="finapp", instance="a:8081"}'
        values: '0x8'
      - series: 'finapp_deadletter_parked{job="finapp", instance="b:8081"}'
        values: '3x8'
    alert_rule_test:
      - eval_time: 15s
        alertname: InboxDeadLetterParked
        exp_alerts:
          - exp_labels:
              owner: platform
              severity: page
            exp_annotations:
              summary: "An inbox record is parked"
              description: "3 inbox records are parked and were never applied. See OPERATIONS_RUNBOOK.md section 11.20."

  # InboxDeadLetterParked: one instance NaN, the other healthy: a NaN is no breach.
  - interval: 15s
    input_series:
      - series: 'finapp_deadletter_parked{job="finapp", instance="a:8081"}'
        values: '0x8'
      - series: 'finapp_deadletter_parked{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 1m
        alertname: InboxDeadLetterParked
        exp_alerts: []

  # InboxDeadLetterParked: every instance NaN: no breach claimed.
  - interval: 15s
    input_series:
      - series: 'finapp_deadletter_parked{job="finapp", instance="a:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_deadletter_parked{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 1m
        alertname: InboxDeadLetterParked
        exp_alerts: []

  # GlNotEqualLedger: one failed judgement on instance b fires at the first sample after it.
  - interval: 15s
    input_series:
      - series: 'finapp_accounting_close_check_total{job="finapp", instance="a:8081", check="GL_EQUALS_LEDGER", outcome="failed"}'
        values: '0x8'
      - series: 'finapp_accounting_close_check_total{job="finapp", instance="b:8081", check="GL_EQUALS_LEDGER", outcome="failed"}'
        values: '0 0 0 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 30s
        alertname: GlNotEqualLedger
        exp_alerts: []
      - eval_time: 45s
        alertname: GlNotEqualLedger
        exp_alerts:
          - exp_labels:
              owner: accounting
              severity: page
            exp_annotations:
              summary: "GL = ledger failed"
              description: "The close check GL_EQUALS_LEDGER failed in the last hour (INV-ACC-06): a month cannot close on it. See OPERATIONS_RUNBOOK.md section 11.20."

  # GlNotEqualLedger: another check failing, and this check passing, do not fire.
  - interval: 15s
    input_series:
      - series: 'finapp_accounting_close_check_total{job="finapp", instance="a:8081", check="RULE_CONFORMANCE", outcome="failed"}'
        values: '0 0 1 1 1 1 1 1 1'
      - series: 'finapp_accounting_close_check_total{job="finapp", instance="b:8081", check="GL_EQUALS_LEDGER", outcome="passed"}'
        values: '0+1x8'
    alert_rule_test:
      - eval_time: 1m
        alertname: GlNotEqualLedger
        exp_alerts: []

  # CorrectnessGaugesUnreadable: every gauge NaN on instance b for its 15 minutes: one alert per gauge, on b alone.
  - interval: 1m
    input_series:
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="a:8081", currency="USD"}'
        values: '0x20'
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_deadletter_parked{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="b:8081", currency="USD"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_deadletter_parked{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 14m
        alertname: CorrectnessGaugesUnreadable
        exp_alerts: []
      - eval_time: 16m
        alertname: CorrectnessGaugesUnreadable
        exp_alerts:
          - exp_labels:
              gauge: finapp_deadletter_parked
              instance: b:8081
              job: finapp
              owner: platform
              severity: ticket
            exp_annotations:
              summary: "A correctness gauge cannot be read on b:8081"
              description: "finapp_deadletter_parked is NaN on b:8081 for 15 minutes: its read is failing or the instance's gauge refresher is behind. See OPERATIONS_RUNBOOK.md section 11.20."
          - exp_labels:
              gauge: finapp_ledger_projection_drift
              instance: b:8081
              job: finapp
              owner: platform
              severity: ticket
            exp_annotations:
              summary: "A correctness gauge cannot be read on b:8081"
              description: "finapp_ledger_projection_drift is NaN on b:8081 for 15 minutes: its read is failing or the instance's gauge refresher is behind. See OPERATIONS_RUNBOOK.md section 11.20."
          - exp_labels:
              gauge: finapp_ledger_trial_balance
              instance: b:8081
              job: finapp
              owner: platform
              severity: ticket
            exp_annotations:
              summary: "A correctness gauge cannot be read on b:8081"
              description: "finapp_ledger_trial_balance is NaN on b:8081 for 15 minutes: its read is failing or the instance's gauge refresher is behind. See OPERATIONS_RUNBOOK.md section 11.20."
          - exp_labels:
              gauge: finapp_outbox_deadlettered
              instance: b:8081
              job: finapp
              owner: platform
              severity: ticket
            exp_annotations:
              summary: "A correctness gauge cannot be read on b:8081"
              description: "finapp_outbox_deadlettered is NaN on b:8081 for 15 minutes: its read is failing or the instance's gauge refresher is behind. See OPERATIONS_RUNBOOK.md section 11.20."

  # CorrectnessGaugesUnreadable: numbers everywhere: silent.
  - interval: 1m
    input_series:
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="a:8081", currency="USD"}'
        values: '0x20'
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_deadletter_parked{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="b:8081", currency="USD"}'
        values: '0x20'
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="b:8081"}'
        values: '0x20'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="b:8081"}'
        values: '0x20'
      - series: 'finapp_deadletter_parked{job="finapp", instance="b:8081"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: CorrectnessGaugesUnreadable
        exp_alerts: []

  # CorrectnessUnverifiable: no instance holds a number for the trial balance: it fires, since every rule on it is silent for the wrong reason.
  - interval: 1m
    input_series:
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="a:8081", currency="USD"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="b:8081", currency="USD"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="b:8081"}'
        values: '0x20'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="b:8081"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: CorrectnessUnverifiable
        exp_alerts: []
      - eval_time: 16m
        alertname: CorrectnessUnverifiable
        exp_alerts:
          - exp_labels:
              owner: platform
              severity: ticket
            exp_annotations:
              summary: "No instance can verify the books"
              description: "No instance has published a number for a correctness gauge for 15 minutes, so the correctness pages are silent for the wrong reason. See OPERATIONS_RUNBOOK.md section 11.20."

  # CorrectnessUnverifiable: one instance NaN, one reading: the books are still verified.
  - interval: 1m
    input_series:
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="a:8081", currency="USD"}'
        values: '0x20'
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="b:8081", currency="USD"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="b:8081"}'
        values: '0x20'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="b:8081"}'
        values: '0x20'
      - series: 'finapp_accounting_source_census_breaks{job="finapp", instance="a:8081", kind="UNSOURCED"}'
        values: '0x20'
      - series: 'finapp_accounting_source_census_lag_seconds{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_accounting_source_census_findings{job="finapp", instance="a:8081"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: CorrectnessUnverifiable
        exp_alerts: []

  # CorrectnessUnverifiable: the series is gone altogether: absent() fires.
  - interval: 1m
    input_series:
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="b:8081"}'
        values: '0x20'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="b:8081"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 16m
        alertname: CorrectnessUnverifiable
        exp_alerts:
          - exp_labels:
              owner: platform
              severity: ticket
            exp_annotations:
              summary: "No instance can verify the books"
              description: "No instance has published a number for a correctness gauge for 15 minutes, so the correctness pages are silent for the wrong reason. See OPERATIONS_RUNBOOK.md section 11.20."

  # PaymentWebhookUnmappable: one unmappable delivery on instance b fires at the first sample after it, by the sum over the instances.
  - interval: 15s
    input_series:
      - series: 'finapp_payments_webhook_total{job="finapp", instance="a:8081", outcome="unmappable"}'
        values: '0x8'
      - series: 'finapp_payments_webhook_total{job="finapp", instance="b:8081", outcome="unmappable"}'
        values: '0 0 0 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 30s
        alertname: PaymentWebhookUnmappable
        exp_alerts: []
      - eval_time: 45s
        alertname: PaymentWebhookUnmappable
        exp_alerts:
          - exp_labels:
              owner: payments
              severity: page
            exp_annotations:
              summary: "A provider callback could not be believed"
              description: "A signed provider callback named no operation this platform minted, was denied or contradicted by the provider's own inquiry, or its answer could not be read. See OPERATIONS_RUNBOOK.md section 11.20."

  # PaymentWebhookUnmappable: processed, duplicate and forged deliveries are not it.
  - interval: 15s
    input_series:
      - series: 'finapp_payments_webhook_total{job="finapp", instance="a:8081", outcome="processed"}'
        values: '0+5x8'
      - series: 'finapp_payments_webhook_total{job="finapp", instance="a:8081", outcome="duplicate"}'
        values: '0+1x8'
      - series: 'finapp_payments_webhook_total{job="finapp", instance="b:8081", outcome="refused"}'
        values: '0+5x8'
      - series: 'finapp_payments_webhook_total{job="finapp", instance="b:8081", outcome="unmappable"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 1m
        alertname: PaymentWebhookUnmappable
        exp_alerts: []


  # JournalEntryUnsourced: an unsourced finding on instance a with instance b NaN: it pages on the first non-zero sample, by kind, and the NaN neither hides nor fakes it.
  - interval: 15s
    input_series:
      - series: 'finapp_accounting_source_census_breaks{job="finapp", instance="a:8081", kind="UNSOURCED"}'
        values: '0 0 2 2 2 2'
      - series: 'finapp_accounting_source_census_breaks{job="finapp", instance="b:8081", kind="UNSOURCED"}'
        values: 'NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 15s
        alertname: JournalEntryUnsourced
        exp_alerts: []
      - eval_time: 30s
        alertname: JournalEntryUnsourced
        exp_alerts:
          - exp_labels:
              kind: UNSOURCED
              owner: accounting
              severity: page
            exp_annotations:
              summary: "A journal entry is UNSOURCED"
              description: "2 journal entries found UNSOURCED by the source-join census. Never correct it from here. See OPERATIONS_RUNBOOK.md section 11.27."

  # JournalEntryUnsourced: healthy, and zero on every instance: silent.
  - interval: 15s
    input_series:
      - series: 'finapp_accounting_source_census_breaks{job="finapp", instance="a:8081", kind="UNSOURCED"}'
        values: '0x8'
      - series: 'finapp_accounting_source_census_breaks{job="finapp", instance="a:8081", kind="MISMATCHED"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: JournalEntryUnsourced
        exp_alerts: []

  # SourceCensusLagging: fifteen minutes behind for five: a ticket.
  - interval: 15s
    input_series:
      - series: 'finapp_accounting_source_census_lag_seconds{job="finapp", instance="a:8081"}'
        values: '901x40'
    alert_rule_test:
      - eval_time: 2m
        alertname: SourceCensusLagging
        exp_alerts: []
      - eval_time: 6m
        alertname: SourceCensusLagging
        exp_alerts:
          - exp_labels:
              owner: accounting
              severity: ticket
            exp_annotations:
              summary: "The source-join census is behind"
              description: "The census's walk is 901 seconds behind the journal: a long-open transaction is holding its fence, or a batch keeps failing. See OPERATIONS_RUNBOOK.md section 11.27."

  # GaugesStaleAcrossTheFleet: one stale instance of two is not this rule: no page.
  - interval: 15s
    input_series:
      - series: 'finapp_gauges_refreshed{job="finapp", instance="a:8081"}'
        values: '1x40'
      - series: 'finapp_gauges_refreshed{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'up{job="finapp", instance="a:8081"}'
        values: '1x40'
      - series: 'up{job="finapp", instance="b:8081"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: GaugesStaleAcrossTheFleet
        exp_alerts: []

  # GaugesStaleAcrossTheFleet: both stale for five minutes: it pages; before five minutes it does not.
  - interval: 15s
    input_series:
      - series: 'finapp_gauges_refreshed{job="finapp", instance="a:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_gauges_refreshed{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'up{job="finapp", instance="a:8081"}'
        values: '1x40'
      - series: 'up{job="finapp", instance="b:8081"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 4m
        alertname: GaugesStaleAcrossTheFleet
        exp_alerts: []
      - eval_time: 6m
        alertname: GaugesStaleAcrossTheFleet
        exp_alerts:
          - exp_labels:
              owner: platform
              severity: page
            exp_annotations:
              summary: "Every finapp instance's gauges are stale"
              description: "2 instances are up and every one's gauge canary is stale: every correctness page on a gauge is blind. See OPERATIONS_RUNBOOK.md section 11.27."

  # The source-join census's gauges: NaN on one instance tickets that instance; the books are verified by the other.
  - interval: 1m
    input_series:
      - series: 'finapp_accounting_source_census_breaks{job="finapp", instance="a:8081", kind="UNSOURCED"}'
        values: '0x20'
      - series: 'finapp_accounting_source_census_lag_seconds{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_accounting_source_census_breaks{job="finapp", instance="b:8081", kind="UNSOURCED"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_accounting_source_census_lag_seconds{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 14m
        alertname: CorrectnessGaugesUnreadable
        exp_alerts: []
      - eval_time: 16m
        alertname: CorrectnessGaugesUnreadable
        exp_alerts:
          - exp_labels:
              gauge: finapp_accounting_source_census_breaks
              instance: b:8081
              job: finapp
              owner: platform
              severity: ticket
            exp_annotations:
              summary: "A correctness gauge cannot be read on b:8081"
              description: "finapp_accounting_source_census_breaks is NaN on b:8081 for 15 minutes: its read is failing or the instance's gauge refresher is behind. See OPERATIONS_RUNBOOK.md section 11.20."
          - exp_labels:
              gauge: finapp_accounting_source_census_lag_seconds
              instance: b:8081
              job: finapp
              owner: platform
              severity: ticket
            exp_annotations:
              summary: "A correctness gauge cannot be read on b:8081"
              description: "finapp_accounting_source_census_lag_seconds is NaN on b:8081 for 15 minutes: its read is failing or the instance's gauge refresher is behind. See OPERATIONS_RUNBOOK.md section 11.20."

  # CorrectnessUnverifiable: every instance's census gauge NaN (the census cannot be read, or has not run): it fires.
  - interval: 1m
    input_series:
      - series: 'finapp_accounting_source_census_breaks{job="finapp", instance="a:8081", kind="UNSOURCED"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_accounting_source_census_lag_seconds{job="finapp", instance="a:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_ledger_trial_balance{job="finapp", instance="a:8081", currency="USD"}'
        values: '0x20'
      - series: 'finapp_ledger_projection_drift{job="finapp", instance="a:8081"}'
        values: '0x20'
      - series: 'finapp_outbox_deadlettered{job="finapp", instance="a:8081"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 14m
        alertname: CorrectnessUnverifiable
        exp_alerts: []
      - eval_time: 16m
        alertname: CorrectnessUnverifiable
        exp_alerts:
          - exp_labels:
              owner: platform
              severity: ticket
            exp_annotations:
              summary: "No instance can verify the books"
              description: "No instance has published a number for a correctness gauge for 15 minutes, so the correctness pages are silent for the wrong reason. See OPERATIONS_RUNBOOK.md section 11.20."

  # SourceCensusStalled: an hour behind and past it: pages after its 5 minutes, and a shorter stall does not.
  - interval: 15s
    input_series:
      - series: 'finapp_accounting_source_census_lag_seconds{job="finapp", instance="a:8081"}'
        values: '3601x40'
    alert_rule_test:
      - eval_time: 2m
        alertname: SourceCensusStalled
        exp_alerts: []
      - eval_time: 6m
        alertname: SourceCensusStalled
        exp_alerts:
          - exp_labels:
              owner: accounting
              severity: page
            exp_annotations:
              summary: "The source-join census has stopped reading the journal"
              description: "The census has been 3601 seconds behind the journal, past its hour's bound: entries are waiting and none are being judged. See OPERATIONS_RUNBOOK.md section 11.27."

  # SourceCensusStalled: past the ticket's fifteen minutes and under the hour: no page.
  - interval: 15s
    input_series:
      - series: 'finapp_accounting_source_census_lag_seconds{job="finapp", instance="a:8081"}'
        values: '1800x40'
    alert_rule_test:
      - eval_time: 8m
        alertname: SourceCensusStalled
        exp_alerts: []

  # SourceCensusFindingsRecent: a finding within the ticket's window tickets; none is silent; the page's window is another rule's.
  - interval: 15s
    input_series:
      - series: 'finapp_accounting_source_census_findings{job="finapp", instance="a:8081"}'
        values: '0 0 2 2 2 2'
    alert_rule_test:
      - eval_time: 15s
        alertname: SourceCensusFindingsRecent
        exp_alerts: []
      - eval_time: 30s
        alertname: SourceCensusFindingsRecent
        exp_alerts:
          - exp_labels:
              owner: accounting
              severity: ticket
            exp_annotations:
              summary: "The source-join census has recent findings"
              description: "2 journal entries were counted by the source-join census within its ticket window. See OPERATIONS_RUNBOOK.md section 11.27."

  # SourceCensusLagging on a census that keeps up: a minute behind on both instances, silent well past its five minutes
  # (2026-11-12; its only silent case had been the not-yet one at two minutes on a lagging census).
  - interval: 15s
    input_series:
      - series: 'finapp_accounting_source_census_lag_seconds{job="finapp", instance="a:8081"}'
        values: '60x60'
      - series: 'finapp_accounting_source_census_lag_seconds{job="finapp", instance="b:8081"}'
        values: '60x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: SourceCensusLagging
        exp_alerts: []
