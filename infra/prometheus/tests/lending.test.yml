# promtool unit tests for every alert in infra/prometheus/rules/lending.yml (2026-11-12): a firing case and a silent one on
# its own series for each. LendingAlertRulesTest holds the same rules against a real instance's scrape with this
# repository's own evaluator; these are Prometheus's own reading of them.
# CI runs every file here through promtool (infra/scripts/alert-rules-check.sh, P15-TSK-025).
# Two instances: a reading breaks on b while a stays healthy, so each rule's aggregation across the fleet is what fires.
# Every firing case's expectation was generated by the pinned promtool from the rule and reviewed as written.

rule_files:
  - ../rules/lending.yml

evaluation_interval: 1m

tests:
  # Every reading healthy on both instances for three hours - disbursements and payouts inside their deadlines, accrual
  # current, applications young, every failure counter still, every proof at zero, headroom above its floor, terms active,
  # every sweep on: nothing fires, each rule past its own wait.
  - interval: 1m
    input_series:
      - series: 'finapp_lending_disbursement_pending_age_seconds{job="finapp", instance="a:8081"}'
        values: '600x180'
      - series: 'finapp_lending_disbursement_pending_age_seconds{job="finapp", instance="b:8081"}'
        values: '600x180'
      - series: 'finapp_lending_payout_dispatched_age_seconds{job="finapp", instance="a:8081"}'
        values: '300x180'
      - series: 'finapp_lending_payout_dispatched_age_seconds{job="finapp", instance="b:8081"}'
        values: '300x180'
      - series: 'finapp_lending_accrual_lag_seconds{job="finapp", instance="a:8081"}'
        values: '3600x180'
      - series: 'finapp_lending_accrual_lag_seconds{job="finapp", instance="b:8081"}'
        values: '3600x180'
      - series: 'finapp_lending_application_awaiting_age_seconds{job="finapp", instance="a:8081"}'
        values: '3600x180'
      - series: 'finapp_lending_application_awaiting_age_seconds{job="finapp", instance="b:8081"}'
        values: '3600x180'
      - series: 'finapp_lending_origination_total{job="finapp", instance="a:8081", outcome="failed"}'
        values: '1x180'
      - series: 'finapp_lending_origination_total{job="finapp", instance="b:8081", outcome="failed"}'
        values: '1x180'
      - series: 'finapp_lending_allocation_anomaly_total{job="finapp", instance="a:8081"}'
        values: '0x180'
      - series: 'finapp_lending_allocation_anomaly_total{job="finapp", instance="b:8081"}'
        values: '0x180'
      - series: 'finapp_lending_subledger_proof{job="finapp", instance="a:8081", verdict="FAILS"}'
        values: '0x180'
      - series: 'finapp_lending_subledger_proof{job="finapp", instance="b:8081", verdict="FAILS"}'
        values: '0x180'
      - series: 'finapp_lending_replay{job="finapp", instance="a:8081", verdict="DIVERGED"}'
        values: '0x180'
      - series: 'finapp_lending_replay{job="finapp", instance="b:8081", verdict="DIVERGED"}'
        values: '0x180'
      - series: 'finapp_lending_capital_proof{job="finapp", instance="a:8081", verdict="FAILS"}'
        values: '0x180'
      - series: 'finapp_lending_capital_proof{job="finapp", instance="b:8081", verdict="FAILS"}'
        values: '0x180'
      - series: 'finapp_lending_capital_headroom_low{job="finapp", instance="a:8081", currency="EUR"}'
        values: '0x180'
      - series: 'finapp_lending_capital_headroom_low{job="finapp", instance="b:8081", currency="EUR"}'
        values: '0x180'
      - series: 'finapp_credit_exposure_census{job="finapp", instance="a:8081", verdict="FAILS"}'
        values: '0x180'
      - series: 'finapp_credit_exposure_census{job="finapp", instance="b:8081", verdict="FAILS"}'
        values: '0x180'
      - series: 'finapp_lending_terms_active{job="finapp", instance="a:8081", product="TERM_LOAN", lending_offered="true"}'
        values: '1x180'
      - series: 'finapp_lending_terms_active{job="finapp", instance="b:8081", product="TERM_LOAN", lending_offered="true"}'
        values: '1x180'
      - series: 'finapp_lending_origination_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_lending_origination_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '1x180'
      - series: 'finapp_lending_disbursement_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_lending_disbursement_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '1x180'
      - series: 'finapp_lending_payout_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_lending_payout_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '1x180'
      - series: 'finapp_lending_servicing_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_lending_servicing_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: LendingDisbursementPastDeadline
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingPayoutUnconcluded
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingAccrualLagging
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingApplicationAwaitingTooLong
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingOriginationStepFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingAllocationAnomaly
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingSubledgerProofFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingReplayDiverged
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingCapitalProofFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingCapitalHeadroomLow
        exp_alerts: []
      - eval_time: 2h
        alertname: CreditExposureCensusFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingTermsNoneActive
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingOriginationSweeperOff
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingDisbursementSweeperOff
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingPayoutSweeperOff
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingServicingSweeperOff
        exp_alerts: []
      - eval_time: 2h
        alertname: LendingGaugesUnreadable
        exp_alerts: []

  # Each reading broken on b alone: every threshold rule fires.
  - interval: 1m
    input_series:
      - series: 'finapp_lending_disbursement_pending_age_seconds{job="finapp", instance="a:8081"}'
        values: '600x180'
      - series: 'finapp_lending_disbursement_pending_age_seconds{job="finapp", instance="b:8081"}'
        values: '90000x180'
      - series: 'finapp_lending_payout_dispatched_age_seconds{job="finapp", instance="a:8081"}'
        values: '300x180'
      - series: 'finapp_lending_payout_dispatched_age_seconds{job="finapp", instance="b:8081"}'
        values: '2400x180'
      - series: 'finapp_lending_accrual_lag_seconds{job="finapp", instance="a:8081"}'
        values: '3600x180'
      - series: 'finapp_lending_accrual_lag_seconds{job="finapp", instance="b:8081"}'
        values: '90000x180'
      - series: 'finapp_lending_application_awaiting_age_seconds{job="finapp", instance="a:8081"}'
        values: '3600x180'
      - series: 'finapp_lending_application_awaiting_age_seconds{job="finapp", instance="b:8081"}'
        values: '610000x180'
      - series: 'finapp_lending_origination_total{job="finapp", instance="a:8081", outcome="failed"}'
        values: '1x180'
      - series: 'finapp_lending_origination_total{job="finapp", instance="b:8081", outcome="failed"}'
        values: '0+1x180'
      - series: 'finapp_lending_allocation_anomaly_total{job="finapp", instance="a:8081"}'
        values: '0x180'
      - series: 'finapp_lending_allocation_anomaly_total{job="finapp", instance="b:8081"}'
        values: '0+1x180'
      - series: 'finapp_lending_subledger_proof{job="finapp", instance="a:8081", verdict="FAILS"}'
        values: '0x180'
      - series: 'finapp_lending_subledger_proof{job="finapp", instance="b:8081", verdict="FAILS"}'
        values: '1x180'
      - series: 'finapp_lending_replay{job="finapp", instance="a:8081", verdict="DIVERGED"}'
        values: '0x180'
      - series: 'finapp_lending_replay{job="finapp", instance="b:8081", verdict="DIVERGED"}'
        values: '1x180'
      - series: 'finapp_lending_capital_proof{job="finapp", instance="a:8081", verdict="FAILS"}'
        values: '0x180'
      - series: 'finapp_lending_capital_proof{job="finapp", instance="b:8081", verdict="FAILS"}'
        values: '1x180'
      - series: 'finapp_lending_capital_headroom_low{job="finapp", instance="a:8081", currency="EUR"}'
        values: '0x180'
      - series: 'finapp_lending_capital_headroom_low{job="finapp", instance="b:8081", currency="EUR"}'
        values: '1x180'
      - series: 'finapp_credit_exposure_census{job="finapp", instance="a:8081", verdict="FAILS"}'
        values: '0x180'
      - series: 'finapp_credit_exposure_census{job="finapp", instance="b:8081", verdict="FAILS"}'
        values: '1x180'
      - series: 'finapp_lending_terms_active{job="finapp", instance="a:8081", product="TERM_LOAN", lending_offered="true"}'
        values: '1x180'
      - series: 'finapp_lending_terms_active{job="finapp", instance="b:8081", product="TERM_LOAN", lending_offered="true"}'
        values: '0x180'
      - series: 'finapp_lending_origination_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_lending_origination_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '0x180'
      - series: 'finapp_lending_disbursement_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_lending_disbursement_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '0x180'
      - series: 'finapp_lending_payout_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_lending_payout_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '0x180'
      - series: 'finapp_lending_servicing_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_lending_servicing_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 1h50m
        alertname: LendingDisbursementPastDeadline
        exp_alerts:
          - exp_labels:
              owner: "lending"
              severity: "page"
            exp_annotations:
              description: "The oldest PENDING disbursement has waited 1d 1h 0m 0s. Check finapp_lending_disbursement_sweeper_enabled on every instance and finapp_lending_disbursement_total by outcome (OPERATIONS_RUNBOOK.md section 7.6)."
              summary: "A loan disbursement has waited past every product's deadline"
      - eval_time: 1h50m
        alertname: LendingPayoutUnconcluded
        exp_alerts:
          - exp_labels:
              owner: "lending"
              severity: "page"
            exp_annotations:
              description: "The oldest unconcluded payout was born 40m 0s ago. Check the payout sweep and payments' withdrawal for it (finapp_payments_withdrawal_unknown_age); OPERATIONS_RUNBOOK.md section 7.6."
              summary: "A loan payout has not concluded within its objective"
      - eval_time: 1h50m
        alertname: LendingAccrualLagging
        exp_alerts:
          - exp_labels:
              owner: "lending"
              severity: "page"
            exp_annotations:
              description: "The oldest unaccrued elapsed date ended 1d 1h 0m 0s ago. Check finapp_lending_servicing_sweeper_enabled and finapp_lending_accrual_total by outcome; the sweep catches up born-once (OPERATIONS_RUNBOOK.md section 7.5)."
              summary: "Loan interest accrual is more than a day behind"
      - eval_time: 1h50m
        alertname: LendingApplicationAwaitingTooLong
        exp_alerts:
          - exp_labels:
              owner: "lending"
              severity: "ticket"
            exp_annotations:
              description: "The oldest application AWAITING_DECISION was submitted 7d 1h 26m 40s ago. Check finapp_lending_origination_sweeper_enabled on every instance and finapp_lending_origination_total{outcome=\"failed\"} (OPERATIONS_RUNBOOK.md section 7.12)."
              summary: "A loan application has waited past every credit request's validity"
      - eval_time: 1h50m
        alertname: LendingOriginationStepFailing
        exp_alerts:
          - exp_labels:
              owner: "lending"
              severity: "ticket"
            exp_annotations:
              description: "Origination steps or offer expiries failed in each of the last fifteen minutes; the permits lapse and later ticks retry. Read the instances' warn lines for the exception's class (OPERATIONS_RUNBOOK.md section 7.12)."
              summary: "Loan origination steps keep failing"
      - eval_time: 1h50m
        alertname: LendingAllocationAnomaly
        exp_alerts:
          - exp_labels:
              owner: "lending"
              severity: "page"
            exp_annotations:
              description: "At least one allocation was refused in fifteen minutes. The repayment posted nothing; read the loan's explanation and replay it (OPERATIONS_RUNBOOK.md section 7.8)."
              summary: "A loan repayment allocation did not conserve its amount"
      - eval_time: 1h50m
        alertname: LendingSubledgerProofFailing
        exp_alerts:
          - exp_labels:
              owner: "lending"
              severity: "page"
            exp_annotations:
              description: "1 loan accounts fail the subledger proof. The portfolio report lists them (GET /v1/operator/reports/lending/portfolio); explain each through GET /v1/operator/loans/{id}/explanation. Never adjust a balance (OPERATIONS_RUNBOOK.md section 7.7)."
              summary: "Loan accounts' ledger balances are not explained by their rows"
      - eval_time: 1h50m
        alertname: LendingReplayDiverged
        exp_alerts:
          - exp_labels:
              owner: "lending"
              severity: "page"
            exp_annotations:
              description: "1 loan accounts replay DIVERGED. The portfolio report lists them; replay each through POST /v1/operator/loans/{id}/replay to see which kinds differ. Never repair a row (OPERATIONS_RUNBOOK.md section 7.7)."
              summary: "Loan accounts do not replay from their pinned engines and terms"
      - eval_time: 1h50m
        alertname: LendingCapitalProofFailing
        exp_alerts:
          - exp_labels:
              owner: "lending"
              severity: "page"
            exp_annotations:
              description: "1 currencies fail the lending capital proof. Read GET /v1/operator/reports/lending/capital; capital is never adjusted to fit (OPERATIONS_RUNBOOK.md sections 7.2 and 7.7)."
              summary: "The lending capital proof fails"
      - eval_time: 1h50m
        alertname: LendingCapitalHeadroomLow
        exp_alerts:
          - exp_labels:
              owner: "lending"
              severity: "ticket"
            exp_annotations:
              description: "1 currencies stand below their headroom floor; acceptances and draws will refuse lending.CapitalUnavailable once it is spent. Contribute capital (OPERATIONS_RUNBOOK.md sections 7.1 and 7.9)."
              summary: "Lending capital headroom is below its floor"
      - eval_time: 1h50m
        alertname: CreditExposureCensusFailing
        exp_alerts:
          - exp_labels:
              owner: "lending"
              severity: "page"
            exp_annotations:
              description: "1 parties fail the exposure census. Never release or reduce exposure by hand (OPERATIONS_RUNBOOK.md section 7.7)."
              summary: "The credit exposure census fails"
      - eval_time: 1h50m
        alertname: LendingTermsNoneActive
        exp_alerts:
          - exp_labels:
              owner: "lending"
              product: "TERM_LOAN"
              severity: "ticket"
            exp_annotations:
              description: "No TERM_LOAN application is accepted until a terms version is activated by a person other than its proposer (OPERATIONS_RUNBOOK.md sections 7.3 and 7.4)."
              summary: "The loan product TERM_LOAN has no active terms"
      - eval_time: 1h50m
        alertname: LendingOriginationSweeperOff
        exp_alerts:
          - exp_labels:
              instance: "b:8081"
              job: "finapp"
              owner: "lending"
              severity: "ticket"
            exp_annotations:
              description: "finapp.lending.origination.sweeper.enabled is false on a scraped instance. Applications are offered by the others; set it back to true. See OPERATIONS_RUNBOOK.md section 7.10."
              summary: "An instance is not running the loan origination sweep"
      - eval_time: 1h50m
        alertname: LendingDisbursementSweeperOff
        exp_alerts:
          - exp_labels:
              instance: "b:8081"
              job: "finapp"
              owner: "lending"
              severity: "ticket"
            exp_annotations:
              description: "finapp.lending.disbursement.sweeper.enabled is false on a scraped instance. Loans are disbursed by the others; set it back to true. See OPERATIONS_RUNBOOK.md section 7.10."
              summary: "An instance is not running the loan disbursement sweep"
      - eval_time: 1h50m
        alertname: LendingPayoutSweeperOff
        exp_alerts:
          - exp_labels:
              instance: "b:8081"
              job: "finapp"
              owner: "lending"
              severity: "ticket"
            exp_annotations:
              description: "finapp.lending.payout.sweeper.enabled is false on a scraped instance. Payouts are carried by the others; set it back to true. See OPERATIONS_RUNBOOK.md section 7.10."
              summary: "An instance is not running the loan payout sweep"
      - eval_time: 1h50m
        alertname: LendingServicingSweeperOff
        exp_alerts:
          - exp_labels:
              instance: "b:8081"
              job: "finapp"
              owner: "lending"
              severity: "ticket"
            exp_annotations:
              description: "finapp.lending.servicing.sweeper.enabled is false on a scraped instance. Accounts are serviced by the others; set it back to true. See OPERATIONS_RUNBOOK.md section 7.10."
              summary: "An instance is not running the loan servicing sweep"

  # Every lending gauge NaN on b, numbers on a: the unreadable rule fires once its quarter hour has passed.
  - interval: 1m
    input_series:
      - series: 'finapp_lending_disbursement_pending_age_seconds{job="finapp", instance="a:8081"}'
        values: '0x30'
      - series: 'finapp_lending_disbursement_pending_age_seconds{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_lending_payout_dispatched_age_seconds{job="finapp", instance="a:8081"}'
        values: '0x30'
      - series: 'finapp_lending_payout_dispatched_age_seconds{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_lending_accrual_lag_seconds{job="finapp", instance="a:8081"}'
        values: '0x30'
      - series: 'finapp_lending_accrual_lag_seconds{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_lending_application_awaiting_age_seconds{job="finapp", instance="a:8081"}'
        values: '0x30'
      - series: 'finapp_lending_application_awaiting_age_seconds{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_lending_subledger_proof{job="finapp", instance="a:8081", verdict="FAILS"}'
        values: '0x30'
      - series: 'finapp_lending_subledger_proof{job="finapp", instance="b:8081", verdict="FAILS"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_lending_replay{job="finapp", instance="a:8081", verdict="DIVERGED"}'
        values: '0x30'
      - series: 'finapp_lending_replay{job="finapp", instance="b:8081", verdict="DIVERGED"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_lending_capital_proof{job="finapp", instance="a:8081", verdict="FAILS"}'
        values: '0x30'
      - series: 'finapp_lending_capital_proof{job="finapp", instance="b:8081", verdict="FAILS"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_lending_capital_headroom_low{job="finapp", instance="a:8081", currency="EUR"}'
        values: '0x30'
      - series: 'finapp_lending_capital_headroom_low{job="finapp", instance="b:8081", currency="EUR"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_credit_exposure_census{job="finapp", instance="a:8081", verdict="FAILS"}'
        values: '0x30'
      - series: 'finapp_credit_exposure_census{job="finapp", instance="b:8081", verdict="FAILS"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_lending_terms_active{job="finapp", instance="a:8081", product="TERM_LOAN", lending_offered="true"}'
        values: '0x30'
      - series: 'finapp_lending_terms_active{job="finapp", instance="b:8081", product="TERM_LOAN", lending_offered="true"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
    alert_rule_test:
      - eval_time: 14m
        alertname: LendingGaugesUnreadable
        exp_alerts: []
      - eval_time: 20m
        alertname: LendingGaugesUnreadable
        exp_alerts:
          - exp_labels:
              owner: "lending"
              severity: "ticket"
            exp_annotations:
              description: "A lending gauge reads NaN - its database read failed. The proofs, the census, the application, disbursement and payout queues, the accrual lag or the active terms are not being watched until it reads again (OPERATIONS_RUNBOOK.md section 7.10)."
              summary: "A lending gauge cannot be read"
