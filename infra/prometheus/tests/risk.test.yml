        values: '0+10x180'
      - series: 'finapp_risk_evaluation_latency_seconds_bucket{job="finapp", instance="a:8081", operation="TRANSFER", le="0.05"}'
        values: '0+10x180'
      - series: 'finapp_risk_evaluation_latency_seconds_bucket{job="finapp", instance="b:8081", operation="TRANSFER", le="0.05"}'
        values: '0+10x180'
