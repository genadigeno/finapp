# promtool unit tests for every alert in infra/prometheus/rules/risk.yml (2026-11-12): a firing case and a silent one on
# its own series for each. RiskAlertRulesTest holds the same rules against a real instance's scrape with this
# repository's own evaluator; these are Prometheus's own reading of them.
# CI runs every file here through promtool (infra/scripts/alert-rules-check.sh, P15-TSK-025).
# Two instances: a reading breaks on b while a stays healthy, so each rule's aggregation across the fleet is what fires.
# Every firing case's expectation was generated by the pinned promtool from the rule and reviewed as written.

rule_files:
  - ../rules/risk.yml

evaluation_interval: 1m

tests:
  # Every reading healthy on both instances for three hours - evaluations available and inside the budget, a judging policy
  # active, alerts raised and well under the flood line, every case young and every desk under capacity, actions done,
  # filings concluded, monitoring current, every proof agreeing, proof readings completing, every failure counter still:
  # nothing fires, each rule past its own wait.
  - interval: 1m
    input_series:
      - series: 'finapp_risk_evaluation_unavailable_total{job="finapp", instance="a:8081", operation="TRANSFER", reason_code="RISK_UNAVAILABLE"}'
        values: '1x180'
