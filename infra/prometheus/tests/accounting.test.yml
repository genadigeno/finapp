# promtool unit tests for every alert in infra/prometheus/rules/accounting.yml (2026-11-12): a firing case and a silent one
# on its own series for each. AccountingAlertRulesTest holds the same rules against a real instance's scrape with this
# repository's own evaluator; these are Prometheus's own reading of them.
# CI runs every file here through promtool (infra/scripts/alert-rules-check.sh, P15-TSK-025).
# Two instances: a reading breaks on b while a stays healthy, so each rule's aggregation across the fleet is what fires.
# Every firing case's expectation was generated by the pinned promtool from the rule and reviewed as written.

rule_files:
  - ../rules/accounting.yml

evaluation_interval: 1m

tests:
  # Every reading healthy on both instances for three hours - no close run or check stalled, the month young, the schedule
  # on, every failure, refusal and divergence counter still, every attention gauge at rest, write-offs approved two hours
  # ago and none since: nothing fires, each rule past its own wait.
