      - eval_time: 1h50m
        alertname: AccountingScheduleOff
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "finapp.accounting.sweeper.enabled is 0 on every instance. See OPERATIONS_RUNBOOK.md section 10.7."
              summary: "No instance runs the accounting close schedule"
      - eval_time: 1h50m
        alertname: AccountingCloseCheckFailed
        exp_alerts:
          - exp_labels:
              check: "TRIAL_BALANCE"
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "A month's check failed, and no door discloses a must-pass one. See OPERATIONS_RUNBOOK.md section 10.9, then section 10.3 for the check by name."
              summary: "The close check TRIAL_BALANCE failed"
      - eval_time: 1h50m
        alertname: AccountingCloseLegFailing
        exp_alerts:
          - exp_labels:
              leg: "open"
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "The leg counted failures and is logged by class. See OPERATIONS_RUNBOOK.md section 10.9; for the inquiry leg, section 10.6."
              summary: "The accounting close schedule's open leg keeps failing"
      - eval_time: 1h50m
        alertname: AccountingPostingIntoClosedPeriod
        exp_alerts:
          - exp_labels:
              command: "posting"
              owner: "accounting"
              severity: "page"
            exp_annotations:
              description: "An entry dated into a locked or closed period was refused and nothing was written. See OPERATIONS_RUNBOOK.md section 10.8."
              summary: "A posting was refused at the accounting cutoff"
      - eval_time: 1h50m
        alertname: AccountingAdjustmentIntoClosedPeriod
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "The month it is dated in is locked or closed, and the proposal stands. See OPERATIONS_RUNBOOK.md section 10.4."
              summary: "An adjustment's approval was refused at the accounting cutoff"
      - eval_time: 1h50m
        alertname: AccountingAdjustmentStanding
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "Nothing moves a proposal but a person, whether or not it can still post. See OPERATIONS_RUNBOOK.md section 10.4."
              summary: "A prior-period adjustment has stood proposed past its week"
      - eval_time: 1h50m
        alertname: AccountingMappingGap
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "They stand in the GL's unmapped bucket, and a month holding them cannot pass GL_EQUALS_LEDGER. See OPERATIONS_RUNBOOK.md section 10.12."
              summary: "Journal lines in the open period have no GL mapping"
      - eval_time: 1h50m
        alertname: AccountingBreakAged
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
              type: "GL_NOT_EQUAL_LEDGER"
            exp_annotations:
              description: "Nobody has decided on it, and it blocks its month if that month is not yet closed. See OPERATIONS_RUNBOOK.md section 10.13."
              summary: "An accounting break of type GL_NOT_EQUAL_LEDGER has stood open past its week"
      - eval_time: 1h50m
        alertname: AccountingReportDiverged
        exp_alerts:
          - exp_labels:
              definition: "BALANCE_SHEET"
              owner: "accounting"
              severity: "page"
            exp_annotations:
              description: "A FINAL report that does not reproduce is an incident, never a repair. See OPERATIONS_RUNBOOK.md section 10.10, and section 10.5 for a statement."
              summary: "A FINAL BALANCE_SHEET run did not reproduce"
      - eval_time: 1h50m
        alertname: AccountingClosedMonthStatementRefused
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "page"
            exp_annotations:
              description: "The reason stays on the audit record: read refusal= on accounting.ReportGenerated for the run, which never reaches this alert (the owner's (aa)). See OPERATIONS_RUNBOOK.md section 10.5."
              summary: "A statement of a closed month was refused"
      - eval_time: 1h50m
        alertname: AccountingReportRunFailed
        exp_alerts:
          - exp_labels:
              definition: "BALANCE_SHEET"
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "Read the run and accounting.ReportGenerated in the audit record, whose refusal= says why when a definition refused. See OPERATIONS_RUNBOOK.md section 10.5."
              summary: "A BALANCE_SHEET report run failed"
      - eval_time: 1h50m
        alertname: AccountingClosedMonthLostItsRun
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "A batch was repudiated after the close, and the month says nothing of it until asked. See OPERATIONS_RUNBOOK.md section 10.11."
              summary: "The latest closed month has a source with no run that counts"
      - eval_time: 1h50m
        alertname: RegulatorySubmissionRejected
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "page"
            exp_annotations:
              description: "Its code and bytes are on the read. See OPERATIONS_RUNBOOK.md section 10.6."
              summary: "A provider rejected a regulatory return"
      - eval_time: 1h50m
        alertname: RegulatoryContraryAnswer
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "page"
            exp_annotations:
              description: "Do not resend and do not write to the row. See OPERATIONS_RUNBOOK.md section 10.6."
              summary: "A provider's answer contradicts a concluded regulatory return"
      - eval_time: 1h50m
        alertname: RegulatoryRunBytesDiffer
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "page"
            exp_annotations:
              description: "Report runs are frozen, so someone wrote to one: an integrity incident. See OPERATIONS_RUNBOOK.md section 10.6."
              summary: "A FINAL run's bytes no longer prove against its stored hash"
      - eval_time: 1h50m
        alertname: RegulatorySendWithheld
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "page"
            exp_annotations:
              description: "The platform does not send figures the books no longer say. See OPERATIONS_RUNBOOK.md section 10.6."
              summary: "A regulatory return's first send was withheld: its month moved"
      - eval_time: 1h50m
        alertname: RegulatoryResendWithheld
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "page"
            exp_annotations:
              description: "The platform does not send figures the books no longer say. See OPERATIONS_RUNBOOK.md section 10.6."
              summary: "A regulatory return was not resent: its month moved"
      - eval_time: 1h50m
        alertname: RegulatoryAnswerAnomaly
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "Read the answer's bytes and escalate; nothing here clears it. See OPERATIONS_RUNBOOK.md section 10.6."
              summary: "A provider's answer on a regulatory return was screened as an anomaly"
      - eval_time: 1h50m
        alertname: RegulatoryReturnOverdue
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "SUBMITTED, past finapp.accounting.regulatory.answer-horizon, one day by default. See OPERATIONS_RUNBOOK.md section 10.6."
              summary: "A regulatory return went past its answer horizon"
      - eval_time: 1h50m
        alertname: RegulatoryReturnOvertaken
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "The regulator holds, or may hold, a figure the books no longer say. See OPERATIONS_RUNBOOK.md section 10.6."
              summary: "A regulatory return was overtaken by a reopen"
      - eval_time: 1h50m
        alertname: RegulatoryResendsExhausted
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "A person's door is open. See OPERATIONS_RUNBOOK.md section 10.6."
              summary: "A regulatory return spent its resends with the provider still answering not received"
      - eval_time: 1h50m
        alertname: RegulatoryStaleUnsent
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "No act going forward will pass. See OPERATIONS_RUNBOOK.md section 10.6."
              summary: "A regulatory return not yet sent has been overtaken by its month"
      - eval_time: 1h50m
        alertname: WriteOffApproved
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              product: "TERM_LOAN"
              severity: "ticket"
            exp_annotations:
              description: "Its entry stands, and nothing leaves WRITTEN_OFF. See OPERATIONS_RUNBOOK.md section 7.13."
              summary: "A TERM_LOAN write-off was approved"
      - eval_time: 1h50m
        alertname: WriteOffSelfDealingRefused
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              product: "TERM_LOAN"
              severity: "ticket"
            exp_annotations:
              description: "For the security desk: the audit record names who. See OPERATIONS_RUNBOOK.md section 7.13."
              summary: "A TERM_LOAN write-off was refused as self-dealing"

  # Every accounting gauge NaN on b, numbers on a: each unreadable rule fires once its quarter hour has passed.
  - interval: 1m
    input_series:
      - series: 'finapp_accounting_close_run_stalled{job="finapp", instance="a:8081"}'
        values: '0x30'
      - series: 'finapp_accounting_close_run_stalled{job="finapp", instance="b:8081"}'
        values: 'NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN NaN'
      - series: 'finapp_accounting_close_check_stalled{job="finapp", instance="a:8081"}'
        values: '0x30'
      - series: 'finapp_accounting_close_check_stalled{job="finapp", instance="b:8081"}'
