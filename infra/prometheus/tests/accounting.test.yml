    alert_rule_test:
      - eval_time: 14m
        alertname: AccountingCloseRunStallUnreadable
        exp_alerts: []
      - eval_time: 14m
        alertname: AccountingCloseCheckStallUnreadable
        exp_alerts: []
      - eval_time: 14m
        alertname: RegulatoryAttentionUnreadable
        exp_alerts: []
      - eval_time: 14m
        alertname: AccountingGaugesUnreadable
        exp_alerts: []
      - eval_time: 20m
        alertname: AccountingCloseRunStallUnreadable
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "finapp.accounting.close.run.stalled has no value. See OPERATIONS_RUNBOOK.md section 10.1."
              summary: "Whether a close run has stalled cannot be read"
      - eval_time: 20m
        alertname: AccountingCloseCheckStallUnreadable
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "finapp.accounting.close.check.stalled has no value. See OPERATIONS_RUNBOOK.md section 10.9."
              summary: "Whether a close check has stalled cannot be read"
      - eval_time: 20m
        alertname: RegulatoryAttentionUnreadable
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "finapp.accounting.regulatory.attention has no value. See OPERATIONS_RUNBOOK.md section 10.6, and section 10.14 for the read."
              summary: "What stands on the regulatory returns cannot be read"
      - eval_time: 20m
        alertname: AccountingGaugesUnreadable
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "A gauge read failed or outlived its bound, so the alerts on it cannot fire. See OPERATIONS_RUNBOOK.md section 10.14."
              summary: "An accounting gauge cannot be read"

  # A release that publishes only the run-stall gauge: every other accounting gauge absent from the fleet, so the threshold
  # rules on them are green for the wrong reason - the absence rule fires after five minutes.
  - interval: 1m
    input_series:
      - series: 'finapp_accounting_close_run_stalled{job="finapp", instance="a:8081"}'
        values: '0x15'
      - series: 'finapp_accounting_close_run_stalled{job="finapp", instance="b:8081"}'
        values: '0x15'
    alert_rule_test:
      - eval_time: 4m
        alertname: AccountingGaugesAbsent
        exp_alerts: []
      - eval_time: 10m
        alertname: AccountingGaugesAbsent
        exp_alerts:
          - exp_labels:
              owner: "accounting"
              severity: "ticket"
            exp_annotations:
              description: "The alerts reading it cannot fire. See OPERATIONS_RUNBOOK.md section 10.14."
              summary: "An accounting gauge is not published by any instance"
