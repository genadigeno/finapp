# promtool unit tests for every alert in infra/prometheus/rules/bnpl.yml: BnplSweepClaimFailing's (P15-TSK-025; the debt row
# "The BNPL schedules log a claim-level sweep failure but never meter it"), and since 2026-11-12 a firing case and a silent
# one on its own series for each of the others. BnplAlertRulesTest holds the same rules against a real instance's scrape
# with this repository's own evaluator; these are Prometheus's own reading of them.
# CI runs every file here through promtool (infra/scripts/alert-rules-check.sh, P15-TSK-025).
# Two instances wherever instances can differ: the multi-instance case is the rule's aggregation.
# The cases written before 2026-11-12 were generated once and reviewed as written (P15-TSK-025); every firing case written since had
# its expectation generated by the pinned promtool from the rule, and was reviewed as written.

rule_files:
  - ../rules/bnpl.yml

evaluation_interval: 1m

tests:
  # Claims failing on instance b alone: the sum by kind fires once it has been sustained.
  - interval: 1m
    input_series:
      - series: 'finapp_bnpl_sweeper_claim_failed_total{job="finapp", instance="a:8081", kind="servicing"}'
        values: '0x35'
      - series: 'finapp_bnpl_sweeper_claim_failed_total{job="finapp", instance="b:8081", kind="servicing"}'
        values: '0+1x35'
    alert_rule_test:
      - eval_time: 10m
        alertname: BnplSweepClaimFailing
        exp_alerts: []
      - eval_time: 20m
        alertname: BnplSweepClaimFailing
        exp_alerts:
          - exp_labels:
              kind: servicing
              owner: bnpl
              severity: ticket
            exp_annotations:
              summary: "The BNPL servicing sweep's claims keep failing"
              description: "Claims of the BNPL servicing sweep have failed for 15 minutes, so nothing is being swept and the step alerts stay silent. See OPERATIONS_RUNBOOK.md section 8.6."

  # No claim failing: silent.
  - interval: 1m
    input_series:
      - series: 'finapp_bnpl_sweeper_claim_failed_total{job="finapp", instance="a:8081", kind="servicing"}'
        values: '0x35'
      - series: 'finapp_bnpl_sweeper_claim_failed_total{job="finapp", instance="b:8081", kind="origination"}'
        values: '0x35'
    alert_rule_test:
      - eval_time: 20m
        alertname: BnplSweepClaimFailing
        exp_alerts: []

  # Every reading healthy on both instances for three hours - accrual current, every failure counter still, applications and
  # contested disputes young, every proof at zero, no negative merchant payable, terms active, every sweep on: nothing fires,
  # each rule past its own wait.
  - interval: 1m
    input_series:
      - series: 'finapp_bnpl_accrual_lag_seconds{job="finapp", instance="a:8081"}'
        values: '3600x180'
      - series: 'finapp_bnpl_accrual_lag_seconds{job="finapp", instance="b:8081"}'
        values: '3600x180'
      - series: 'finapp_bnpl_accrual_total{job="finapp", instance="a:8081", outcome="failed"}'
        values: '2x180'
      - series: 'finapp_bnpl_accrual_total{job="finapp", instance="b:8081", outcome="failed"}'
        values: '2x180'
      - series: 'finapp_bnpl_accrual_total{job="finapp", instance="a:8081", outcome="accrued"}'
        values: '0+1x180'
      - series: 'finapp_bnpl_accrual_total{job="finapp", instance="b:8081", outcome="accrued"}'
        values: '0+1x180'
      - series: 'finapp_bnpl_application_awaiting_age_seconds{job="finapp", instance="a:8081"}'
        values: '3600x180'
      - series: 'finapp_bnpl_application_awaiting_age_seconds{job="finapp", instance="b:8081"}'
        values: '3600x180'
      - series: 'finapp_bnpl_origination_total{job="finapp", instance="a:8081", outcome="failed"}'
        values: '1x180'
      - series: 'finapp_bnpl_origination_total{job="finapp", instance="b:8081", outcome="failed"}'
        values: '1x180'
      - series: 'finapp_bnpl_servicing_total{job="finapp", instance="a:8081", step="service", outcome="failed"}'
        values: '1x180'
      - series: 'finapp_bnpl_servicing_total{job="finapp", instance="b:8081", step="service", outcome="failed"}'
        values: '1x180'
      - series: 'finapp_bnpl_dispute_total{job="finapp", instance="a:8081", outcome="sweep_failed"}'
        values: '1x180'
      - series: 'finapp_bnpl_dispute_total{job="finapp", instance="b:8081", outcome="sweep_failed"}'
        values: '1x180'
      - series: 'finapp_bnpl_dispute_total{job="finapp", instance="a:8081", outcome="not_postable"}'
        values: '1x180'
      - series: 'finapp_bnpl_dispute_total{job="finapp", instance="b:8081", outcome="not_postable"}'
        values: '1x180'
      - series: 'finapp_bnpl_dispute_contested_age_seconds{job="finapp", instance="a:8081"}'
        values: '86400x180'
      - series: 'finapp_bnpl_dispute_contested_age_seconds{job="finapp", instance="b:8081"}'
        values: '86400x180'
