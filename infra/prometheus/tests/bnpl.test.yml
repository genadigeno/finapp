        values: '0x180'
      - series: 'finapp_bnpl_replay{job="finapp", instance="b:8081", verdict="DIVERGED"}'
        values: '0x180'
      - series: 'finapp_ledger_negative_positions{job="finapp", instance="a:8081", purpose="MERCHANT_PAYABLE"}'
        values: '0x180'
      - series: 'finapp_ledger_negative_positions{job="finapp", instance="b:8081", purpose="MERCHANT_PAYABLE"}'
        values: '0x180'
      - series: 'finapp_bnpl_terms_active{job="finapp", instance="a:8081", product="BNPL_PAY_IN_4", bnpl_offered="true"}'
        values: '1x180'
      - series: 'finapp_bnpl_terms_active{job="finapp", instance="b:8081", product="BNPL_PAY_IN_4", bnpl_offered="true"}'
        values: '1x180'
      - series: 'finapp_bnpl_origination_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_bnpl_origination_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '1x180'
      - series: 'finapp_bnpl_servicing_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_bnpl_servicing_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '1x180'
      - series: 'finapp_bnpl_dispute_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_bnpl_dispute_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '1x180'
    alert_rule_test:
      - eval_time: 2h
        alertname: BnplAccrualLagging
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplAccrualFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplApplicationAwaitingTooLong
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplOriginationStepFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplServicingStepFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplDisputeDeadlineStepFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplDisputeRefundNotPostable
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplDisputeContestedTooLong
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplAllocationAnomaly
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplThreeWayProofFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplSubledgerProofFailing
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplReplayDiverged
        exp_alerts: []
      - eval_time: 2h
        alertname: MerchantPayableNegative
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplTermsNoneActive
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplOriginationSweeperOff
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplServicingSweeperOff
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplDisputeSweeperOff
        exp_alerts: []
      - eval_time: 2h
        alertname: BnplGaugesUnreadable
        exp_alerts: []

  # Each reading broken on b alone: every threshold rule fires, the negative merchant payable an hour after it began.
  - interval: 1m
    input_series:
      - series: 'finapp_bnpl_accrual_lag_seconds{job="finapp", instance="a:8081"}'
        values: '3600x180'
      - series: 'finapp_bnpl_accrual_lag_seconds{job="finapp", instance="b:8081"}'
        values: '90000x180'
      - series: 'finapp_bnpl_accrual_total{job="finapp", instance="a:8081", outcome="failed"}'
        values: '2x180'
      - series: 'finapp_bnpl_accrual_total{job="finapp", instance="b:8081", outcome="failed"}'
        values: '0+1x180'
      - series: 'finapp_bnpl_accrual_total{job="finapp", instance="a:8081", outcome="accrued"}'
        values: '0+1x180'
      - series: 'finapp_bnpl_accrual_total{job="finapp", instance="b:8081", outcome="accrued"}'
        values: '0+1x180'
      - series: 'finapp_bnpl_application_awaiting_age_seconds{job="finapp", instance="a:8081"}'
        values: '3600x180'
      - series: 'finapp_bnpl_application_awaiting_age_seconds{job="finapp", instance="b:8081"}'
        values: '610000x180'
      - series: 'finapp_bnpl_origination_total{job="finapp", instance="a:8081", outcome="failed"}'
        values: '1x180'
      - series: 'finapp_bnpl_origination_total{job="finapp", instance="b:8081", outcome="failed"}'
        values: '0+1x180'
      - series: 'finapp_bnpl_servicing_total{job="finapp", instance="a:8081", step="service", outcome="failed"}'
        values: '1x180'
      - series: 'finapp_bnpl_servicing_total{job="finapp", instance="b:8081", step="service", outcome="failed"}'
        values: '0+1x180'
      - series: 'finapp_bnpl_dispute_total{job="finapp", instance="a:8081", outcome="sweep_failed"}'
        values: '1x180'
      - series: 'finapp_bnpl_dispute_total{job="finapp", instance="b:8081", outcome="sweep_failed"}'
        values: '0+1x180'
      - series: 'finapp_bnpl_dispute_total{job="finapp", instance="a:8081", outcome="not_postable"}'
        values: '1x180'
      - series: 'finapp_bnpl_dispute_total{job="finapp", instance="b:8081", outcome="not_postable"}'
        values: '0+1x180'
      - series: 'finapp_bnpl_dispute_contested_age_seconds{job="finapp", instance="a:8081"}'
        values: '86400x180'
      - series: 'finapp_bnpl_dispute_contested_age_seconds{job="finapp", instance="b:8081"}'
        values: '700000x180'
      - series: 'finapp_bnpl_allocation_anomaly_total{job="finapp", instance="a:8081"}'
        values: '0x180'
      - series: 'finapp_bnpl_allocation_anomaly_total{job="finapp", instance="b:8081"}'
        values: '0+1x180'
      - series: 'finapp_bnpl_threeway_proof{job="finapp", instance="a:8081", verdict="FAILS"}'
        values: '0x180'
      - series: 'finapp_bnpl_threeway_proof{job="finapp", instance="b:8081", verdict="FAILS"}'
        values: '1x180'
      - series: 'finapp_bnpl_subledger_proof{job="finapp", instance="a:8081", verdict="FAILS"}'
        values: '0x180'
      - series: 'finapp_bnpl_subledger_proof{job="finapp", instance="b:8081", verdict="FAILS"}'
        values: '1x180'
      - series: 'finapp_bnpl_replay{job="finapp", instance="a:8081", verdict="DIVERGED"}'
        values: '0x180'
      - series: 'finapp_bnpl_replay{job="finapp", instance="b:8081", verdict="DIVERGED"}'
        values: '1x180'
      - series: 'finapp_ledger_negative_positions{job="finapp", instance="a:8081", purpose="MERCHANT_PAYABLE"}'
        values: '0x180'
      - series: 'finapp_ledger_negative_positions{job="finapp", instance="b:8081", purpose="MERCHANT_PAYABLE"}'
        values: '1x180'
      - series: 'finapp_bnpl_terms_active{job="finapp", instance="a:8081", product="BNPL_PAY_IN_4", bnpl_offered="true"}'
        values: '1x180'
      - series: 'finapp_bnpl_terms_active{job="finapp", instance="b:8081", product="BNPL_PAY_IN_4", bnpl_offered="true"}'
        values: '0x180'
      - series: 'finapp_bnpl_origination_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_bnpl_origination_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '0x180'
      - series: 'finapp_bnpl_servicing_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_bnpl_servicing_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '0x180'
      - series: 'finapp_bnpl_dispute_sweeper_enabled{job="finapp", instance="a:8081"}'
        values: '1x180'
      - series: 'finapp_bnpl_dispute_sweeper_enabled{job="finapp", instance="b:8081"}'
        values: '0x180'
    alert_rule_test:
      - eval_time: 1h50m
        alertname: BnplAccrualLagging
        exp_alerts:
          - exp_labels:
              owner: "bnpl"
              severity: "page"
            exp_annotations:
              description: "The oldest unaccrued elapsed date ended 1d 1h 0m 0s ago. Check finapp_bnpl_servicing_sweeper_enabled and finapp_bnpl_accrual_total by outcome; the sweep catches up born-once (OPERATIONS_RUNBOOK.md section 8.2)."
              summary: "BNPL interest accrual is more than a day behind"
      - eval_time: 1h50m
        alertname: BnplAccrualFailing
        exp_alerts:
          - exp_labels:
              owner: "bnpl"
              severity: "ticket"
            exp_annotations:
              description: "T-acc calls failed in each of the last fifteen minutes; their obligations are not serviced until one succeeds. Read the instances' warn lines for the exception's class (OPERATIONS_RUNBOOK.md section 8.2)."
              summary: "BNPL accrual calls keep failing"
      - eval_time: 1h50m
        alertname: BnplApplicationAwaitingTooLong
        exp_alerts:
          - exp_labels:
              owner: "bnpl"
              severity: "ticket"
            exp_annotations:
              description: "The oldest application AWAITING_DECISION was submitted 7d 1h 26m 40s ago. Check finapp_bnpl_origination_sweeper_enabled on every instance and finapp_bnpl_origination_total{outcome=\"failed\"} (OPERATIONS_RUNBOOK.md section 8.6)."
              summary: "A BNPL application has waited past every credit request's validity"
      - eval_time: 1h50m
        alertname: BnplOriginationStepFailing
        exp_alerts:
          - exp_labels:
              owner: "bnpl"
              severity: "ticket"
            exp_annotations:
              description: "Origination steps or offer expiries failed in each of the last fifteen minutes; the permits lapse and later ticks retry. Read the instances' warn lines for the exception's class (OPERATIONS_RUNBOOK.md section 8.6)."
              summary: "BNPL origination steps keep failing"
      - eval_time: 1h50m
        alertname: BnplServicingStepFailing
        exp_alerts:
          - exp_labels:
              owner: "bnpl"
              severity: "ticket"
            exp_annotations:
              description: "Servicing steps failed in each of the last fifteen minutes; billing, collection, condition and closure wait for the next success. Read the instances' warn lines for the exception's class (OPERATIONS_RUNBOOK.md section 8.6)."
              summary: "BNPL servicing steps keep failing"
      - eval_time: 1h50m
        alertname: BnplDisputeDeadlineStepFailing
        exp_alerts:
          - exp_labels:
              owner: "bnpl"
              severity: "ticket"
            exp_annotations:
              description: "Steps resolving disputes past their merchant response deadline failed in each of the last fifteen minutes; the customer's refund waits. Read the instances' warn lines for the exception's class (OPERATIONS_RUNBOOK.md section 8.6)."
              summary: "BNPL dispute deadline steps keep failing"
      - eval_time: 1h50m
        alertname: BnplDisputeRefundNotPostable
        exp_alerts:
          - exp_labels:
              owner: "bnpl"
              severity: "ticket"
            exp_annotations:
              description: "A dispute's refund outcome was refused as not postable in the last hour - most often a lapsed dispute's deadline step retrying while the merchant's payable or the customer's wallet is closed. List the lapsed disputes still OPEN and restore the account their refund needs (OPERATIONS_RUNBOOK.md section 8.9)."
              summary: "A BNPL dispute's refund cannot be posted"
      - eval_time: 1h50m
        alertname: BnplDisputeContestedTooLong
        exp_alerts:
          - exp_labels:
              owner: "bnpl"
              severity: "ticket"
            exp_annotations:
              description: "The oldest MERCHANT_RESPONDED dispute was contested 8d 2h 26m 40s ago. Work the queue - GET /v1/operator/bnpl-disputes?status=MERCHANT_RESPONDED - and resolve it (OPERATIONS_RUNBOOK.md section 8.9)."
              summary: "A contested BNPL dispute has waited for an operator for over a week"
      - eval_time: 1h50m
        alertname: BnplAllocationAnomaly
        exp_alerts:
          - exp_labels:
              owner: "bnpl"
              severity: "page"
            exp_annotations:
              description: "At least one allocation was refused in fifteen minutes. Nothing posted; read the agreement's explanation and replay it (OPERATIONS_RUNBOOK.md section 8.4)."
              summary: "A BNPL allocation did not conserve its amount"
      - eval_time: 1h50m
        alertname: BnplThreeWayProofFailing
        exp_alerts:
          - exp_labels:
              owner: "bnpl"
              severity: "page"
            exp_annotations:
              description: "1 currencies fail the BNPL three-way proof. The portfolio report names the failing arms (GET /v1/operator/reports/bnpl/portfolio). Never adjust a balance (OPERATIONS_RUNBOOK.md section 8.3)."
              summary: "The BNPL three-way proof fails"
      - eval_time: 1h50m
        alertname: BnplSubledgerProofFailing
        exp_alerts:
          - exp_labels:
              owner: "bnpl"
              severity: "page"
            exp_annotations:
              description: "1 obligations fail the subledger proof. The portfolio report lists their agreements; explain each through GET /v1/operator/bnpl-agreements/{id}/explanation. Never adjust a balance (OPERATIONS_RUNBOOK.md section 8.3)."
              summary: "BNPL obligations' ledger balances are not explained by their rows"
      - eval_time: 1h50m
        alertname: BnplReplayDiverged
        exp_alerts:
          - exp_labels:
              owner: "bnpl"
              severity: "page"
            exp_annotations:
              description: "1 obligations replay DIVERGED. The portfolio report lists their agreements; replay each through POST /v1/operator/bnpl-agreements/{id}/replay to see which kinds differ. Never repair a row (OPERATIONS_RUNBOOK.md section 8.3)."
              summary: "BNPL obligations do not replay from their pinned engines and terms"
      - eval_time: 1h50m
        alertname: MerchantPayableNegative
        exp_alerts:
          - exp_labels:
              owner: "bnpl"
              severity: "ticket"
            exp_annotations:
              description: "1 merchant payables stand below zero. Recovery is automatic from later captures and financings; check the merchant-financing report and the merchant's drill-down (OPERATIONS_RUNBOOK.md section 8.5)."
              summary: "A merchant payable is below zero"
      - eval_time: 1h50m
        alertname: BnplTermsNoneActive
        exp_alerts:
          - exp_labels:
              owner: "bnpl"
              product: "BNPL_PAY_IN_4"
              severity: "ticket"
            exp_annotations:
              description: "No BNPL_PAY_IN_4 application is accepted until a terms version is activated by a person other than its proposer (OPERATIONS_RUNBOOK.md sections 8.1 and 8.7)."
              summary: "The BNPL product BNPL_PAY_IN_4 has no active terms"
      - eval_time: 1h50m
        alertname: BnplOriginationSweeperOff
        exp_alerts:
          - exp_labels:
              instance: "b:8081"
              job: "finapp"
              owner: "bnpl"
              severity: "ticket"
            exp_annotations:
              description: "finapp.bnpl.origination.sweeper.enabled is false on a scraped instance. Applications are offered by the others; set it back to true (OPERATIONS_RUNBOOK.md section 8.7)."
              summary: "An instance is not running the BNPL origination sweep"
      - eval_time: 1h50m
        alertname: BnplServicingSweeperOff
        exp_alerts:
          - exp_labels:
              instance: "b:8081"
              job: "finapp"
              owner: "bnpl"
              severity: "ticket"
            exp_annotations:
              description: "finapp.bnpl.servicing.sweeper.enabled is false on a scraped instance. Obligations are serviced by the others; set it back to true (OPERATIONS_RUNBOOK.md section 8.7)."
              summary: "An instance is not running the BNPL servicing sweep"
      - eval_time: 1h50m
        alertname: BnplDisputeSweeperOff
        exp_alerts:
          - exp_labels:
              instance: "b:8081"
              job: "finapp"
              owner: "bnpl"
              severity: "ticket"
            exp_annotations:
              description: "finapp.bnpl.dispute.sweeper.enabled is false on a scraped instance. Lapsed disputes are resolved by the others; set it back to true (OPERATIONS_RUNBOOK.md section 8.7)."
              summary: "An instance is not running the BNPL dispute deadline sweep"

  # Every BNPL gauge NaN on b, numbers on a: the unreadable rule fires once its quarter hour has passed.
  - interval: 1m
    input_series:
      - series: 'finapp_bnpl_accrual_lag_seconds{job="finapp", instance="a:8081"}'
