# Settlement and reconciliation alerts (P8-TSK-024, PHASE_8_PLAN.md section 15).
#
# Every "must be 0" gauge, source silence, overdue expectations, suspense age, break age per
# severity, refused deliveries and blocked runs. Every expression names a series the application
# publishes - AlertRulesResolveTest checks each one against a live scrape, because a rule over a
# series that does not exist never fires and looks exactly like a healthy system.
#
# Conventions:
# - Gauges read the shared database, so every instance publishes the same reading: aggregate with
#   max(), never sum(). Counters are per instance: sum(increase(...)).
# - A gauge that cannot be read is NaN, never zero, and a comparison with NaN is false - so the
#   threshold alerts below cannot see an unreadable gauge. MustBeZeroGaugeUnreadable can, and
#   ReconciliationGaugesUnreadable for the ages and the overdue count (P15-TSK-024's fix round: since
#   that task a gauge is also NaN while its instance's gauge refresher is behind).
# - No amount anywhere: labels and annotations name sources, purposes, currencies and severities,
#   and the follow-up is the audited operator report or route that answers the amount.
# - `severity` is the ALERT's kind (page or ticket). The break-age rules carry the break's own
#   severity as `break_severity`, because a rule label overrides the series label of the same name.
# - Routed by severity in infra/alertmanager/alertmanager.yml (P15-TSK-025), to a placeholder receiver until an on-call tool exists.

groups:
  - name: settlement-reconciliation
    labels:
      owner: reconciliation
    rules:
      # ---------------------------------------------------------------- must be 0

      - alert: PositionProofFailing
        expr: max by (purpose) (finapp_reconciliation_position_proof) > 0
        for: 0s
        labels:
          severity: page
        annotations:
          summary: "Position proof failing for {{ $labels.purpose }} (INV-REC-06)"
          description: "{{ $value }} currencies of {{ $labels.purpose }} fail the position proof. Follow up with GET /v1/operator/reports/reconciliation/positions. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: UnattributedLinesOnReconciledPosition
        expr: max by (purpose) (finapp_reconciliation_line_unattributed) > 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Unattributed lines on the reconciled position {{ $labels.purpose }}"
          description: "{{ $value }} lines on {{ $labels.purpose }} answer to no expectation. Follow up with GET /v1/operator/reports/reconciliation/positions. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: CashProofFailing
        expr: max by (currency) (finapp_reconciliation_cash_proof) > 0
        for: 0s
        labels:
          severity: page
        annotations:
          summary: "Cash proof failing in {{ $labels.currency }} (INV-SET-06)"
          description: "Cash at bank in {{ $labels.currency }} is not the head closing of an unbroken statement chain. Follow up with GET /v1/operator/reports/reconciliation/positions and the bank statements at GET /v1/operator/settlement/files. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: SuspenseItemUnowned
        expr: max(finapp_reconciliation_suspense_unowned) > 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Suspense items with no open break answering for them (INV-REC-09)"
          description: "{{ $value }} suspense items hold a remainder no open break owns. Follow up with GET /v1/operator/reports/reconciliation/suspense. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: ReconciliationRunBlocked
        expr: max by (source) (finapp_reconciliation_run_blocked) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Blocked reconciliation run for {{ $labels.source }}"
          description: "{{ $value }} runs of {{ $labels.source }} are blocked - an accepted batch nobody is matching. Follow up with GET /v1/operator/reconciliation/runs, then POST /v1/operator/reconciliation/runs/{id}/requeue. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: ReconciliationRunStalled
        # Incomplete after an hour yet not BLOCKED: chunks failing below the block threshold, or
        # no instance sweeping.
        expr: max by (source) (finapp_reconciliation_run_age_seconds) > 3600
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "A reconciliation run of {{ $labels.source }} is over an hour old"
          description: "The oldest incomplete run of {{ $labels.source }} is {{ $value | humanizeDuration }} old. Follow up with GET /v1/operator/reconciliation/runs. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: MustBeZeroGaugeUnreadable
        # x != x holds only for NaN: the gauge could not read the database. Each leg names its
        # gauge in a `gauge` label, because an alert drops the metric name and two gauges sharing
        # a purpose would otherwise collide into one label set.
        expr: >-
          label_replace(finapp_reconciliation_position_proof != finapp_reconciliation_position_proof, "gauge", "position.proof", "", "")
          or label_replace(finapp_reconciliation_line_unattributed != finapp_reconciliation_line_unattributed, "gauge", "line.unattributed", "", "")
          or label_replace(finapp_reconciliation_cash_proof != finapp_reconciliation_cash_proof, "gauge", "cash.proof", "", "")
          or label_replace(finapp_reconciliation_suspense_unowned != finapp_reconciliation_suspense_unowned, "gauge", "suspense.unowned", "", "")
          or label_replace(finapp_reconciliation_run_blocked != finapp_reconciliation_run_blocked, "gauge", "run.blocked", "", "")
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "The must-be-0 gauge {{ $labels.gauge }} is unreadable (NaN)"
          description: "finapp.reconciliation.{{ $labels.gauge }} on {{ $labels.instance }} reads NaN - its proof is not being checked there, and its threshold alert cannot fire. Follow up with that instance's database connectivity and logs. See OPERATIONS_RUNBOOK.md section 11.23."

      # ---------------------------------------------------------------- evidence arriving

      - alert: SettlementSourceSilent
        # A day without an accepted batch. Every compiled source reports at least daily; a source
        # with a slower cadence would need its own rule, not a wider one for all.
        expr: max by (source) (finapp_settlement_source_silence) > 86400
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "No accepted settlement batch from {{ $labels.source }} for over a day"
          description: "{{ $labels.source }} has been silent for {{ $value | humanizeDuration }}. Follow up with GET /v1/operator/settlement/sources and GET /v1/operator/settlement/files; a pullable source can be fetched with POST /v1/operator/settlement/sources/{code}/fetch. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: SettlementSourceNeverAccepted
        # NaN: no batch of this source was ever accepted (or the register is unreadable). A
        # threshold never compares a NaN, and a file that never arrives must stay visible
        # (ADR-0072 O6) - x != x holds only for NaN.
        expr: max by (source) (finapp_settlement_source_silence != finapp_settlement_source_silence)
        for: 1d
        labels:
          severity: ticket
        annotations:
          summary: "No settlement batch from {{ $labels.source }} has ever been accepted"
          description: "{{ $labels.source }}'s silence cannot be measured: it has no accepted batch, or its register is unreadable. Follow up with GET /v1/operator/settlement/sources and GET /v1/operator/settlement/files. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: SettlementFileStuck
        # A file not terminal after an hour: the parse or accept leg is not keeping up, or the
        # file waits on a second person's attestation.
        expr: max by (source) (finapp_settlement_file_age) > 3600
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "A settlement file of {{ $labels.source }} has waited over an hour"
          description: "The oldest non-terminal file of {{ $labels.source }} has waited {{ $value | humanizeDuration }}. Follow up with GET /v1/operator/settlement/files. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: SettlementDeliveryRefused
        expr: sum by (source, outcome) (increase(finapp_settlement_delivery_refused_total[15m])) > 0
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "Settlement deliveries refused for {{ $labels.source }} ({{ $labels.outcome }})"
          description: "Deliveries from {{ $labels.source }} were refused in the last 15 minutes, reason {{ $labels.outcome }}. Follow up with GET /v1/operator/settlement/refused-deliveries. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: SettlementExpectationOverdue
        expr: max by (source) (finapp_reconciliation_expectation_overdue) > 0
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Overdue settlement expectations for {{ $labels.source }} (INV-SET-02)"
          description: "{{ $value }} expectations of {{ $labels.source }} are past their window with no settling evidence. Follow up with GET /v1/operator/reconciliation/expectations and GET /v1/operator/reconciliation/breaks. See OPERATIONS_RUNBOOK.md section 11.23."

      # ---------------------------------------------------------------- suspense and breaks

      - alert: SuspenseItemAged
        # 30 days (2592000 s). Suspense is never a permanent resting place (INV-REC-05); an item
        # a month old has outlived any routine investigation. The operator's follow-up is the
        # audited suspense report, which shows each item's age and value gross.
        expr: max(finapp_reconciliation_suspense_age_seconds) > 2592000
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "A suspense item has been open for over 30 days (INV-REC-05)"
          description: "The oldest suspense item has been open {{ $value | humanizeDuration }}. Follow up with GET /v1/operator/reports/reconciliation/suspense. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: BreakAgeCritical
        expr: max by (severity) (finapp_reconciliation_break_age{severity="critical"}) > 0
        for: 1m
        labels:
          severity: page
          break_severity: critical
        annotations:
          summary: "An open CRITICAL reconciliation break"
          description: "The oldest open CRITICAL break has stood {{ $value | humanizeDuration }}; a CRITICAL break is alerted at once. Follow up with GET /v1/operator/reconciliation/breaks. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: BreakAgeHigh
        expr: max by (severity) (finapp_reconciliation_break_age{severity="high"}) > 86400
        for: 5m
        labels:
          severity: page
          break_severity: high
        annotations:
          summary: "A HIGH reconciliation break open for over a day"
          description: "The oldest open HIGH break has stood {{ $value | humanizeDuration }}. Follow up with GET /v1/operator/reconciliation/breaks. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: BreakAgeMedium
        expr: max by (severity) (finapp_reconciliation_break_age{severity="medium"}) > 432000
        for: 15m
        labels:
          severity: ticket
          break_severity: medium
        annotations:
          summary: "A MEDIUM reconciliation break open for over five days"
          description: "The oldest open MEDIUM break has stood {{ $value | humanizeDuration }}. Follow up with GET /v1/operator/reconciliation/breaks. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: BreakAgeLow
        expr: max by (severity) (finapp_reconciliation_break_age{severity="low"}) > 1296000
        for: 1h
        labels:
          severity: ticket
          break_severity: low
        annotations:
          summary: "A LOW reconciliation break open for over fifteen days"
          description: "The oldest open LOW break has stood {{ $value | humanizeDuration }}. Follow up with GET /v1/operator/reconciliation/breaks. See OPERATIONS_RUNBOOK.md section 11.23."

      # ---------------------------------------------------------------- newly aged, while one stands
      # P16-TSK-029 (THREAT_MODEL.md section 6 item 42 (a), decided (i)). The age rules above read the OLDEST, so while one parked item
      # stands they stay firing on it and a break or item that ages behind it raises nothing. Each rule here sits beside one of them:
      # the count of what is past the same bound (AgedCountMetrics, its bounds held to the thresholds above by AgedCountMetricsTest)
      # above its least over the last two hours, while that least was at least one - one stood throughout, so the first to age is
      # the age rule's to raise, not this one's. A count that falls (a resolution) or stays raises nothing; one resolved and another
      # aged within the window does. The window outlasts every for here, so each can hold its for; the alert stands until the rise
      # leaves the window. Same severity and for as the age rule beside it.

      - alert: BreakNewlyAgedCritical
        # Aggregation: max() - a fleet-wide gauge every instance reads from the same database; a NaN instance is ignored
        expr: max by (severity) (finapp_reconciliation_break_aged{severity="critical"}) > min_over_time(max by (severity) (finapp_reconciliation_break_aged{severity="critical"})[2h:1m]) and min_over_time(max by (severity) (finapp_reconciliation_break_aged{severity="critical"})[2h:1m]) >= 1
        for: 1m
        labels:
          severity: page
          break_severity: critical
        annotations:
          summary: "Another CRITICAL reconciliation break, while one already stands"
          description: "{{ $value }} open CRITICAL breaks now, more than at any moment of the last two hours while one stood: a new one, behind the one BreakAgeCritical already holds. Follow up with GET /v1/operator/reconciliation/breaks. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: BreakNewlyAgedHigh
        # Aggregation: max() - a fleet-wide gauge every instance reads from the same database; a NaN instance is ignored
        expr: max by (severity) (finapp_reconciliation_break_aged{severity="high"}) > min_over_time(max by (severity) (finapp_reconciliation_break_aged{severity="high"})[2h:1m]) and min_over_time(max by (severity) (finapp_reconciliation_break_aged{severity="high"})[2h:1m]) >= 1
        for: 5m
        labels:
          severity: page
          break_severity: high
        annotations:
          summary: "Another HIGH reconciliation break past a day, while one already stands"
          description: "{{ $value }} open HIGH breaks are over a day old now, more than at any moment of the last two hours while one stood: a new one aged, behind the one BreakAgeHigh already holds. Follow up with GET /v1/operator/reconciliation/breaks. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: BreakNewlyAgedMedium
        # Aggregation: max() - a fleet-wide gauge every instance reads from the same database; a NaN instance is ignored
        expr: max by (severity) (finapp_reconciliation_break_aged{severity="medium"}) > min_over_time(max by (severity) (finapp_reconciliation_break_aged{severity="medium"})[2h:1m]) and min_over_time(max by (severity) (finapp_reconciliation_break_aged{severity="medium"})[2h:1m]) >= 1
        for: 15m
        labels:
          severity: ticket
          break_severity: medium
        annotations:
          summary: "Another MEDIUM reconciliation break past five days, while one already stands"
          description: "{{ $value }} open MEDIUM breaks are over five days old now, more than at any moment of the last two hours while one stood. Follow up with GET /v1/operator/reconciliation/breaks. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: BreakNewlyAgedLow
        # Aggregation: max() - a fleet-wide gauge every instance reads from the same database; a NaN instance is ignored
        expr: max by (severity) (finapp_reconciliation_break_aged{severity="low"}) > min_over_time(max by (severity) (finapp_reconciliation_break_aged{severity="low"})[2h:1m]) and min_over_time(max by (severity) (finapp_reconciliation_break_aged{severity="low"})[2h:1m]) >= 1
        for: 1h
        labels:
          severity: ticket
          break_severity: low
        annotations:
          summary: "Another LOW reconciliation break past fifteen days, while one already stands"
          description: "{{ $value }} open LOW breaks are over fifteen days old now, more than at any moment of the last two hours while one stood. Follow up with GET /v1/operator/reconciliation/breaks. See OPERATIONS_RUNBOOK.md section 11.23."

      - alert: SuspenseItemNewlyAged
        # Aggregation: max() - a fleet-wide gauge every instance reads from the same database; a NaN instance is ignored
        expr: max(finapp_reconciliation_suspense_aged) > min_over_time(max(finapp_reconciliation_suspense_aged)[2h:1m]) and min_over_time(max(finapp_reconciliation_suspense_aged)[2h:1m]) >= 1
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "Another suspense item past 30 days, while one already stands (INV-REC-05)"
          description: "{{ $value }} suspense items are over 30 days old now, more than at any moment of the last two hours while one stood: a new one aged, behind the one SuspenseItemAged already holds. Follow up with GET /v1/operator/reports/reconciliation/suspense. See OPERATIONS_RUNBOOK.md section 11.23."

      # ---------------------------------------------------------------- the other gauges, unreadable

      - alert: ReconciliationGaugesUnreadable
        # P15-TSK-024's fix round (2026-11-08): every gauge a threshold rule here compares that MustBeZeroGaugeUnreadable does
        # not - the run, file, expectation, suspense and break ages - NaN on an instance: its read failed there, or that
        # instance's gauge refresher is behind (platform.yml's GaugesStale says which). While one is NaN its alert cannot
        # fire there; a CRITICAL break is unknown, not absent. Each reads 0 when nothing is open, NaN only when unread. Per
        # instance, each leg naming its series in a `gauge` label; max by (job, instance) also drops the break age's own
        # `severity`, which the rule's label would override into four alerts of one label set. P16-TSK-029: the break-age
        # counts too, which the rise rules above compare, NaN together when their one reading fails.
        expr: >-
          label_replace(max by (job, instance) (finapp_reconciliation_run_age_seconds != finapp_reconciliation_run_age_seconds), "gauge", "finapp_reconciliation_run_age_seconds", "", "")
          or label_replace(max by (job, instance) (finapp_settlement_file_age != finapp_settlement_file_age), "gauge", "finapp_settlement_file_age", "", "")
          or label_replace(max by (job, instance) (finapp_reconciliation_expectation_overdue != finapp_reconciliation_expectation_overdue), "gauge", "finapp_reconciliation_expectation_overdue", "", "")
          or label_replace(max by (job, instance) (finapp_reconciliation_suspense_age_seconds != finapp_reconciliation_suspense_age_seconds), "gauge", "finapp_reconciliation_suspense_age_seconds", "", "")
          or label_replace(max by (job, instance) (finapp_reconciliation_break_age != finapp_reconciliation_break_age), "gauge", "finapp_reconciliation_break_age", "", "")
          or label_replace(max by (job, instance) (finapp_reconciliation_break_aged != finapp_reconciliation_break_aged), "gauge", "finapp_reconciliation_break_aged", "", "")
          or label_replace(max by (job, instance) (finapp_reconciliation_suspense_aged != finapp_reconciliation_suspense_aged), "gauge", "finapp_reconciliation_suspense_aged", "", "")
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "A settlement or reconciliation gauge has no value: {{ $labels.gauge }}"
          description: "{{ $labels.gauge }} on {{ $labels.instance }} reads NaN - its read is failing there, or that instance's gauge refresher is behind - so its threshold alert cannot fire there. See OPERATIONS_RUNBOOK.md section 11.8."

  # P16-TSK-017 (OPERATIONS_RUNBOOK.md section 11.39 (c)): a rematch residual faulting at every retry. It stays a break, aged and
  # alerted as any; this says the rematch cannot examine it.
  - name: reconciliation-rematch
    labels:
      owner: reconciliation
    rules:
      - alert: RematchResidualFaulting
        # Aggregation: sum() - counters are per instance
        # Backed off to at most an hour, so a residual faulting at each retry keeps a fault in every 2-hour window.
        expr: sum(increase(finapp_reconciliation_rematch_faulted_total[2h])) > 0
        for: 3h
        labels:
          severity: ticket
        annotations:
          summary: "A rematch residual keeps faulting"
          description: "The rematch has faulted on a residual at every retry for 3 hours; it stays a break. See OPERATIONS_RUNBOOK.md section 11.39."
