# The broker posture the platform's clients rely on (P15-TSK-026).
#
# Each setting below is one the clients' correctness or security assumes. P15-TSK-015's managed
# cluster configuration and P15-TSK-012's test-only kind broker take them from here; where a
# managed service sets one of these itself, the module records it rather than restating it. The
# kind broker, being one node, overrides the replication settings to 1 and nothing else.
# Listeners, certificates and the broker's own credentials are deployment material: generated per
# run for kind, provider-managed in a real environment, and never written into this repository.
#
# TopicCatalogueTest reads this file beside infra/kafka/topics.yaml.

# Topics exist because the catalogue declares them, never because a client named one.
auto.create.topics.enable=false

# Three copies; two in sync before acks=all acknowledges. An out-of-sync replica is never elected
# leader: that would silently drop records the producer was told were written.
default.replication.factor=3
min.insync.replicas=2
unclean.leader.election.enable=false
offsets.topic.replication.factor=3

# How often the broker looks for segments past retention. It adds to the longest a record can be
# redelivered, so TopicCatalogueTest counts it against the inbox's dedupe window.
log.retention.check.interval.ms=300000

# Committed offsets of a group with no members expire after 7 days. The consumers then start from
# the earliest retained record (auto.offset.reset=earliest), which the inbox deduplicates: every
# retained record is younger than its dedupe window.
offsets.retention.minutes=10080

# The session timeouts the broker admits. The consumers ask for 30 seconds
# (KafkaEventReceiver.SESSION_TIMEOUT), inside these bounds; TopicCatalogueTest checks that.
group.min.session.timeout.ms=6000
group.max.session.timeout.ms=300000

# Clients authenticate with SCRAM-SHA-512 over TLS (owner decision C11), and nothing is permitted
# that no ACL grants.
sasl.enabled.mechanisms=SCRAM-SHA-512
allow.everyone.if.no.acl.found=false
