# A small ExternalSecret for the module's own tests. Each root reads the real ones.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finapp-migrator-secrets
spec:
  secretStoreRef:
    kind: SecretStore
    name: finapp-migrator-store
  target:
    name: finapp-migrator-secrets
  data:
    - secretKey: FINAPP_DB_MIGRATOR_PASSWORD
      remoteRef:
        key: FINAPP_DB_MIGRATOR_PASSWORD
    - secretKey: FINAPP_DB_MIGRATOR_USER
      remoteRef:
        key: FINAPP_DB_MIGRATOR_USER
    - secretKey: FINAPP_DB_URL
      remoteRef:
        key: FINAPP_DB_URL
