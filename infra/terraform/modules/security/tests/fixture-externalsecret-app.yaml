# A small ExternalSecret for the module's own tests. Each root reads the real ones.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: finapp-app-secrets
spec:
  secretStoreRef:
    kind: SecretStore
    name: finapp-app-store
  target:
    name: finapp-app-secrets
  data:
    - secretKey: FINAPP_DB_URL
      remoteRef:
        key: FINAPP_DB_URL
    - secretKey: FINAPP_MFA_KEY
      remoteRef:
        key: FINAPP_MFA_KEY
    - secretKey: FINAPP_PAYMENTS_WEBHOOK_KEY
      remoteRef:
        key: FINAPP_PAYMENTS_WEBHOOK_KEY
    - secretKey: FINAPP_KAFKA_SASL_PASSWORD
      sourceRef:
        storeRef:
          kind: SecretStore
          name: finapp-app-kafka-store
      remoteRef:
        key: application
        property: password
    - secretKey: FINAPP_KAFKA_SASL_USERNAME
      sourceRef:
        storeRef:
          kind: SecretStore
          name: finapp-app-kafka-store
      remoteRef:
        key: application
        property: username
