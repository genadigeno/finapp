# A small overlay for the module's own tests. Each root reads its own.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: finapp-app-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: placeholder-region-0
      prefix: finapp/staging/app/
      auth:
        jwt:
          serviceAccountRef:
            name: finapp-app-secret-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: finapp-migrator-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: placeholder-region-0
      prefix: finapp/staging/migrator/
      auth:
        jwt:
          serviceAccountRef:
            name: finapp-migrator-secret-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: finapp-app-kafka-store
spec:
  provider:
    aws:
      service: SecretsManager
      region: placeholder-region-0
      prefix: AmazonMSK_finapp-staging-
      auth:
        jwt:
          serviceAccountRef:
            name: finapp-app-secret-reader
