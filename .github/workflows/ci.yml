# Continuous integration.
#
# A gate that is not automated is a gate that will be skipped (P0-TSK-004). Every check that
# the Definition of Done relies on runs here, on every change, or it is not a gate.
#
# Supply-chain posture: every third-party action is pinned to a commit SHA and every scanner
# to an image digest, never to a mutable tag. A tag can be repointed by whoever controls the
# repository; a SHA cannot. This is the same reasoning that pins the Gradle distribution by
# checksum in gradle/wrapper/gradle-wrapper.properties. The number of third-party actions is
# deliberately kept small for the same reason.
#
# Jobs are separate so a red build says *which* gate failed at a glance, rather than
# requiring someone to read a log to find out.

name: CI

on:
  push:
    # The integration branch is `master`, which is the repository's default branch. It was
    # `main` until 2026-09-18, when the history was moved onto `master` and `main` was deleted.
    # This trigger moved with it in the same commit, deliberately: a workflow still listening on
    # a branch that no longer exists is every gate silently not running, which is the failure
    # exit criterion 7 exists to make impossible.
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, and every job runs - which is deliberate rather than an oversight, though the first
    # version of this comment claimed the opposite.
    #
    # Two of the gates find things that change without the code changing. `dependency-scan` fails
    # on a CVE published against an artefact nobody touched, and `pinned-images` reports a scanner
    # release or a moved tag. Neither is discoverable from a diff, so neither is discoverable at
    # all unless something asks on a timer.
    #
    # `build` and `migrations` run too, and that is cheap insurance rather than a decision: a
    # scheduled run that is green tells you the last merge is still green against today's world.
    #
    # `image` and `migrator-image` are the third gate of that kind (P15-TSK-006): each is the weekly
    # re-scan of its last built image. No registry holds either yet, so each is rebuilt from the last
    # commit, and it is the same bytes (each job refuses two builds of one commit that differ, and
    # every input is pinned), scanned against this run's own vulnerability database, never a cached one.
    - cron: '0 6 * * 1'
    # Nightly, for the kind rehearsal (P15-TSK-012): a deployment rehearsal that only runs when deploy/ changes says
    # nothing about the code that changed around it. GitHub offers no per-job schedule without another workflow, which
    # CiWorkflowIsLockedDownTest refuses, so every job runs nightly too.
    - cron: '0 3 * * *'

# Least privilege. No job here needs to write to the repository; anything that later does
# must raise its own permissions explicitly, at the job level, and be reviewed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled; runs on master are not. A master run is the
  # record that a merged change passed its gates, and discarding it to save a few minutes
  # trades evidence for speed — the wrong trade on a platform whose CI results are the
  # justification for believing the build is sound.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Scanner image pins are NOT here. Both live in infra/scanner-pins.sh, and both scanners are
# invoked through infra/scripts/, which this workflow calls - so the local invocation and the CI
# invocation are one definition rather than two that agree today (P0-TSK-031), and a tool can read
# the pins to report when they rot (P0-TSK-040, ADR-0026). Trivy's digest was an `env:` value here
# until then, which is a place nothing reads.

jobs:

  # ---------------------------------------------------------------------------
  # Compile, unit tests, module boundary tests, infrastructure version drift.
  #
  # `./gradlew build` runs whatever checks exist. It gains the ArchUnit rules
  # (P0-TSK-007) and the Testcontainers integration tests (P0-TSK-035) the day
  # those tasks land, with no change needed here.
  # ---------------------------------------------------------------------------
  build:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned Java version from the version catalog
        id: toolchain
        # Read rather than hardcoded: gradle/libs.versions.toml is the single source of
        # truth for versions, and a second copy of "21" in this file would drift silently
        # the day the toolchain is bumped.
        run: |
          version=$(grep -E '^javaToolchain[[:space:]]*=' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::javaToolchain not found in gradle/libs.versions.toml"
            exit 1
          fi
          echo "java-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.toolchain.outputs.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Verifies gradle-wrapper.jar against Gradle's published checksums. A wrapper jar
          # is executable code committed to the repository, so it is exactly the kind of
          # thing an attacker would prefer to modify quietly.
          validate-wrappers: true

      - name: Build, test and verify
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        # Only on failure: a red CI with no reports costs far more time than the upload.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Migrations apply to an empty database, and the repository still agrees with
  # what was applied.
  #
  # This is the integration check that exists today. It uses compose.yaml rather
  # than a service container so CI runs the *same* pinned PostgreSQL a developer
  # runs locally — infrastructure differing between the two is a defect the test
  # suite cannot see (P0-TSK-003).
  # ---------------------------------------------------------------------------
  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned Java version from the version catalog
        id: toolchain
        run: |
          version=$(grep -E '^javaToolchain[[:space:]]*=' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::javaToolchain not found in gradle/libs.versions.toml"
            exit 1
          fi
          echo "java-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.toolchain.outputs.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Start PostgreSQL
        # --wait blocks until the container reports healthy, so a migration failure is a
        # real failure rather than a race against startup.
        run: docker compose up -d postgres --wait

      - name: Apply migrations to an empty database
        # Unqualified, not `:platform:flywayMigrate`. Three modules now own a schema
        # (P1-TSK-003) and a module-qualified task name is a list of one that goes stale the
        # moment there are two - the `:platform:databaseTest` defect the P0-TSK-027 review
        # found. Unqualified, Gradle runs the task in every project that has it, so a fourth
        # schema-owning module is covered without anyone remembering.
        run: ./gradlew flywayMigrate --stacktrace

      - name: Validate applied migrations against the repository
        # Fails if an already-applied migration was edited (ADR-0011). This is the
        # automation of P0-TSK-005's "checksum drift fails the build".
        run: ./gradlew flywayValidate --stacktrace

      - name: Re-apply to prove migrations are idempotent
        run: ./gradlew flywayMigrate --stacktrace

      # NOTE: since P0-TSK-035 this step no longer needs the compose stack - the shared harness
      # starts its own container, applies the role script and the migrations, and publishes the
      # coordinates. Compose is still started above because the FLYWAY BUILD TASKS need a
      # database, and those are build-tool invocations rather than tests.
      - name: Run every test that needs a real database
        # Claims about PostgreSQL and its driver are only worth testing against a real one:
        # monetary round-trips preserving scale (INV-MON-05), privilege-level immutability
        # (INV-HIST-03), idempotency under genuine contention, and readiness reporting UP
        # against a database that is actually there. These are excluded from `build`
        # deliberately, so this job is the only place they run.
        #
        # `databaseTest` unqualified, NOT `:platform:databaseTest`. The qualified form was a
        # list of one that went stale the moment a second module gained database tests:
        # P0-TSK-027 added `:app:databaseTest`, whose whole job is the positive control for
        # readiness, and it would have run on a developer's machine and nowhere else.
        run: ./gradlew databaseTest --stacktrace

      # The kafka tier: the outbox reaching a real broker (P2-TSK-001). Unqualified, for the
      # same stale-list reason as the line above.
      - name: Kafka tier
        run: ./gradlew kafkaTest --stacktrace

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Secrets must never reach the repository (.claude/rules/security.md).
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not just the tip: a secret that was committed and later removed is
          # still disclosed, because it remains in the objects anyone can clone.
          fetch-depth: 0

      - name: Scan git history for secrets
        # The same script a developer runs, which is the point: the image pin and the
        # arguments exist once. Its own header carries the reasoning about allowlists and
        # about why history is scanned rather than the working tree.
        #
        # This scan is a NET, not the control. It was probed during P0-TSK-031 and it does
        # not catch `password: hunter2` in a YAML - there is nothing about a memorable
        # password to detect. The control for that is a build rule
        # (CommittedConfigurationHoldsNoSecretTest, run by the `build` job above); see
        # docs/architecture/SECRET_MANAGEMENT.md.
        run: ./infra/scripts/secret-scan.sh

  # ---------------------------------------------------------------------------
  # Known-vulnerable dependencies.
  #
  # Scans a CycloneDX SBOM rather than the build scripts: a scanner cannot resolve
  # Gradle's dependency graph, and the SBOM is the resolved runtime set that
  # actually ships.
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned Java version from the version catalog
        id: toolchain
        run: |
          version=$(grep -E '^javaToolchain[[:space:]]*=' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::javaToolchain not found in gradle/libs.versions.toml"
            exit 1
          fi
          echo "java-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.toolchain.outputs.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Generate SBOM
        run: ./gradlew :app:cyclonedxBom --stacktrace

      - name: Scan SBOM for known vulnerabilities
        # The same script a developer runs. Its own header carries the threshold reasoning,
        # and the pin lives in infra/scanner-pins.sh where check-pinned-images.sh can see it.
        run: ./infra/scripts/dependency-scan.sh

  # ---------------------------------------------------------------------------
  # Are the scanner pins still current? (P0-TSK-040, ADR-0026)
  #
  # Dependabot proposes updates for the SHA-pinned actions above. It does not read a shell
  # variable, so the two scanner image pins need their own mechanism - and they are the pins
  # whose rot is least visible, because an outdated scanner does not fail. It reports nothing
  # and looks exactly like a clean scan. Since P15-TSK-003 the same script also reads the
  # application image's two base pins from the Dockerfile's FROM lines (which Dependabot reads
  # as well), and the image job runs its offline half - an unpinned base refused - on every change.
  #
  # This job asks two different questions, and distinguishes them: has the tag MOVED (the
  # attack digest-pinning defends against, and the more serious answer), and is there a NEWER
  # release (rot). A red scheduled run is the reviewable signal.
  #
  # Weekly rather than per-change: a pin does not rot between commits, and a check that fires
  # on every push is one people learn to ignore.
  # ---------------------------------------------------------------------------
  pinned-images:
    name: Image pin freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scheduled and manual only. It talks to public registries, so it would otherwise fail on a
    # fork's pull request for reasons unrelated to the change.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the pinned scanner and base images
        run: ./infra/scripts/check-pinned-images.sh

  # ---------------------------------------------------------------------------
  # Infrastructure as code (P15-TSK-013, ADR-0121): every root and module under
  # infra/terraform passes fmt, tflint, trivy config, validate and terraform
  # test with mock providers, and each check refuses a planted defect in the
  # same run - so a check that cannot fail fails the job.
  #
  # No credential and no backend, by construction rather than by care: no env,
  # no secret, no permission beyond the workflow's contents: read; every init is
  # -backend=false and every test plans against mock providers. Nothing here can
  # reach a cloud account (THREAT_MODEL.md T30; TerraformIsPinnedAndCheckedTest).
  # ---------------------------------------------------------------------------
  iac:
    name: Infrastructure as code
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the Terraform, and that every check refuses its plant
        # The same script a developer runs; the tool pins live in infra/scanner-pins.sh.
        run: ./infra/scripts/terraform-check.sh

  # ---------------------------------------------------------------------------
  # The Kubernetes manifests (P15-TSK-009, ADR-0120): every overlay under deploy/
  # renders, passes kubeconform -strict against pinned schemas and every policy, and
  # each policy refuses a planted violation in the same run - so a policy that cannot
  # fail fails the job.
  #
  # No credential and no cluster: it renders and reads, so it needs no permission
  # beyond the workflow's contents: read and no secret (THREAT_MODEL.md T30).
  # ---------------------------------------------------------------------------
  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render and validate every overlay, and prove every policy refuses its plant
        # The same script a developer runs; the tool pins live in infra/scanner-pins.sh.
        run: ./infra/scripts/manifest-check.sh

      - name: The edge - its manifests and policies, and every spelling of an operator path through the real proxy
        # P15-TSK-011. The pinned Traefik with the committed route files, against a stand-in backend; no cluster, no credential.
        run: ./infra/scripts/edge-check.sh

      - name: The telemetry pipeline - its manifests and policies, and the planted needles through the real collector
        # P15-TSK-023. The pinned collector with the committed configuration; its scrubbing removed must let the needles out. No cluster, no credential.
        run: ./infra/scripts/telemetry-check.sh

  # ---------------------------------------------------------------------------
  # The controllers' own manifests (P15-TSK-032; OPERATIONS_RUNBOOK.md section
  # 11.36): Argo CD's install manifest and the External Secrets chart, each fetched
  # at its pinned bytes, rendered as a cluster receives them, and held to the named
  # list of cluster roles, bindings and Secret namespaces; each rule refuses a plant
  # in the same run. No credential and no cluster: it renders and reads.
  # ---------------------------------------------------------------------------
  controllers:
    name: Controller manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render Argo CD and the External Secrets chart, hold them to the named list, and prove every rule refuses its plant
        # The same script a developer runs; the pins live in infra/scanner-pins.sh.
        run: ./infra/scripts/controller-check.sh

  # ---------------------------------------------------------------------------
  # A key ring's version is activated only in a change after one that listed it
  # (P15-TSK-019, ADR-0123): compares this change with its base, so a replica is
  # never asked to read a version nothing told it to hold. Its own job because a
  # schedule or a manual run has no base to compare. No credential.
  # ---------------------------------------------------------------------------
  key-ring-activation:
    name: Key-ring activation order
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Rule (5) (P15-TSK-017) reads an environment's smoke records through infra/scripts/Promotion.java, the one reader of that format.
      - name: Read the pinned Java version from the version catalog
        id: toolchain
        run: |
          version=$(grep -E '^javaToolchain[[:space:]]*=' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::javaToolchain not found in gradle/libs.versions.toml"
            exit 1
          fi
          echo "java-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.toolchain.outputs.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: The check refuses what it exists to refuse
        run: ./infra/scripts/key-ring-activation-check.sh --self-test

      - name: Refuse a change that moves a ring out of order
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: ./infra/scripts/key-ring-activation-check.sh "$BASE_REF"

  # ---------------------------------------------------------------------------
  # The promotion's repository refusals (P15-TSK-017, ADR-0122 decision 4): what
  # a change writes into the staging and production overlays, judged with the
  # whole history and no registry - a tag, a hand-edited digest, a record that
  # disagrees with its overlay, a rollback past a contract marker, a production
  # pair whose staging evidence was not merged before this change. Its own job,
  # so the branch rules can require it by name. No credential, no environment.
  # ---------------------------------------------------------------------------
  promotion:
    name: Promotion recheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Read the pinned Java version from the version catalog
        id: toolchain
        run: |
          version=$(grep -E '^javaToolchain[[:space:]]*=' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::javaToolchain not found in gradle/libs.versions.toml"
            exit 1
          fi
          echo "java-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.toolchain.outputs.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Refuse a promotion the repository says is unsafe
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: ./infra/scripts/promote.sh recheck "$BASE_REF"

  # ---------------------------------------------------------------------------
  # The alert rules and routing (P15-TSK-025, ADR-0124): promtool checks every
  # rule and runs every infra/prometheus/tests/*.test.yml, amtool checks the
  # routing and that a page and a ticket reach their receivers, and each kind of
  # check refuses a planted defect in the same run. The same script a developer
  # runs; its images are pinned in infra/scanner-pins.sh. No credential: the
  # receivers are placeholders (THREAT_MODEL.md T30).
  # ---------------------------------------------------------------------------
  alerts:
    name: Alert rules and routing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the rules and the routing, and that each check refuses its plant
        run: ./infra/scripts/alert-rules-check.sh

  # ---------------------------------------------------------------------------
  # Static analysis (P15-TSK-006, ADR-0122 decision 2): Semgrep OSS, pinned by digest, with no
  # network, over the rules vendored under infra/semgrep/rules: Java security, Spring, secrets,
  # and the two T43 and T45 rest on (a statement built from anything but constants; a provider's
  # answer read with no bound). Every finding must have a row in infra/semgrep/baseline.tsv with
  # a reason and an expiry, and the plants must each be refused by name in the same run.
  #
  # No token beyond the workflow's contents: read, and no secret (THREAT_MODEL.md T30).
  # ---------------------------------------------------------------------------
  sast:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the rules' tests, scan the tree, refuse every plant
        # The same script a developer runs; the pin lives in infra/scanner-pins.sh.
        run: ./infra/scripts/sast.sh

  # ---------------------------------------------------------------------------
  # The application image (P15-TSK-003, owner decision C4).
  #
  # Built twice from this commit - the boot jar each time from source, every task re-run - and
  # refused unless the two builds are the same bytes (the image id and every layer
  # digest), it runs as UID 65532, it holds nothing but the pinned distroless base and the boot
  # jar's entries (no shell, no package manager), and it is within its size budget. Then it is
  # run against compose's PostgreSQL and Kafka on loopback, the root filesystem read-only and
  # every capability dropped, until readiness reports UP.
  #
  # It pushes nothing, so it needs no permission beyond the workflow's read-only token and no
  # secret (THREAT_MODEL.md T30). Every script is the one a developer runs. Signing, attestation
  # and admission are the `admission` job's (P15-TSK-007), which pushes only to a registry of its own.
  #
  # Since P15-TSK-006 every image built is scanned here as well (vulnerabilities, secrets,
  # misconfiguration; HIGH and CRITICAL fail; five plants refused by name), and each gets its own
  # CycloneDX SBOM, the one that states what ships, kept with the run for 30 days.
  # ---------------------------------------------------------------------------
  image:
    name: Application image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned Java version from the version catalog
        id: toolchain
        run: |
          version=$(grep -E '^javaToolchain[[:space:]]*=' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::javaToolchain not found in gradle/libs.versions.toml"
            exit 1
          fi
          echo "java-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.toolchain.outputs.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the image twice, compare the builds, assert the image
        run: ./infra/scripts/image-build.sh

      - name: Scan every image built, write its SBOM, refuse every plant
        run: ./infra/scripts/image-scan.sh

      - name: Keep the per-image SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sboms
          path: build/image-sboms/
          if-no-files-found: error
          retention-days: 30

      - name: Start PostgreSQL and Kafka
        run: docker compose up -d postgres kafka --wait

      - name: Apply migrations
        # The application never migrates (ADR-0011); the image is run against a migrated schema.
        run: ./gradlew flywayMigrate --stacktrace

      - name: Run the image until readiness reports UP
        run: ./infra/scripts/image-readiness.sh

      - name: Stop PostgreSQL and Kafka
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # The migrator image (P15-TSK-004): every module's migrations and the program that applies them,
  # the second deployable of ADR-0120. Built twice from one commit and refused unless the two
  # builds are the same bytes, it runs as UID 65532 and it holds nothing but the pinned base, its
  # libraries and the repository's migrations, byte for byte. Then it is run against a throwaway
  # PostgreSQL of its own: the schema history and the schema identical to flywayMigrate's, a
  # second run a no-op, concurrent runs each migration once, a held lock a bounded failure, the
  # one-time role bootstrap, the two owner-reach refusals.
  #
  # It pushes nothing, so it needs no permission beyond the workflow's read-only token and no
  # secret (THREAT_MODEL.md T30); the throwaway credentials are generated in the script.
  #
  # Scanned here as well, since this image is built on this job's own runner (P15-TSK-006): the
  # same script and bar as the application image, its plants, and its own CycloneDX SBOM. The
  # image is named to the script, because on this runner there is only this image to find.
  # ---------------------------------------------------------------------------
  migrator-image:
    name: Migrator image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned Java version from the version catalog
        id: toolchain
        run: |
          version=$(grep -E '^javaToolchain[[:space:]]*=' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::javaToolchain not found in gradle/libs.versions.toml"
            exit 1
          fi
          echo "java-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.toolchain.outputs.java-version }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the image twice, compare the builds, assert the image
        run: ./infra/scripts/migrator-image-build.sh

      - name: Scan the image, write its SBOM, refuse every plant
        run: ./infra/scripts/image-scan.sh --only finapp-migrator

      - name: Keep the image's SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migrator-image-sbom
          path: build/image-sboms/
          if-no-files-found: error
          retention-days: 30

      - name: Run the image against a throwaway database
        run: ./infra/scripts/migrator-verify.sh

      # P15-TSK-032: OPERATIONS_RUNBOOK.md section 11.4 rehearsed on the image this job built - a migration failing on its data,
      # stopped, run again, refused below an applied version and fixed forward; and, on the image and on the developer's Gradle
      # path, the migration outside a transaction the build refuses: no history row, a leftover every later run trips over,
      # no finish under Flyway's own lock, and only the owner's drop and a migration corrected into a transaction as a way out.
      - name: Rehearse a failed migration on the image
        run: ./infra/scripts/migration-failure-rehearsal.sh

  # ---------------------------------------------------------------------------
  # The kind rehearsal (P15-TSK-012, ADR-0120): the platform on a real Kubernetes API as
  # three replicas, the migration Job, smoke through the real edge, a rolling update from
  # N - 1 to N under a workload, a pod killed mid-workload, a rollback by digest and a
  # re-roll, the financial census read from the database after each step.
  #
  # Expensive, so it runs where it pays: on master, nightly and on a pull request that
  # changes deploy/ or the harness. On any other pull request the job's steps are skipped.
  # It holds no credential: every key, password, CA and SCRAM user is generated per run
  # into a temporary directory and handed to the cluster as Secrets (THREAT_MODEL.md T30).
  # Its artefacts - logs, the census per step, the peak, the timings - are kept whether
  # the job went green or red, because the artefacts are the evidence.
  # ---------------------------------------------------------------------------
  rehearsal:
    name: Kubernetes rehearsal (kind, ${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    # P15-TSK-020: the release's walk and the credential and certificate rotations, each on a cluster and a runner of its own. The
    # rotations' leg has its own bound: its rotations alone measured about 110 minutes on a development machine (OPERATIONS_RUNBOOK.md
    # section 11.33), before the image build and the deploy.
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: release
            timeout: 150
          - scope: rotations
            timeout: 240
          # P15-TSK-032 (OPERATIONS_RUNBOOK.md section 11.38): the runbook's procedures against their planted conditions, nightly only
          # (the design's Q10). Each waits for its rules' own `for:` - the longest 80 minutes - so neither belongs on a push.
          - scope: signals
            timeout: 330
            nightly: only
          - scope: incidents
            timeout: 300
            nightly: only
          # P15-TSK-032: Argo CD on the cluster, syncing staging's overlay through a rehearsal root; promote.sh, the smoke, a rollback, a
          # failed hook and its way back (OPERATIONS_RUNBOOK.md section 11.36). Nightly only (and by hand), as the design decided.
          - scope: delivery
            timeout: 180
            nightly: true
    steps:
      - name: Check out, with the history N - 1 is built from
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run only on master, nightly, or when deploy/ or the harness changed
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          NIGHTLY: ${{ matrix.nightly }}
        run: |
          if [ "$NIGHTLY" = only ] && [ "$EVENT" != schedule ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$NIGHTLY" = true ] && [ "$EVENT" != schedule ] && [ "$EVENT" != workflow_dispatch ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" != pull_request ] || git diff --name-only "origin/$BASE...HEAD" | grep -Eq '^(deploy/|infra/scripts/kind-rehearsal|infra/scripts/kind-secrets|infra/scripts/KeyCheckValue\.java$|infra/postgres/|infra/kafka/|infra/scanner-pins\.sh$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the pinned Java version from the version catalog
        id: toolchain
        if: steps.gate.outputs.run == 'true'
        run: |
          version=$(grep -E '^javaToolchain[[:space:]]*=' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::javaToolchain not found in gradle/libs.versions.toml"
            exit 1
          fi
          echo "java-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.toolchain.outputs.java-version }}
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Set up Gradle
        if: steps.gate.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install kind, at the pinned release
        if: steps.gate.outputs.run == 'true'
        run: |
          . infra/scanner-pins.sh
          GOBIN="$HOME/.local/bin" go install "sigs.k8s.io/kind@$KIND_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: The rehearsal
        if: steps.gate.outputs.run == 'true'
        env:
          REHEARSAL_SCOPE: ${{ matrix.scope }}
        run: ./infra/scripts/kind-rehearsal.sh

      - name: Keep the artefacts
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-rehearsal-${{ matrix.scope }}
          path: build/rehearsal/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # The restore rehearsal (P15-TSK-030, OPERATIONS_RUNBOOK.md section 11.35): a logical
  # backup of a database the platform's own services wrote, encrypted as it is written,
  # restored into a fresh PostgreSQL held so that no platform role can log in, its
  # transaction counter moved past the restored journal, and proven financially whole by
  # the platform's own checks before the roles are released; then each kind of corruption
  # planted in a restore of its own and refused by exactly the checks that must see it.
  #
  # Docker and a JDK, no cluster. It runs on master, nightly and on a pull request that
  # changes a migration (what a restore must carry), the harness, its commands, the role
  # script, the PostgreSQL pin or version, the GL chart the seed activates, the build
  # script that launches the commands, or the production code the commands call. It holds
  # no credential: every password and the one backup key are generated per run, the key in
  # a temporary directory the script removes. Its artefacts are logs and verdicts, never
  # the backup.
  # ---------------------------------------------------------------------------
  restore-rehearsal:
    name: Restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run only on master, nightly, or when a migration, the harness or its commands changed
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --name-only "origin/$BASE" HEAD | grep -Eq '(^[a-z]+/src/main/resources/db/migration/|^infra/scripts/restore-rehearsal|^app/src/test/java/com/finapp/app/restore/|^infra/postgres/|^\.github/workflows/ci\.yml$|^gradle/libs\.versions\.toml$|^infra/scripts/kind-rehearsal/gl-mapping\.json$|^app/build\.gradle\.kts$|^deploy/overlays/kind/postgres\.yaml$|^(accounting|ledger|accounts|transfers|lending|bnpl|fx|merchant)/src/main/java/|^app/src/main/java/com/finapp/app/(accounting|ledger|reconciliation)/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the pinned Java version from the version catalog
        id: toolchain
        if: steps.gate.outputs.run == 'true'
        run: |
          version=$(grep -E '^javaToolchain[[:space:]]*=' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::javaToolchain not found in gradle/libs.versions.toml"
            exit 1
          fi
          echo "java-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.toolchain.outputs.java-version }}
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Set up Gradle
        if: steps.gate.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: The rehearsal
        if: steps.gate.outputs.run == 'true'
        run: ./infra/scripts/restore-rehearsal.sh

      - name: Keep the artefacts
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: restore-rehearsal
          path: build/restore-rehearsal/
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Signing, provenance and admission (P15-TSK-007, ADR-0122 decision 3, owner decision C7).
  #
  # Both images of this commit built once (the image jobs prove a second build is the same bytes),
  # pushed by digest to a registry of the job's own, signed and given SLSA provenance and the SBOM
  # as attestations under a key generated for this run, and verified with `cosign verify` before
  # anything deploys them; then the Sigstore policy controller, from its pinned chart, on a kind
  # cluster of the job's own, refusing an unsigned image, one signed by another key and the rest
  # of its cases, each beside a control admitted outside the policy.
  #
  # Keyless signing from this workflow's identity is the reference (C7) and is not built: no
  # registry or Sigstore identity exists (THREAT_MODEL.md section 6 item 35). So the job holds no
  # credential and no OIDC token: the key and its password are generated in a temporary directory
  # and die with the run, and nothing reaches a transparency log. It runs where it pays, as the
  # rehearsal does: on master, nightly, and on a pull request that changes deploy/, the Dockerfile,
  # migrator/, the build logic, the Gradle wrapper and catalogue, the script, the pins or this file.
  # A change to the application's own code reaches it on master and nightly: what it proves is the
  # signing and admission path, not the code inside the image.
  # ---------------------------------------------------------------------------
  admission:
    name: Signing, provenance and admission (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run only on master, nightly, or when what it reads changed
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != pull_request ] || git diff --name-only "origin/$BASE...HEAD" | grep -Eq '^(deploy/|Dockerfile$|migrator/|build-logic/|gradle/|infra/scripts/(admission-check|promote|Promotion)|infra/scanner-pins\.sh$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the pinned Java version from the version catalog
        id: toolchain
        if: steps.gate.outputs.run == 'true'
        run: |
          version=$(grep -E '^javaToolchain[[:space:]]*=' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::javaToolchain not found in gradle/libs.versions.toml"
            exit 1
          fi
          echo "java-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.toolchain.outputs.java-version }}
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Set up Gradle
        if: steps.gate.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install kind, at the pinned release
        if: steps.gate.outputs.run == 'true'
        run: |
          . infra/scanner-pins.sh
          GOBIN="$HOME/.local/bin" go install "sigs.k8s.io/kind@$KIND_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sign, attest and verify both images, then prove admission
        if: steps.gate.outputs.run == 'true'
        run: ./infra/scripts/admission-check.sh

      - name: Keep the artefacts
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admission
          path: build/admission/
          if-no-files-found: error
          retention-days: 30
