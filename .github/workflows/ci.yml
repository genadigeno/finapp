# Continuous integration.
#
# A gate that is not automated is a gate that will be skipped (P0-TSK-004). Every check that
# the Definition of Done relies on runs here, on every change, or it is not a gate.
#
# Supply-chain posture: every third-party action is pinned to a commit SHA and every scanner
# to an image digest, never to a mutable tag. A tag can be repointed by whoever controls the
# repository; a SHA cannot. This is the same reasoning that pins the Gradle distribution by
# checksum in gradle/wrapper/gradle-wrapper.properties. The number of third-party actions is
# deliberately kept small for the same reason.
#
# Jobs are separate so a red build says *which* gate failed at a glance, rather than
# requiring someone to read a log to find out.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, and every job runs - which is deliberate rather than an oversight, though the first
    # version of this comment claimed the opposite.
    #
    # Two of the gates find things that change without the code changing. `dependency-scan` fails
    # on a CVE published against an artefact nobody touched, and `pinned-images` reports a scanner
    # release or a moved tag. Neither is discoverable from a diff, so neither is discoverable at
    # all unless something asks on a timer.
    #
    # `build` and `migrations` run too, and that is cheap insurance rather than a decision: a
    # scheduled run that is green tells you the last merge is still green against today's world.
    - cron: '0 6 * * 1'

# Least privilege. No job here needs to write to the repository; anything that later does
# must raise its own permissions explicitly, at the job level, and be reviewed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded pull-request runs are cancelled; runs on main are not. A main run is the
  # record that a merged change passed its gates, and discarding it to save a few minutes
  # trades evidence for speed — the wrong trade on a platform whose CI results are the
  # justification for believing the build is sound.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Scanner image pins are NOT here. Both live in infra/scanner-pins.sh, and both scanners are
# invoked through infra/scripts/, which this workflow calls - so the local invocation and the CI
# invocation are one definition rather than two that agree today (P0-TSK-031), and a tool can read
# the pins to report when they rot (P0-TSK-040, ADR-0026). Trivy's digest was an `env:` value here
# until then, which is a place nothing reads.

jobs:

  # ---------------------------------------------------------------------------
  # Compile, unit tests, module boundary tests, infrastructure version drift.
  #
  # `./gradlew build` runs whatever checks exist. It gains the ArchUnit rules
  # (P0-TSK-007) and the Testcontainers integration tests (P0-TSK-035) the day
  # those tasks land, with no change needed here.
  # ---------------------------------------------------------------------------
  build:
    name: Build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned Java version from the version catalog
        id: toolchain
        # Read rather than hardcoded: gradle/libs.versions.toml is the single source of
        # truth for versions, and a second copy of "21" in this file would drift silently
        # the day the toolchain is bumped.
        run: |
          version=$(grep -E '^javaToolchain[[:space:]]*=' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::javaToolchain not found in gradle/libs.versions.toml"
            exit 1
          fi
          echo "java-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.toolchain.outputs.java-version }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Verifies gradle-wrapper.jar against Gradle's published checksums. A wrapper jar
          # is executable code committed to the repository, so it is exactly the kind of
          # thing an attacker would prefer to modify quietly.
          validate-wrappers: true

      - name: Build, test and verify
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        # Only on failure: a red CI with no reports costs far more time than the upload.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Migrations apply to an empty database, and the repository still agrees with
  # what was applied.
  #
  # This is the integration check that exists today. It uses compose.yaml rather
  # than a service container so CI runs the *same* pinned PostgreSQL a developer
  # runs locally — infrastructure differing between the two is a defect the test
  # suite cannot see (P0-TSK-003).
  # ---------------------------------------------------------------------------
  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned Java version from the version catalog
        id: toolchain
        run: |
          version=$(grep -E '^javaToolchain[[:space:]]*=' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::javaToolchain not found in gradle/libs.versions.toml"
            exit 1
          fi
          echo "java-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.toolchain.outputs.java-version }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Start PostgreSQL
        # --wait blocks until the container reports healthy, so a migration failure is a
        # real failure rather than a race against startup.
        run: docker compose up -d postgres --wait

      - name: Apply migrations to an empty database
        run: ./gradlew :platform:flywayMigrate --stacktrace

      - name: Validate applied migrations against the repository
        # Fails if an already-applied migration was edited (ADR-0011). This is the
        # automation of P0-TSK-005's "checksum drift fails the build".
        run: ./gradlew :platform:flywayValidate --stacktrace

      - name: Re-apply to prove migrations are idempotent
        run: ./gradlew :platform:flywayMigrate --stacktrace

      - name: Run every test that needs a real database
        # Claims about PostgreSQL and its driver are only worth testing against a real one:
        # monetary round-trips preserving scale (INV-MON-05), privilege-level immutability
        # (INV-HIST-03), idempotency under genuine contention, and readiness reporting UP
        # against a database that is actually there. These are excluded from `build`
        # deliberately, so this job is the only place they run.
        #
        # `databaseTest` unqualified, NOT `:platform:databaseTest`. The qualified form was a
        # list of one that went stale the moment a second module gained database tests:
        # P0-TSK-027 added `:app:databaseTest`, whose whole job is the positive control for
        # readiness, and it would have run on a developer's machine and nowhere else.
        run: ./gradlew databaseTest --stacktrace

      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # Secrets must never reach the repository (.claude/rules/security.md).
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not just the tip: a secret that was committed and later removed is
          # still disclosed, because it remains in the objects anyone can clone.
          fetch-depth: 0

      - name: Scan git history for secrets
        # The same script a developer runs, which is the point: the image pin and the
        # arguments exist once. Its own header carries the reasoning about allowlists and
        # about why history is scanned rather than the working tree.
        #
        # This scan is a NET, not the control. It was probed during P0-TSK-031 and it does
        # not catch `password: hunter2` in a YAML - there is nothing about a memorable
        # password to detect. The control for that is a build rule
        # (CommittedConfigurationHoldsNoSecretTest, run by the `build` job above); see
        # docs/architecture/SECRET_MANAGEMENT.md.
        run: ./infra/scripts/secret-scan.sh

  # ---------------------------------------------------------------------------
  # Known-vulnerable dependencies.
  #
  # Scans a CycloneDX SBOM rather than the build scripts: a scanner cannot resolve
  # Gradle's dependency graph, and the SBOM is the resolved runtime set that
  # actually ships.
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned Java version from the version catalog
        id: toolchain
        run: |
          version=$(grep -E '^javaToolchain[[:space:]]*=' gradle/libs.versions.toml | cut -d'"' -f2)
          if [ -z "$version" ]; then
            echo "::error::javaToolchain not found in gradle/libs.versions.toml"
            exit 1
          fi
          echo "java-version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ steps.toolchain.outputs.java-version }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Generate SBOM
        run: ./gradlew :app:cyclonedxBom --stacktrace

      - name: Scan SBOM for known vulnerabilities
        # The same script a developer runs. Its own header carries the threshold reasoning,
        # and the pin lives in infra/scanner-pins.sh where check-pinned-images.sh can see it.
        run: ./infra/scripts/dependency-scan.sh

  # ---------------------------------------------------------------------------
  # Are the scanner pins still current? (P0-TSK-040, ADR-0026)
  #
  # Dependabot proposes updates for the SHA-pinned actions above. It does not read a shell
  # variable, so the two scanner image pins need their own mechanism - and they are the pins
  # whose rot is least visible, because an outdated scanner does not fail. It reports nothing
  # and looks exactly like a clean scan.
  #
  # This job asks two different questions, and distinguishes them: has the tag MOVED (the
  # attack digest-pinning defends against, and the more serious answer), and is there a NEWER
  # release (rot). A red scheduled run is the reviewable signal.
  #
  # Weekly rather than per-change: a pin does not rot between commits, and a check that fires
  # on every push is one people learn to ignore.
  # ---------------------------------------------------------------------------
  pinned-images:
    name: Scanner pin freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scheduled and manual only. It talks to public registries, so it would otherwise fail on a
    # fork's pull request for reasons unrelated to the change.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the pinned scanner images
        run: ./infra/scripts/check-pinned-images.sh
